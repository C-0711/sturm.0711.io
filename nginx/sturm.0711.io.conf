server {
    listen 80;
    server_name sturm.0711.io;
    client_max_body_size 25M;

    # Statisches UI + API laufen beide auf demselben Node-Prozess (Port 7800)
    location / {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SSE-Endpoint für Workflow-Läufe: keine Pufferung, lange Timeouts.
    # Hintergrund: Mistral-OCR + Claude-Opus-Vision-Calls können pro Stage
    # mehrere Sekunden dauern; ein ELSTER-Durchlauf addiert sich auf 30-60 s.
    location ~ ^/api/workflows/[^/]+/run$ {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 25M;
    }

    # Upload ohne SSE
    location /api/upload {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 25M;
    }
}
