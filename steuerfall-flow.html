<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ELSTER Steuerfall — Lane 1 + Lane 2 · Datenfluss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://esm.sh/reactflow@11.11.4/dist/style.css">
<style>
  :root{
    --ink:#0b0d12; --ink2:#10131b; --panel:#141925; --panel2:#1a2030;
    --line:#222a3a; --grid:#161c28;
    --txt:#e9e7df; --muted:#8b93a6; --faint:#5b6478;
    --teal:#48d6c2;  --teal-dim:#1d3b3a;
    --amber:#eab24c; --amber-dim:#3a2f17;
    --parch:#ece2cd; --slate:#8fa6cc;
    --ok:#74d68a; --gold:#f1c878; --danger:#e8685a;
    --shadow:0 18px 40px -22px rgba(0,0,0,.9), 0 2px 0 rgba(255,255,255,.02) inset;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #15243a55, transparent 60%),
      radial-gradient(900px 500px at 0% 110%, #2a211060, transparent 55%),
      var(--ink);
    color:var(--txt);
    font-family:"Archivo",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ---- header ---- */
  header{
    padding:16px 26px 14px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    background:linear-gradient(180deg,#0e121b,#0b0d12);
    position:relative;z-index:5;
  }
  header .mark{font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.34em;color:var(--amber);text-transform:uppercase}
  header h1{
    margin:7px 0 2px;font-family:"Fraunces",serif;font-weight:900;
    font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;line-height:1;
  }
  header h1 em{font-style:italic;color:var(--teal);font-weight:600}
  header .sub{color:var(--muted);font-size:13px;max-width:60ch}
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .stat{
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);
    text-align:right;min-width:84px;
  }
  .stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px;color:var(--gold);line-height:1.05}
  .stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .stat.ok b{color:var(--ok)}

  .flow{flex:1;position:relative}
  .react-flow__attribution{display:none}
  .react-flow__edge-text{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--txt)}
  .react-flow__edge-textbg{fill:#0b0d12}
  .react-flow__controls{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  .react-flow__controls-button{background:var(--panel);border-bottom:1px solid var(--line);color:var(--txt);fill:var(--txt)}
  .react-flow__controls-button:hover{background:var(--panel2)}

  /* ---- nodes ---- */
  .node{
    width:286px;border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;
    position:relative;animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .node .accent{height:4px;width:100%}
  .node .pad{padding:13px 15px 15px}
  .kicker{font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .title{font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0 0 2px}
  .fn{font:500 10.5px/1.4 "IBM Plex Mono",monospace;color:var(--muted);margin-bottom:10px;word-break:break-word}
  .io{display:flex;flex-direction:column;gap:7px}
  .io-row{display:flex;gap:8px;align-items:flex-start}
  .io-tag{font:600 9px/1.7 "IBM Plex Mono",monospace;letter-spacing:.12em;padding:1px 6px;border-radius:5px;flex:none;margin-top:1px}
  .io-tag.in{color:#9fb4d6;background:#1a2438;border:1px solid #25324b}
  .io-tag.out{color:#0b0d12;background:var(--parch)}
  .chips{display:flex;flex-direction:column;gap:4px}
  .chip{font:500 11px/1.35 "IBM Plex Mono",monospace;color:var(--txt)}
  .chip.dim{color:var(--muted)}
  .io-tag.prod{color:#0b0d12;background:linear-gradient(90deg,var(--teal),var(--amber))}
  .kv{display:grid;grid-template-columns:86px 1fr;gap:9px;align-items:baseline}
  .kv b{font:600 11px/1.5 "IBM Plex Mono",monospace;color:var(--txt)}
  .kv i{font:500 11px/1.5 "IBM Plex Mono",monospace;color:var(--gold);font-style:normal}
  .divr{font:600 8.5px/1.7 "IBM Plex Mono",monospace;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin-top:4px;border-top:1px solid var(--line);padding-top:4px}
  .note{margin-top:10px;font-size:10.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:7px}

  .node.lane1{border-color:#244a47}.node.lane1 .accent{background:linear-gradient(90deg,var(--teal),#2b6f68)}
  .node.lane2{border-color:#4a3c1c}.node.lane2 .accent{background:linear-gradient(90deg,var(--amber),#8a6a23)}
  .node.source .accent{background:linear-gradient(90deg,#cdd6e6,#6c7791)}
  .node.prep .accent{background:linear-gradient(90deg,#9fb4d6,#42506e)}
  .node.merge{border-color:#3a3a44}.node.merge .accent{background:linear-gradient(90deg,var(--parch),#9a927e)}
  .node.check .accent{background:linear-gradient(90deg,var(--ok),#2f7a44)}
  .node.build .accent{background:linear-gradient(90deg,var(--gold),#9a7a2a)}
  .node.output{border-color:#5a4d22}.node.output .accent{background:linear-gradient(90deg,var(--gold),var(--amber))}
  .node.output{width:300px}
  .node.output .title{font-size:21px;color:var(--gold)}

  /* service nodes */
  .svc{
    width:232px;border-radius:12px;background:repeating-linear-gradient(135deg,#11161f,#11161f 7px,#0f141d 7px,#0f141d 14px);
    border:1px dashed #324056;padding:12px 14px;display:flex;gap:11px;align-items:center;
    box-shadow:var(--shadow);animation:rise .5s both;
  }
  .svc .dot{width:9px;height:9px;border-radius:50%;background:var(--slate);box-shadow:0 0 0 4px #8fa6cc22;flex:none}
  .svc .sname{font-family:"Fraunces",serif;font-weight:600;font-size:15px}
  .svc .saddr{font:600 11px/1.3 "IBM Plex Mono",monospace;color:var(--slate)}
  .svc .srole{font-size:10.5px;color:var(--faint)}

  /* ledger node */
  .ledger{
    width:330px;border-radius:14px;background:linear-gradient(180deg,#161208,#0f0c06);
    border:1px solid #4a3c1c;box-shadow:var(--shadow);overflow:hidden;animation:rise .5s both;
  }
  .ledger .lhead{padding:11px 15px;border-bottom:1px solid #342c14;display:flex;justify-content:space-between;align-items:baseline}
  .ledger .lhead b{font-family:"Fraunces",serif;font-weight:600;font-size:15px;color:var(--amber)}
  .ledger .lhead span{font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace}
  thead th{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:7px 8px;text-align:left}
  tbody td{font-size:11px;padding:6px 8px;border-top:1px solid #211a0c;color:var(--txt)}
  tbody td .pa{color:var(--teal)}tbody td .pb{color:var(--amber)}
  tbody td.num{text-align:right;color:var(--gold)}
  .lfoot{padding:9px 12px;border-top:1px solid #342c14;font:500 10.5px/1.5 "IBM Plex Mono",monospace}
  .lfoot .pa{color:var(--teal)}.lfoot .pb{color:var(--amber)}

  /* panels */
  .legend,.foot{
    background:#0d1019ee;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    backdrop-filter:blur(6px);box-shadow:var(--shadow);
  }
  .legend h4,.foot h4{margin:0 0 8px;font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .lg-row{display:flex;align-items:center;gap:9px;font-size:12px;margin:5px 0;color:var(--muted)}
  .swatch{width:16px;height:5px;border-radius:3px;flex:none}
  .foot{max-width:300px}
  .foot p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
  .foot code{font-family:"IBM Plex Mono",monospace;color:var(--teal);font-size:11px}
  .react-flow__handle{width:7px;height:7px;background:#39455a;border:1px solid #5b6478}

  /* dossier — complete extracted field table */
  .dossier{width:436px;border-radius:14px;background:linear-gradient(180deg,#11151e,#0c0f16);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;animation:rise .5s both}
  .dossier--A{border-color:#244a47}.dossier--B{border-color:#4a3c1c}
  .dhead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
  .dossier--A .dhead{background:linear-gradient(90deg,#13302d,transparent)}
  .dossier--B .dhead{background:linear-gradient(90deg,#2e2511,transparent)}
  .dhead b{font-family:"Fraunces",serif;font-weight:600;font-size:17px}
  .dossier--A .dhead b{color:var(--teal)}.dossier--B .dhead b{color:var(--amber)}
  .dhead span{font:600 10px/1 "IBM Plex Mono",monospace;color:var(--faint);letter-spacing:.12em}
  .dbody{padding:4px 0 8px}
  .grp-h{font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:9px 16px 5px;border-top:1px solid #161c28}
  .grp-h:first-child{border-top:0}
  .frow{display:grid;grid-template-columns:80px 64px 48px 1fr;gap:9px;padding:3px 16px;align-items:baseline}
  .frow:hover{background:#ffffff07}
  .fe{font:600 11px/1.35 "IBM Plex Mono",monospace;color:var(--txt)}
  .fw{font:500 11px/1.35 "IBM Plex Mono",monospace;color:var(--gold);text-align:right}
  .fk{font:500 10px/1.4 "IBM Plex Mono",monospace;color:var(--slate)}
  .fl{font-size:10px;line-height:1.4;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="mark">sturm.0711.io · field-mapper</div>
      <h1>ELSTER Steuerfall — <em>Lane 1 + Lane 2</em> Datenfluss</h1>
      <div class="sub">Ein Steuerfall (Stricker), 6 Dokumente → submittable E10-XML. Jeder Knoten zeigt, was hineingeht (IN) und was herauskommt (OUT). Live-Lauf auf H200V, co-located.</div>
    </div>
    <div class="stats">
      <div class="stat"><b>6</b><span>Dokumente</span></div>
      <div class="stat"><b>28</b><span>E-Codes</span></div>
      <div class="stat ok"><b>✓</b><span>ready</span></div>
      <div class="stat"><b>10,1s</b><span>wall-clock</span></div>
    </div>
  </header>
  <div class="flow" id="flow"></div>
</div>

<script type="importmap">
{
  "imports":{
    "react":"https://esm.sh/react@18.3.1",
    "react-dom":"https://esm.sh/react-dom@18.3.1",
    "react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
    "reactflow":"https://esm.sh/reactflow@11.11.4?external=react,react-dom",
    "htm":"https://esm.sh/htm@3.1.1"
  }
}
</script>

<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import ReactFlow, { Background, Controls, MiniMap, Handle, Position, MarkerType, Panel } from "reactflow";
import htm from "htm";
const html = htm.bind(React.createElement);

const C = { teal:"#48d6c2", amber:"#eab24c", parch:"#ece2cd", slate:"#8fa6cc", ok:"#74d68a", gold:"#f1c878" };

/* ---------- custom node renderers ---------- */
function StageNode({ data }){
  return html`
  <div class=${"node "+data.kind} style=${{animationDelay:(data.delay||0)+"ms"}}>
    <${Handle} type="target" position=${Position.Top} id="t" />
    <${Handle} type="target" position=${Position.Left} id="l" />
    <div class="accent"></div>
    <div class="pad">
      <div class="kicker">${data.kicker}</div>
      <div class="title">${data.title}</div>
      ${data.fn && html`<div class="fn">${data.fn}</div>`}
      <div class="io">
        ${data.in && html`<div class="io-row"><span class="io-tag in">IN</span><div class="chips">${data.in.map((c,i)=>html`<span class=${"chip"+(c[0]==="·"?" dim":"")} key=${i}>${c}</span>`)}</div></div>`}
        ${data.out && html`<div class="io-row"><span class="io-tag out">OUT</span><div class="chips">${data.out.map((c,i)=>html`<span class=${"chip"+(c[0]==="·"?" dim":"")} key=${i}>${c}</span>`)}</div></div>`}
        ${data.produced && html`<div class="io-row"><span class="io-tag prod">DATEN</span><div class="chips">${data.produced.map((p,i)=> Array.isArray(p)
          ? html`<span class="kv" key=${i}><b>${p[0]}</b><i>${p[1]}</i></span>`
          : (p[0]==="▸"
             ? html`<span class="divr" key=${i}>${p.slice(1)}</span>`
             : html`<span class=${"chip"+(p[0]==="·"||p[0]==="↳"||p[0]===" "?" dim":"")} key=${i}>${p}</span>`))}</div></div>`}
      </div>
      ${data.note && html`<div class="note">${data.note}</div>`}
    </div>
    <${Handle} type="source" position=${Position.Bottom} id="b" />
    <${Handle} type="source" position=${Position.Right} id="r" />
  </div>`;
}
function ServiceNode({ data }){
  return html`
  <div class="svc" style=${{animationDelay:(data.delay||0)+"ms"}}>
    <${Handle} type="target" position=${Position.Left} id="sl" />
    <${Handle} type="target" position=${Position.Top} id="st" />
    <div class="dot"></div>
    <div>
      <div class="sname">${data.title}</div>
      <div class="saddr">${data.addr}</div>
      <div class="srole">${data.role}</div>
    </div>
    <${Handle} type="source" position=${Position.Bottom} id="sb" />
    <${Handle} type="source" position=${Position.Left} id="slo" style=${{top:"72%"}} />
  </div>`;
}
function LedgerNode({ data }){
  return html`
  <div class="ledger" style=${{animationDelay:(data.delay||0)+"ms"}}>
    <${Handle} type="target" position=${Position.Left} id="lt" />
    <div class="lhead"><b>5 gescannte Bank-Belege</b><span>Lane 2 · OCR</span></div>
    <table>
      <thead><tr><th>Institut</th><th>Person</th><th>KapErt</th><th>KapSt / SolZ / KiSt</th></tr></thead>
      <tbody>
        ${data.rows.map((r,i)=>html`<tr key=${i}>
          <td>${r[0]}</td>
          <td><span class=${r[1][0]==="A"?"pa":"pb"}>${r[1]}</span></td>
          <td class="num">${r[2]}</td>
          <td class="num">${r[3]}</td>
        </tr>`)}
      </tbody>
    </table>
    <div class="lfoot">Σ <span class="pa">A</span> 52 / 11,55 / 0,63 / 1,02<br/>Σ <span class="pb">B</span> 330 / 2,75 / 0,15 / 0,24</div>
  </div>`;
}
function FieldsNode({ data }){
  return html`
  <div class=${"dossier dossier--"+data.person} style=${{animationDelay:(data.delay||0)+"ms"}}>
    <${Handle} type="target" position=${Position.Top} id="dt" />
    <div class="dhead"><b>${data.title}</b><span>${data.total} E-Codes</span></div>
    <div class="dbody">
      ${data.groups.map((g,gi)=>html`
        <div class="grp-h" key=${"h"+gi}>Anlage ${g.anlage} · ${g.rows.length}</div>
        ${g.rows.map((r,ri)=>html`<div class="frow" key=${gi+"-"+ri}>
          <span class="fe">${r[0]}</span><span class="fw">${r[1]}</span>
          <span class="fk">${r[2]}</span><span class="fl" title=${r[3]}>${r[3]}</span>
        </div>`)}
      `)}
    </div>
  </div>`;
}
const nodeTypes = { stage:StageNode, svc:ServiceNode, ledger:LedgerNode, fields:FieldsNode };

/* ---------- nodes ---------- */
let d=0; const D=()=>(d+=70);
const nodes = [
  { id:"in", type:"stage", position:{x:430,y:0}, data:{ kind:"source", delay:D(), kicker:"Eingang", title:"Steuerfall Stricker",
      out:["VAST Belege Stricker.pdf — Digital-Text","5× WhatsApp-Scan .jpg — Bilder"], note:"Mandanten: Rainer (A) & Maria (B) Stricker" }},

  { id:"l1p", type:"stage", position:{x:60,y:215}, data:{ kind:"lane1", delay:D(), kicker:"Lane 1 · deterministisch", title:"Parse · Split · Household",
      fn:"runLane1() → pdftotext · splitVastText · inferHousehold", in:["1 VaSt-PDF (Text)"],
      out:["5 Sections + Household"], produced:[
        "Person A: Rainer Stricker",
        " IdNr 85 236 749 007",
        "Person B: IdNr 54 129 386 608",
        " (Name → in Lane 2 gelernt)",
        "Sections: Religion·A · LStB·A",
        " FSA·A · FSA·A · Religion·B" ] }},
  { id:"l1m", type:"stage", position:{x:60,y:470}, data:{ kind:"lane1", delay:D(), kicker:"Lane 1", title:"mapBeleg × 5",
      fn:"3-Stufen-Kaskade: Label-exakt → Alias → Nummern-Anker (LStB-Nr · Anlage-Zeile)", in:["5 Sections — LStB · FSA · Religion"],
      out:["20 E-Codes (Person A/B)"], produced:[
        "▸ Anlage ESt1A",
        ["E0100081","85236749007"],["E0100201","Stricker"],["E0100301","Rainer"],["E0100402","02"],
        ["E0100082","54129386608"],["E0101002","03"],
        "▸ Anlage N",
        ["E0200002","3"],["E0200201","69292"],["E0200301","7532,00"],["E0200401","0,00"],
        ["E0200501","338,94"],["E0200601","338,94"],["E0201806","300"],
        "▸ Anlage VOR",
        ["E2000501","0"],["E2000601","6544"],["E2000801","6544"],["E2001203","4902"],
        ["E2001505","1427"],["E2004403","915"],
        "▸ Anlage KAP",
        ["E1901402","324"] ] }},

  { id:"i2p", type:"stage", position:{x:770,y:215}, data:{ kind:"prep", delay:D(), kicker:"Phase 0", title:"Bild → PDF",
      fn:"imageToPdf() · sips (Mac) ↦ PIL (H200V)", in:["5 JPG-Scans"], out:["5 image-only PDF","· kein Text-Layer → Lane 2"] }},
  { id:"l2o", type:"stage", position:{x:770,y:430}, data:{ kind:"lane2", delay:D(), kicker:"Lane 2 · OCR", title:"OCR-Ensemble",
      fn:"ocrEnsembleFromPath() → POST /api/v1/ocr-ensemble", in:["5 image-only PDF"],
      out:["consensus_pages: Text + BBox"], produced:[
        "Westerwald[B]  48 rec · bbox ✓",
        "Westerwald[A]  47 rec",
        "LBS Süd[A]     43 rec",
        "Sparkasse[A]   28 rec",
        "Volksbank[B]   72 rec",
        "↳ 'Steuerbescheinigung' · 'Zeile 7 Anlage KAP' · '11,25'" ] }},
  { id:"l2r", type:"stage", position:{x:770,y:690}, data:{ kind:"lane2", delay:D(), kicker:"Lane 2", title:"Reading-Order",
      fn:"ocrEnsembleToRawText() — BBox (y,x) → Zeilen clustern", in:["consensus records + BBox"],
      out:["rawText (Spalten-Layout)"], produced:[
        "Höhe der Kapitalerträge",
        "nach Berücksichtigung …",
        "11,25",
        "(ohne Kapitalerträge …)",
        "Zeile 7 Anlage KAP" ] }},
  { id:"l2m", type:"stage", position:{x:770,y:910}, data:{ kind:"lane2", delay:D(), kicker:"Lane 2", title:"Klassifik. · Person · mapBeleg",
      fn:"detectBelegTyp · resolvePersonByName · Anlage-Zeile-Anker (+Look-Back +Boundary-Guard) · Erträgnis-Summe",
      in:["rawText × 5"], out:["17 roh → 8 KAP (A/B)"], produced:[
        "▸ Person A (Σ 3 Banken)",
        ["E1900701","52"],["E1904701","11,55"],["E1904901","0,63"],["E1904801","1,02"],
        "▸ Person B (Σ 2 Banken)",
        ["E1900701","330"],["E1904701","2,75"],["E1904901","0,15"],["E1904801","0,24"],
        "↳ Volksbank-Summe 319,35 (Erträgnisaufstellung)" ] }},

  { id:"mrg", type:"stage", position:{x:430,y:1170}, data:{ kind:"merge", delay:D(), kicker:"Merge", title:"aggregate()",
      fn:"Dedup / Summe je (Anlage · Kontext · E-Code · Person)", in:["20 (Lane 1)  +  17 (Lane 2)"],
      out:["28 E-Codes"], produced:[
        "20 Lane 1 + 8 Lane 2 (KAP)",
        "= 28 E-Codes",
        "KAP/Person summiert (A · B getrennt)",
        "↳ Detail siehe Dossiers unten" ] }},
  { id:"val", type:"stage", position:{x:430,y:1410}, data:{ kind:"check", delay:D(), kicker:"Gate", title:"Pre-Validate",
      fn:"preValidate() — Catalog regex / Länge / enum", in:["28 E-Codes"], out:["0 errors · 0 warnings → ready ✓"] }},
