name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parity:
    name: ELSTER bundle parity (Task 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root deps
        run: npm ci --no-audit --no-fund
      - name: Typecheck @0711/gitchain-types
        working-directory: packages/gitchain-types
        run: npx --yes typescript@5.6.3 -- tsc --noEmit -p .
      - name: Parity matrix
        run: npx --yes tsx@4 tests/elster/parity.test.ts
