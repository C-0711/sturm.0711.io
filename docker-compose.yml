# STURM — Workflow-Engine Compose
#
# Brings up:
#   - sturm        the Node service on :7800
#
# Mistral + Anthropic + Bearer-Tokens come from .env (gitignored).
# Postgres wurde 2026-05-15 dekommissioniert (Iteration 3, I3.6):
# 4 Tage Uptime, 0 Tabellen, kein einziger Workflow-Connect. Application-
# Instances + Run-Artefakte sind file-backed (CLAUDE.md MVP-Regel). Falls
# später eine echte gitchain-Registry gebraucht wird: separat hochfahren
# und `GITCHAIN_DATABASE_URL` setzen — der Code in src/lib/gitchain-client.ts
# liest diese env-Variable.
# In production we map sturm.0711.io → :7800 via the existing nginx vhost
# at ~/0711/0711-STURM/nginx/sturm.0711.io.conf (host nginx, NOT in compose).
#
# DATA-PATH STRATEGY
# ──────────────────
# To preserve the existing 267 MB workspaces / 141 MB runs / per-mandant
# state on h200v, the live data dirs are bind-mounted from the host onto
# the container. The host paths default to the existing 0711-STURM tree;
# override with STURM_DATA_ROOT in .env if running on a different host.
#
#   STURM_DATA_ROOT=/home/christoph.bertsch/0711/0711-STURM   (h200v default)
#   STURM_DATA_ROOT=./.local-state                            (Mac dev)

services:
  sturm:
    build:
      context: .
      dockerfile: Dockerfile
    image: sturm:0.1.0
    container_name: sturm
    restart: unless-stopped
    ports:
      - "7800:7800"
    environment:
      NODE_ENV: production
      PORT: 7800
      STURM_BEARER_TOKEN: ${STURM_BEARER_TOKEN:?must be set}
      STURM_MASTER_HMAC_KEY: ${STURM_MASTER_HMAC_KEY:?must be set}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?must be set}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?must be set}
      STURM_INPUT_RETENTION_DAYS: "7"
      # Optional: wenn gitchain (separater Service) live ist, env-Var setzen
      # GITCHAIN_DATABASE_URL: postgresql://gitchain:…@gitchain-host:5432/gitchain
      GITCHAIN_DEFAULT_NAMESPACE: ctax
      GITCHAIN_DEFAULT_TENANT: ctax-0711
      # ── Gitchain Tool-Binding (P0) ─────────────────────────────────
      # Container-Registry + git-Anker. Auf h200v laufen API:3361 und
      # Postgres:5440 als separate Dienste; via host-gateway erreichbar.
      GITCHAIN_API_URL: ${GITCHAIN_API_URL:-http://host.docker.internal:3361}
      GITCHAIN_DATABASE_URL: ${GITCHAIN_DATABASE_URL:-postgres://gitchain:gitchain@host.docker.internal:5440/gitchain}
      GITCHAIN_REPO_ROOT: ${GITCHAIN_REPO_ROOT:-/var/lib/gitchain/repos}
      # Lane-5 ELSTER-MCP (Einreichung). Wenn nicht gesetzt, antwortet der
      # Client deterministisch mit { erfolg: false, reason: 'mcp-unavailable' }.
      # P0: Default zeigt auf h200v-Lane-5 (Port 12014) via host-gateway.
      ELSTER_MCP_URL: ${ELSTER_MCP_URL:-http://host.docker.internal:12014/mcp}
      # ── LLM-Backends auf dem Host ───────────────────────────────────
      # `host.docker.internal` ist auf Linux nicht automatisch gemappt —
      # extra_hosts (unten) legt host-gateway als Alias an. Damit erreicht
      # der Container den Host-eigenen Ollama (11434) + vLLM (11435), die
      # für elster-v3/quantum-ground (EmbeddingGemma) und phase3-llm-fill
      # (Gemma-4) gebraucht werden.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      VLLM_URL: ${VLLM_URL:-http://host.docker.internal:11435}
      EMBED_MODEL: ${EMBED_MODEL:-embeddinggemma}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-vllm}
      EMBED_URL: ${EMBED_URL:-http://host.docker.internal:11436}
      # BMF Lane-1 MCP — gleiches Muster (host-gateway).
      BMF_MCP_URL: ${BMF_MCP_URL:-http://host.docker.internal:12010/mcp}
      CTAX_DB_URL: ${CTAX_DB_URL:?CTAX_DB_URL required (set in .env)}
    extra_hosts:
      # Docker for Linux: maps host.docker.internal → host-gateway-IP,
      # damit Container outbound auf am Host gebundene Services zugreifen
      # können (Ollama, vLLM, BMF-MCP). Auf Mac/Windows ohnehin Standard.
      - "host.docker.internal:host-gateway"
    volumes:
      # ── Stateful: bind-mount existing host data so we don't lose live
      #    workspaces / runs / schemas / gitchain repos on cutover.
      - ${STURM_DATA_ROOT:-./.local-state}/workspaces:/app/workspaces
      - ${STURM_DATA_ROOT:-./.local-state}/profiles:/app/profiles
      - ${STURM_DATA_ROOT:-./.local-state}/applications-data:/app/applications-data
      - ${STURM_DATA_ROOT:-./.local-state}/runs:/app/runs
      - ${STURM_DATA_ROOT:-./.local-state}/uploads:/app/uploads
      - ${STURM_DATA_ROOT:-./.local-state}/schemas:/app/schemas
      - ${STURM_DATA_ROOT:-./.local-state}/logs:/app/logs
      # gitchain bare repos already live separately on h200v at
      # ~/gitchain-repos (referenced by GITCHAIN_REPO_ROOT in the env).
      # Override here if the host path differs from default.
      - ${GITCHAIN_REPO_ROOT_HOST:-./.local-state/gitchain-repos}:/app/gitchain-repos
      # Anchor + master keys: read-only mount of the existing host secrets
      # (gitignored on h200v at ~/0711/0711-STURM/.anchor-api-key etc.).
      # Optional — comment out if not yet provisioned.
      - ${STURM_DATA_ROOT:-./.local-state}/.anchor-api-key:/app/.anchor-api-key:ro
      - ${STURM_DATA_ROOT:-./.local-state}/.master-key.json:/app/.master-key.json:ro
      # 1sek / cold-preprocess matcher atoms from STURM-polar
      - /home/christoph.bertsch/0711-STURM-polar/src/verticals/elster-v3/data/atoms.json:/tmp/atoms-polar.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:7800/api/workflows"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Postgres-Service entfernt am 2026-05-15 (Iteration 3, I3.6). Falls jemals
# wieder eine eingebettete gitchain-DB gebraucht wird, hier wieder
# einkommentieren. Das Volume `sturm_postgres` bleibt vorhanden, falls
# das alte Daten-Volume wiederbelebt werden soll:
#   volumes:
#     sturm_postgres:
