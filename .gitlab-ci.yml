# STURM — Workflow-Engine CI
#
# Builds the Docker image and pushes to the GitLab container registry,
# then (on main) bumps the sha tag in ctax/ctax-manifests/overlays/dev/
# so Flux deploys the new build automatically.
#
# Tag scheme:
#   any commit            → :sha-<short>
#                         + :<branch_slug>-sha-<short>
#   main branch           → :main-dev
#   feat/polar-turbo-gemma → :dev + :polar-dev   (legacy, kept for parity)
#   git tag               → :<tag>
#
# Required CI/CD variables (project- or 0711-group-level):
#   MANIFESTS_DEPLOY_KEY  — SSH private key (File-type var) with write
#                           access to ctax/ctax-manifests. Same key used
#                           by ctaxv1 and cb-chat-ctax. See
#                           ctax-manifests/BUILD_STRATEGY.md.

stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  MANIFESTS_REPO: ssh://git@gitlab.mediacockpit.dev:2222/ctax/ctax-manifests.git
  IMAGE_NAME: registry.gitlab.mediacockpit.dev/0711/sturm

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - |
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -eu
      SHORT="${CI_COMMIT_SHORT_SHA}"
      SLUG="${CI_COMMIT_REF_SLUG}"
      IMG="${CI_REGISTRY_IMAGE}"
      echo "Building ${IMG} from ref=${CI_COMMIT_REF_NAME} short=${SHORT}"
      docker build \
        --pull \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "${IMG}:sha-${SHORT}" \
        -t "${IMG}:${SLUG}-sha-${SHORT}" \
        .
      docker push "${IMG}:sha-${SHORT}"
      docker push "${IMG}:${SLUG}-sha-${SHORT}"
      if [ "${CI_COMMIT_REF_NAME}" = "main" ]; then
        docker tag "${IMG}:sha-${SHORT}" "${IMG}:main-dev"
        docker push "${IMG}:main-dev"
      fi
      if [ "${CI_COMMIT_REF_NAME}" = "feat/polar-turbo-gemma" ]; then
        docker tag "${IMG}:sha-${SHORT}" "${IMG}:dev"
        docker tag "${IMG}:sha-${SHORT}" "${IMG}:polar-dev"
        docker push "${IMG}:dev"
        docker push "${IMG}:polar-dev"
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "${IMG}:sha-${SHORT}" "${IMG}:${CI_COMMIT_TAG}"
        docker push "${IMG}:${CI_COMMIT_TAG}"
      fi

# ─────────────────────────────────────────────────────────────────────────
# Stage: deploy — bump sha tag in ctax-manifests/overlays/dev (auto on main)
# Mirrors the pattern used by ctax/cb-chat-ctax and ctax/ctaxv1.
# ─────────────────────────────────────────────────────────────────────────

deploy-dev:
  stage: deploy
  image: registry.mediacockpit.dev/public/docker-alpine-wget:latest
  needs: [build:image]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: dev
    url: https://ctax-dev.internal.infra.bertsch.io
  before_script:
    - eval $(ssh-agent -s)
    - chmod 600 "$MANIFESTS_DEPLOY_KEY"
    - ssh-add "$MANIFESTS_DEPLOY_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -p 2222 gitlab.mediacockpit.dev >> ~/.ssh/known_hosts
    - git config --global user.email "ci@gitlab.mediacockpit.dev"
    - git config --global user.name "GitLab CI (0711/sturm)"
  script:
    - |
      git clone "$MANIFESTS_REPO" ctax-manifests
      cd ctax-manifests
      export IMAGE_TAG="sha-${CI_COMMIT_SHORT_SHA}"
      export TARGET="${IMAGE_NAME}"
      yq -i '(.images[] | select(.name == env(TARGET))).newTag = env(IMAGE_TAG)' overlays/dev/kustomization.yaml
      git diff --quiet && echo "No image changes -- skipping commit" && exit 0
      git commit -am "ci: deploy sturm ${IMAGE_TAG} to dev"
      git push
