<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Quelle anzeigen — Pro-Abrechnung</title>
<script>
  (function() {
    try { var t = localStorage.getItem('sturm-theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); }
    catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system/sturm.css">
<link rel="icon" type="image/svg+xml" href="/design-system/assets/logo-mark.svg">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  .sturm-app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
    height: 100vh;
  }
  .sturm-content {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header.sv-header {
    height: 56px;
    padding: 0 24px;
    display: flex; align-items: center; gap: 16px;
    background: color-mix(in oklab, var(--bg) 88%, transparent);
    border-bottom: 1px solid var(--line-2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    flex: 0 0 auto;
  }
  header.sv-header h1 { font-size: 14px; font-weight: 600; margin: 0; flex-shrink: 0; color: var(--ink); }
  header.sv-header .crumb {
    color: var(--ink-2);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  header.sv-header .crumb b { color: var(--accent); font-weight: 600; }
  .snippet {
    margin-left: auto;
    background: var(--bg-3);
    color: var(--accent);
    padding: 6px 10px;
    border-radius: var(--radius-sm, 4px);
    font-size: 12px;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    max-width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sv-main {
    flex: 1 1 auto;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .page-wrap {
    background: white;
    border: 1px solid var(--line-2);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    position: relative;
    max-width: 1100px;
    width: 100%;
  }
  .page-wrap img { display: block; width: 100%; height: auto; }
  .page-wrap .overlay {
    position: absolute;
    pointer-events: none;
    background: color-mix(in oklab, var(--accent) 35%, transparent);
    border: 2px solid var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 15%, transparent);
    display: none;
  }
  .empty {
    color: var(--ink-2);
    margin: 80px auto;
    text-align: center;
    font-size: 14px;
  }
  .empty code { color: var(--accent); background: var(--bg-3); padding: 2px 6px; border-radius: 3px; }
  .err {
    color: var(--err, #f28b82);
    margin: 80px auto;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="sturm-app">
  <aside id="sturm-nav-host"></aside>
  <main class="sturm-content">
    <header class="sv-header">
      <h1>Quelle</h1>
      <div class="crumb" id="crumb"></div>
      <div class="snippet" id="snippet" hidden></div>
    </header>
    <div class="sv-main" id="main">
      <div class="empty" id="msg">Kein Dokument ausgewählt — wähle einen Fall in der Anwendungen-Liste.</div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script type="module">
  import('/nav.js?v=20260525a').then(({ renderSturmNav }) => {
    renderSturmNav({ activeNav: 'anwendungen' });
  });
</script>

<script>
  const qs = new URLSearchParams(location.search);
  const file = qs.get('file');     // sha256 hex
  const page = parseInt(qs.get('page') || '1', 10);
  const snippetText = qs.get('snippet') || '';
  const filename = qs.get('filename') || '';

  const main = document.getElementById('main');
  const msg = document.getElementById('msg');
  const crumb = document.getElementById('crumb');
  const snippetBox = document.getElementById('snippet');

  if (filename) crumb.innerHTML = `<b>${escapeHtml(filename)}</b> · Seite ${page}`;
  else crumb.textContent = `sha256:${(file || '').slice(0, 12)}… · Seite ${page}`;
  if (snippetText) {
    snippetBox.hidden = false;
    snippetBox.textContent = `"${snippetText}"`;
  }

  if (!file || !/^[0-9a-f]{64}$/i.test(file)) {
    msg.className = 'err';
    msg.textContent = 'Fehlender oder ungültiger file-Parameter (sha256 hex erwartet).';
  } else {
    loadPage();
  }

  async function loadPage() {
    const imgUrl = `/api/source-page/${file}/${page}`;
    try {
      const r = await fetch(imgUrl, { method: 'HEAD' });
      if (!r.ok) {
        msg.className = 'err';
        msg.innerHTML = `Seite nicht im PDF-Cache.<br>
          <small>Lauf den Workflow mindestens einmal mit dieser Datei, damit pdf-render die PNGs erzeugt.</small>`;
        return;
      }
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      const img = document.createElement('img');
      img.src = imgUrl;
      img.alt = `Seite ${page} von ${filename || file.slice(0, 12)}`;
      wrap.appendChild(img);
      main.replaceChildren(wrap);
    } catch (e) {
      msg.className = 'err';
      msg.textContent = `Fehler: ${e.message}`;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
</body>
</html>
