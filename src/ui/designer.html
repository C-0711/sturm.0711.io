<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STURM — Designer</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('sturm-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/design-system/sturm.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ── Canonical STURM sidebar shell (matches anwendungen.html / steuerfall.html) ── */
    html, body { height: 100%; margin: 0; }
    .sturm-app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
      height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }
    #root { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .sturm-sidebar {
      background: var(--bg);
      border-right: 1px solid var(--line-2);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sturm-sidebar.is-collapsed { width: 48px; padding: 16px 6px; }
    .sturm-sb-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 8px 16px;
    }
    .sturm-sb-brand { display: flex; align-items: center; gap: 10px; }
    .sturm-mark {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: linear-gradient(180deg, var(--accent), var(--accent-deep));
      color: var(--on-accent);
      display: grid; place-items: center;
      font-family: 'Geist', sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      box-shadow: 0 0 0 1px oklch(0.85 0.05 85 / 0.15) inset;
      flex-shrink: 0;
    }
    .sturm-brand-word {
      font-weight: 600;
      letter-spacing: 0.16em;
      font-size: 13px;
      color: var(--ink);
    }
    .sturm-sb-toggle {
      display: inline-grid;
      place-items: center;
      width: 28px; height: 28px;
      border: 0;
      background: transparent;
      color: var(--ink-3);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease;
    }
    .sturm-sb-toggle:hover { color: var(--ink); background: var(--bg-2); }
    .sturm-sb-toggle svg { width: 16px; height: 16px; stroke-width: 1.5; }
    .sturm-sb-section {
      margin-top: 24px;
      padding: 8px 12px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      text-transform: uppercase;
    }
    .sturm-sb-nav { display: flex; flex-direction: column; gap: 2px; }
    .sturm-sb-nav-scroll { flex: 1; overflow-y: auto; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    .sturm-sb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--ink-2);
      background: transparent;
      border: 0;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .sturm-sb-item:hover { color: var(--ink); background: var(--bg-2); }
    .sturm-sb-item.is-active { color: var(--ink); background: var(--bg-3); }
    .sturm-sb-item svg { width: 16px; height: 16px; stroke-width: 1.5; flex-shrink: 0; opacity: 0.85; }
    .sturm-sb-item-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .sturm-sb-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
    .sturm-sb-foot {
      margin-top: auto;
      padding: 12px 8px 4px;
      border-top: 1px solid var(--line-2);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sturm-avatar {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--bg-3);
      display: grid; place-items: center;
      font-size: 13px;
      color: var(--ink-2);
    }
    .sturm-sb-user-name { font-size: 13px; color: var(--ink); }
    .sturm-sb-user-plan { font-size: 11px; color: var(--ink-3); }

    .dz-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; max-height: 100vh; }

    /* ============ TOPBAR ============ */
    .dz-top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line-2);
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 40;
      flex-shrink: 0;
    }
    .dz-top-l {
      display: flex; align-items: center; gap: 10px;
      min-width: 0;
    }
    .dz-wf-title-wrap {
      display: flex; align-items: center; gap: 8px;
      padding-left: 4px;
      min-width: 0;
    }
    .dz-wf-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 8px;
      letter-spacing: -0.005em;
      transition: border-color 150ms ease, background 150ms ease;
      min-width: 0;
      width: auto;
      max-width: 280px;
    }
    .dz-wf-title:hover { border-color: var(--line-2); background: var(--bg-2); }
    .dz-wf-title:focus { outline: 0; border-color: var(--line); background: var(--bg-2); }
    .dz-wf-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      padding: 2px 6px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease;
    }
    .dz-wf-id:hover { color: var(--ink-2); border-color: var(--line); }
    .dz-save-state {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      padding: 4px 10px 4px 8px;
    }
    .dz-save-state .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--ok);
    }
    .dz-save-state.dirty .dot { background: var(--warn); }
    .dz-save-state.dirty { color: var(--warn); }

    .dz-top-spacer { flex: 1; }
    .dz-top-r { display: flex; align-items: center; gap: 8px; }

    /* meta popover */
    .meta-pop-wrap { position: relative; }
    .meta-pop {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 360px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 48px oklch(0 0 0 / 0.4);
      padding: 16px;
      z-index: 30;
      display: flex; flex-direction: column; gap: 12px;
    }
    .meta-pop-field { display: flex; flex-direction: column; gap: 4px; }
    .meta-pop-field label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .meta-pop-field input, .meta-pop-field textarea, .meta-pop-field select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      color: var(--ink);
      font-size: 13px;
      font-family: inherit;
      resize: none;
    }
    .meta-pop-field input.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .meta-pop-field input:focus, .meta-pop-field textarea:focus, .meta-pop-field select:focus { outline: 0; border-color: var(--line); }

    /* burger / menu */
    .burger {
      position: relative;
      width: 34px; height: 34px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--ink);
      transition: border-color 150ms ease, background 150ms ease;
    }
    .burger:hover { border-color: var(--ink-3); background: var(--bg-2); }
    .burger .bar {
      position: absolute;
      left: 9px; right: 9px;
      height: 1.5px;
      background: currentColor;
      border-radius: 1px;
      transition: transform 220ms cubic-bezier(.4,1.4,.5,1), top 220ms ease, opacity 160ms ease;
    }
    .burger .bar.b1 { top: 11px; }
    .burger .bar.b2 { top: 16px; }
    .burger .bar.b3 { top: 21px; }
    .burger.open .bar.b1 { top: 16px; transform: rotate(45deg); }
    .burger.open .bar.b2 { opacity: 0; }
    .burger.open .bar.b3 { top: 16px; transform: rotate(-45deg); }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }

    .menu-panel {
      position: fixed;
      top: 56px;
      right: 16px;
      width: 320px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px oklch(0 0 0 / 0.5);
      padding: 8px;
      z-index: 60;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      opacity: 0;
      pointer-events: none;
      transition: transform 200ms cubic-bezier(.2,.7,.2,1), opacity 160ms ease;
    }
    .menu-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .menu-group-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      text-transform: uppercase;
      padding: 12px 12px 4px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 9px 12px;
      background: transparent; border: 0;
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      font-size: 14px;
      transition: background 120ms ease;
      text-decoration: none;
    }
    .menu-item:hover { background: var(--bg-3); }
    .menu-item .icon { color: var(--ink-3); flex-shrink: 0; }
    .menu-item .kbd {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--ink-3);
      padding: 2px 5px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: 4px;
    }
    .menu-item.primary .icon, .menu-item.primary { color: var(--accent); }
    .menu-divider { height: 1px; background: var(--line-2); margin: 6px 8px; }

    .theme-btn {
      width: 34px; height: 34px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--ink-2);
      display: grid; place-items: center;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
    }
    .theme-btn:hover { border-color: var(--ink-3); background: var(--bg-2); color: var(--ink); }

    /* ============ BODY ============ */
    .dz-body {
      flex: 1;
      display: grid;
      grid-template-columns: var(--chat-w, 360px) 1fr var(--inspector-w, 0px);
      min-height: 0;
      transition: grid-template-columns 220ms cubic-bezier(.4,.7,.3,1);
    }
    .dz-body.inspector-open { --inspector-w: 320px; }
    .dz-body.chat-collapsed { --chat-w: 56px; }

    /* ============ CHAT PANEL ============ */
    .chat {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line-2);
      min-height: 0;
      background: var(--bg);
      position: relative;
    }
    .chat-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line-2);
      flex-shrink: 0;
    }
    .chat-head-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.005em;
    }
    .chat-head-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-3);
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chat-head-sub .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--ok);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent); }
      50% { box-shadow: 0 0 0 4px color-mix(in oklab, var(--ok) 0%, transparent); }
    }

    .chat-icon-btn {
      width: 28px; height: 28px;
      background: transparent;
      border: 0;
      border-radius: 5px;
      color: var(--ink-3);
      cursor: pointer;
      display: grid; place-items: center;
      transition: background 120ms ease, color 120ms ease;
    }
    .chat-icon-btn:hover { background: var(--bg-3); color: var(--ink); }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
    }
    .msg {
      display: flex;
      gap: 10px;
      animation: in 280ms cubic-bezier(.3,.7,.3,1);
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 24px; height: 24px;
      border-radius: 6px;
      flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 11px;
      font-weight: 600;
    }
    .msg-avatar.assistant {
      background:
        linear-gradient(180deg,
          oklch(0.2 0.01 60) 0%,
          oklch(0.2 0.01 60) 33.33%,
          oklch(0.55 0.2 25) 33.33%,
          oklch(0.55 0.2 25) 66.66%,
          oklch(0.82 0.17 85) 66.66%,
          oklch(0.82 0.17 85) 100%);
      color: oklch(0.99 0 0);
      text-shadow: 0 1px 2px oklch(0 0 0 / 0.6), 0 0 4px oklch(0 0 0 / 0.4);
      box-shadow: 0 0 0 1px oklch(0 0 0 / 0.2) inset;
    }
    .msg-avatar.user {
      background: var(--bg-3);
      color: var(--ink-2);
      border: 1px solid var(--line-2);
    }
    .msg-body {
      max-width: calc(100% - 38px);
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg.user .msg-body { align-items: flex-end; }
    .msg-text {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--ink);
      padding: 10px 13px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      border-top-left-radius: 4px;
    }
    .msg.user .msg-text {
      background: color-mix(in oklab, var(--accent) 10%, var(--bg-2));
      border-color: color-mix(in oklab, var(--accent) 20%, var(--line-2));
      border-radius: 12px;
      border-top-right-radius: 4px;
    }
    .msg-text p { margin: 0; }
    .msg-text p + p { margin-top: 8px; }
    .msg-text code, .msg-text .em {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      padding: 1px 5px;
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      color: var(--ink);
    }

    .msg-diff {
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--line));
      border-radius: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg-diff-h {
      display: flex; align-items: center; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .msg-diff-h .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .msg-diff-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink-2);
      display: flex; align-items: center; gap: 8px;
    }
    .msg-diff-line .sign {
      display: inline-grid; place-items: center;
      width: 14px; height: 14px;
      border-radius: 3px;
      font-size: 10px;
      color: var(--bg);
    }
    .msg-diff-line .sign.add { background: var(--ok); }
    .msg-diff-line .sign.con { background: var(--accent); }
    .msg-diff-actions {
      display: flex; gap: 6px; margin-top: 4px;
    }
    .msg-diff-btn {
      font-size: 11px;
      padding: 5px 10px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: 5px;
      color: var(--ink-2);
      cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
    }
    .msg-diff-btn:hover { color: var(--ink); border-color: var(--line); background: var(--bg-3); }
    .msg-diff-btn.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .msg-diff-btn.primary:hover { background: oklch(0.86 0.06 85); }

    .msg-attach {
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      max-width: 100%;
    }
    .msg-attach .thumb {
      width: 28px; height: 28px;
      background: var(--bg-3);
      border-radius: 4px;
      display: grid; place-items: center;
      color: var(--ink-2);
      flex-shrink: 0;
    }

    .msg-thinking {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 13px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      border-top-left-radius: 4px;
      font-size: 12.5px;
      color: var(--ink-3);
      font-family: 'JetBrains Mono', monospace;
    }
    .msg-thinking .dots { display: inline-flex; gap: 3px; }
    .msg-thinking .dots span {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--ink-3);
      animation: th 1.2s ease-in-out infinite;
    }
    .msg-thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
    .msg-thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes th { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

    /* chat input */
    .chat-input-wrap {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line-2);
      flex-shrink: 0;
      background: var(--bg);
    }
    .chat-input {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      transition: border-color 150ms ease;
      padding: 4px 4px 4px 12px;
      display: flex; flex-direction: column;
    }
    .chat-input:focus-within { border-color: var(--line); }
    .chat-input textarea {
      width: 100%;
      background: transparent;
      border: 0; outline: 0;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.5;
      font-family: inherit;
      padding: 8px 4px 6px;
      resize: none;
      min-height: 22px;
      max-height: 140px;
    }
    .chat-input textarea::placeholder { color: var(--ink-3); }
    .chat-input-row {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 4px 4px 0;
    }
    .chat-input-row .spacer { flex: 1; }
    .chat-send {
      width: 32px; height: 32px;
      background: var(--accent);
      color: var(--bg);
      border: 0;
      border-radius: 8px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background 150ms ease, transform 120ms ease;
    }
    .chat-send:hover { background: oklch(0.86 0.06 85); }
    .chat-send:active { transform: scale(0.95); }
    .chat-send:disabled { background: var(--bg-3); color: var(--ink-4); cursor: not-allowed; }

    .chat-mic.recording { color: var(--err); }
    .chat-mic.recording::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid var(--err);
      border-radius: 5px;
      animation: ring 1.4s ease-out infinite;
    }
    .chat-mic { position: relative; }
    @keyframes ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }

    /* collapsed chat */
    .dz-body.chat-collapsed .chat > *:not(.chat-collapsed-rail) { display: none; }
    .chat-collapsed-rail {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 12px;
      height: 100%;
    }
    .dz-body.chat-collapsed .chat-collapsed-rail { display: flex; }

    /* ============ CANVAS ============ */
    .dz-canvas {
      position: relative;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(circle at center, oklch(0.3 0.005 80) 1px, transparent 1px);
      background-size: 24px 24px;
      min-width: 0;
    }
    .dz-canvas-tools {
      position: absolute;
      top: 16px; left: 16px;
      display: flex;
      gap: 4px;
      background: color-mix(in oklab, var(--bg-2) 92%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-sm);
      padding: 4px;
      z-index: 2;
    }
    .dz-canvas-tools button {
      width: 28px; height: 28px;
      background: transparent; border: 0;
      color: var(--ink-2);
      border-radius: 4px;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .dz-canvas-tools button:hover { background: var(--bg-3); color: var(--ink); }
    .dz-canvas-tools .sep { width: 1px; background: var(--line-2); margin: 4px 2px; }

    .minimap {
      position: absolute;
      right: 16px; bottom: 16px;
      width: 160px; height: 100px;
      background: color-mix(in oklab, var(--bg-2) 92%, transparent);
      backdrop-filter: blur(6px);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-sm);
      z-index: 2;
    }
    .minimap-vp {
      position: absolute;
      left: 52px; top: 28px;
      width: 50px; height: 32px;
      background: oklch(0.35 0.005 80);
      border-radius: 3px;
    }
    .dz-status {
      position: absolute;
      left: 16px; bottom: 16px;
      display: flex;
      gap: 16px;
      padding: 6px 12px;
      background: color-mix(in oklab, var(--bg-2) 92%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-sm);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      z-index: 2;
    }
    .dz-status strong { color: var(--ink-2); font-weight: 500; }

    /* node */
    .node {
      position: absolute;
      width: 220px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .node:hover { border-color: var(--accent); }
    .node.selected {
      border-color: color-mix(in oklab, var(--accent) 60%, var(--line));
      box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 10%, transparent);
    }
    .node-h {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 4px;
    }
    .node-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-3);
      margin-bottom: 12px;
    }
    .node-port {
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-2);
      padding: 3px 0;
      position: relative;
    }
    .node-port .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--bg);
      border: 1.5px solid var(--accent);
      position: absolute;
      right: -19px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* inspector */
    .inspector {
      background: var(--bg);
      border-left: 1px solid var(--line-2);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .inspector-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line-2);
    }
    .inspector-title {
      font-size: 13px; font-weight: 500;
    }
    .inspector-body {
      padding: 18px 16px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    .insp-field { display: flex; flex-direction: column; gap: 5px; }
    .insp-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .insp-input {
      width: 100%;
      padding: 7px 10px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      color: var(--ink);
      font-size: 13px;
    }
    .insp-input.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    @media (max-width: 960px) {
      .dz-body { grid-template-columns: 1fr; }
      .chat { display: none; }
    }
  </style>
</head>
