<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STURM — OCR Studio</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('sturm-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="sturm.css" />
  <style>
    .ocr-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .ocr-top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--line-2);
      position: sticky; top: 0;
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .ocr-top-l { display: flex; align-items: center; gap: 12px; }
    .ocr-top-title {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .ocr-top-spacer { flex: 1; }
    .ocr-top-actions { display: flex; align-items: center; gap: 10px; }

    .ocr-body {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
    }
    .ocr-pane {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }
    .ocr-pane.right {
      border-left: 1px solid var(--line-2);
    }
    .ocr-pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ocr-pane-head h2 {
      font-size: 15px;
      font-weight: 500;
      margin: 0;
      letter-spacing: -0.005em;
    }
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-2);
    }
    .file-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
    }
    .doc-frame {
      flex: 1;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: grid;
      place-items: center;
      min-height: 480px;
      position: relative;
      background-image:
        linear-gradient(135deg, transparent 49.5%, var(--line-2) 49.5%, var(--line-2) 50.5%, transparent 50.5%),
        linear-gradient(45deg, transparent 49.5%, var(--line-2) 49.5%, var(--line-2) 50.5%, transparent 50.5%);
      background-size: 32px 32px;
    }
    .doc-placeholder {
      width: min(72%, 520px);
      aspect-ratio: 1 / 1.4;
      background: oklch(0.96 0.01 75);
      color: oklch(0.22 0.01 80);
      box-shadow: 0 24px 64px oklch(0 0 0 / 0.35), 0 0 0 1px oklch(0 0 0 / 0.2);
      padding: 36px 28px;
      font-family: 'Geist', sans-serif;
      font-size: 11px;
      line-height: 1.6;
      position: relative;
      overflow: hidden;
    }
    .doc-placeholder::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, transparent 70%, oklch(0 0 0 / 0.04) 100%);
      pointer-events: none;
    }
    .doc-h { font-size: 16px; font-weight: 600; text-align: center; margin: 28px 0 14px; letter-spacing: -0.01em; }
    .doc-rule { border-top: 1px solid oklch(0 0 0 / 0.15); margin: 6px 0; }
    .doc-row { display: flex; justify-content: space-between; font-size: 10.5px; padding: 1px 0; }
    .doc-row .l { max-width: 70%; }
    .doc-row .r { font-variant-numeric: tabular-nums; }
    .doc-from { font-size: 10.5px; text-align: right; line-height: 1.45; color: oklch(0.3 0.01 80); }
    .doc-to { font-size: 10.5px; line-height: 1.45; margin-top: 18px; }
    .doc-stamp { position: absolute; top: 20px; left: 24px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: oklch(0.35 0.01 80); }
    .doc-foot {
      position: absolute; bottom: 16px; right: 24px;
      font-size: 9.5px; color: oklch(0.35 0.01 80);
    }

    /* schema panel */
    .panel-card {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .schema-status {
      font-size: 12.5px;
      color: var(--ink-2);
      padding: 12px 14px;
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.55;
    }
    .schema-status.ok { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, var(--line-2)); background: color-mix(in oklab, var(--ok) 6%, var(--bg-2)); }
    .panel-h {
      font-size: 18px;
      font-weight: 500;
      margin: 4px 0 0;
      letter-spacing: -0.01em;
    }
    .panel-p {
      font-size: 13px;
      color: var(--ink-2);
      margin: 0;
      line-height: 1.55;
      max-width: 48ch;
    }
    .panel-cta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .panel-meta {
      display: flex;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      margin-top: 4px;
    }

    .doc-type-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .doc-type {
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
    }
    .doc-type:hover { border-color: var(--line); color: var(--ink); }
    .doc-type-sub {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--ink-3);
      margin-top: 2px;
    }

    @media (max-width: 920px) {
      .ocr-body { grid-template-columns: 1fr; }
      .ocr-pane.right { border-left: 0; border-top: 1px solid var(--line-2); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" data-presets="react">
const { useState } = React;

const Sun = () => <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" strokeWidth="1.3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M3.5 12.5l1-1M11.5 4.5l1-1" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;
const Plus = () => <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 2.5v8M2.5 6.5h8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>;
const Arr = () => <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M3 6.5h6.5m0 0l-3-3m3 3l-3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Spark = () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5v3M7 9.5v3M1.5 7h3M9.5 7h3M3 3l2 2M9 9l2 2M3 11l2-2M9 5l2-2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>;

const DOC_TYPES = [
  { id: 'kap', label: 'Tax certificate', sub: 'Anlage KAP' },
  { id: 'inv', label: 'Invoice', sub: 'Rechnung' },
  { id: 'rec', label: 'Receipt', sub: 'Quittung' },
  { id: 'stm', label: 'Bank statement', sub: 'Kontoauszug' },
];

function App() {
  const [hasDoc] = useState(true); // toggle to show the empty state
  const [theme, setThemeState] = useState(() => document.documentElement.getAttribute('data-theme') || 'dark');
  const setTheme = (t) => {
    setThemeState(t);
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('sturm-theme', t); } catch (e) {}
  };
  const toggleTheme = () => setTheme(theme === 'dark' ? 'light' : 'dark');
  const Moon = () => <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 9.5A5 5 0 017.5 3a5.5 5.5 0 105.5 6.5z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>;
  return (
    <div className="ocr-shell">
      <header className="ocr-top">
        <div className="ocr-top-l">
          <a href="app.html" className="brand-tile" aria-label="Home">S</a>
          <span className="topbar-sep">/</span>
          <span className="topbar-crumb" style={{fontSize:"14px",fontWeight:500}}>OCR Studio</span>
          <span className="brand-pill">MVP</span>
        </div>
        <div className="ocr-top-spacer" />
        <div className="ocr-top-actions">
          <button className="btn btn-ghost"><Plus /> New variant</button>
          <button className="kbd-pill">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <circle cx="5.5" cy="5.5" r="3.5" stroke="currentColor" strokeWidth="1.3"/>
              <path d="M8.5 8.5L11 11" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
            </svg>
            <span className="kbd">⌘K</span>
          </button>
          <a href="app.html#workflows" className="btn btn-subtle">Workspaces <Arr /></a>
          <a href="app.html#runner" className="btn btn-subtle">Pipelines <Arr /></a>
          <button className="icon-btn" aria-label="Toggle theme" onClick={toggleTheme}>{theme === 'dark' ? <Sun /> : <Moon />}</button>
        </div>
      </header>

      <div className="ocr-body">
        {/* DOCUMENT PANE */}
        <section className="ocr-pane">
          <div className="ocr-pane-head">
            <h2>Document</h2>
            {hasDoc && <span className="file-chip">tax-certificate-2024.jpg</span>}
          </div>
          {hasDoc && (
            <div className="file-meta">tax-certificate-2024.jpg · 74.5 kB · image/jpeg</div>
          )}
          <div className="doc-frame">
            {hasDoc ? (
              <div className="doc-placeholder">
                <div className="doc-stamp">9041667051</div>
                <div className="doc-from">
                  Sparkasse Westerwald-Sieg<br/>
                  Postfach 1155<br/>
                  56463 Bad Marienberg
                </div>
                <div className="doc-to">
                  Mr.<br/>
                  Rainer Stricker<br/>
                  Kirchstr. 4<br/>
                  57629 Malberg
                </div>
                <div className="doc-h">Tax certificate</div>
                <div style={{textAlign: 'center', fontSize: 10.5, marginBottom: 10}}>
                  Certificate for all private accounts and / or deposits
                </div>
                <div className="doc-rule" />
                <div style={{fontSize: 10.5, padding: '4px 0'}}>For Mr. Rainer Stricker, Kirchstr. 4, 57629 Malberg<br/>the following amounts are certified for the calendar year 2024:</div>
                <div className="doc-rule" />
                <div className="doc-row"><span className="l">Capital income · line 7 KAP</span><span className="r">5.06</span></div>
                <div className="doc-row"><span className="l">Used saver's allowance · line 16/17 KAP</span><span className="r">5.06</span></div>
                <div className="doc-row"><span className="l">Capital gains tax · line 37 KAP</span><span className="r">0.00</span></div>
                <div className="doc-row"><span className="l">Solidarity surcharge · line 38 KAP</span><span className="r">0.00</span></div>
                <div className="doc-rule" />
                <div style={{fontSize: 10, marginTop: 10, color: 'oklch(0.35 0.01 80)'}}>
                  Not signed — machine generated (as of 31.01. of the following year).
                </div>
                <div className="doc-foot">Page 1 of 1</div>
              </div>
            ) : (
              <div style={{color: 'var(--ink-3)', fontSize: 13}}>Drop a PDF or image here</div>
            )}
          </div>
        </section>

        {/* SCHEMA / RESULT PANE */}
        <section className="ocr-pane right">
          <div className="ocr-pane-head">
            <h2>Schema</h2>
            <span className="brand-pill">Auto-suggest</span>
          </div>

          <div className="panel-card">
            <div className="schema-status">
              <strong style={{color: 'var(--ok)'}}>Classification succeeded</strong>{'\n'}
              Detected document type:{' '}<span style={{color: 'var(--ink)'}}>tax-certificate (KAP)</span>{'\n'}
              Confidence:{' '}<span style={{color: 'var(--ink)'}}>0.94</span>
            </div>

            <h3 className="panel-h">No schema set</h3>
            <p className="panel-p">Let STURM propose a schema from the detected document type — or attach one manually.</p>

            <div className="panel-cta-row">
              <button className="btn btn-primary"><Spark /> Generate schema & extract</button>
              <button className="btn btn-ghost">Use manual schema</button>
            </div>

            <div className="panel-meta">
              <span>≈ €0.0019</span>
              <span>·</span>
              <span>~12 s (schema generator)</span>
            </div>
          </div>

          <div className="panel-card">
            <div className="ocr-pane-head" style={{marginBottom: 4}}>
              <h2 style={{fontSize: 13, color: 'var(--ink-3)', letterSpacing: '0.04em', textTransform: 'uppercase', fontFamily: 'JetBrains Mono, monospace'}}>Or pick a known type</h2>
            </div>
            <div className="doc-type-grid">
              {DOC_TYPES.map(t => (
                <button key={t.id} className="doc-type">
                  <span>{t.label}</span>
                  <span className="doc-type-sub">{t.sub}</span>
                </button>
              ))}
            </div>
          </div>
        </section>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
