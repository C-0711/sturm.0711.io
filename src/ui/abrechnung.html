<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Pro-Abrechnung — STURM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* A4-printable, lots of whitespace, Steuerberater-formal. */
    :root {
      --ink: #14110b;
      --ink-soft: #4c4534;
      --muted: #8a7f63;
      --rule: #d8cfb6;
      --paper: #fdfbf3;
      --hilite: #faf3dc;
      --refund: #14773c;
      --refund-bg: #e8f5ec;
      --payback: #b45309;
      --payback-bg: #fbf0dd;
      --pill: #efe7cc;
      --pill-ink: #5a4d2e;
      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --serif: 'EB Garamond', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--paper); color: var(--ink); margin: 0; padding: 0; font-family: var(--sans); font-size: 11.5px; line-height: 1.55; }
    .doc { max-width: 820px; margin: 0 auto; padding: 32px 48px 64px; }
    .toolbar { display: flex; gap: 8px; padding: 12px 48px; border-bottom: 1px solid var(--rule); justify-content: space-between; align-items: center; max-width: 820px; margin: 0 auto; }
    .toolbar a, .toolbar button { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-decoration: none; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); cursor: pointer; }
    .toolbar button:hover, .toolbar a:hover { background: var(--hilite); }

    h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    h2 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 28px 0 8px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
    h2 .num { display: inline-block; min-width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
    h3 { font-size: 12px; font-weight: 600; margin: 14px 0 4px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }

    .cover {
      border: 1px solid var(--rule);
      padding: 20px 24px;
      background: linear-gradient(180deg, var(--hilite) 0%, var(--paper) 100%);
      margin-bottom: 8px;
    }
    .cover-meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); margin-top: 12px; }
    .cover-meta b { color: var(--ink); font-weight: 600; }

    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    table.kv td { padding: 4px 8px 4px 0; vertical-align: top; }
    table.kv td.label { color: var(--ink-soft); width: 240px; }
    table.kv td.value { font-weight: 500; }
    table.kv td.cite { font-size: 10px; color: var(--muted); font-family: var(--mono); }

    .ledger { width: 100%; border-collapse: collapse; margin: 4px 0; }
    .ledger td { padding: 5px 8px 5px 0; vertical-align: top; }
    .ledger td.lbl { width: 56%; }
    .ledger td.cite { color: var(--muted); font-family: var(--mono); font-size: 10px; padding-left: 22px; }
    .ledger td.amt { text-align: right; font-weight: 500; min-width: 130px; }
    .ledger td.amt.deduct { color: var(--payback); }
    .ledger tr.subtotal td { border-top: 1px solid var(--rule); padding-top: 6px; }
    .ledger tr.subtotal td.lbl { color: var(--ink-soft); }
    .ledger tr.subtotal td.amt { font-weight: 600; }
    .ledger tr.total td { border-top: 2px solid var(--ink); padding-top: 8px; font-weight: 700; }

    .pill {
      display: inline-block; padding: 1px 7px; border-radius: 10px;
      background: var(--pill); color: var(--pill-ink);
      font-family: var(--mono); font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.02em; vertical-align: middle;
    }
    .pill-doc { background: #e5e8ef; color: #2a3650; }

    /* P6 citation chip — clickable link to source-viewer.html with the
     * rendered PDF page + snippet highlight. */
    .ev-link {
      color: #2a5fbf;
      text-decoration: none;
      border-bottom: 1px dotted #2a5fbf;
      cursor: pointer;
    }
    .ev-link:hover {
      background: #fdd663;
      color: #1a1d23;
      border-bottom-color: transparent;
    }

    .formula {
      font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft);
      background: var(--hilite); border-left: 3px solid var(--rule);
      padding: 8px 12px; margin: 6px 0; white-space: pre-wrap;
    }

    .bilanz {
      margin: 28px 0 18px;
      padding: 18px 24px;
      border: 2px solid var(--rule);
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .bilanz.refund   { border-color: var(--refund);  background: var(--refund-bg);  }
    .bilanz.payback  { border-color: var(--payback); background: var(--payback-bg); }
    .bilanz-label-strong { font-family: var(--serif); font-size: 14px; }
    .bilanz-amount {
      font-family: var(--mono); font-size: 28px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .bilanz.refund .bilanz-amount  { color: var(--refund); }
    .bilanz.payback .bilanz-amount { color: var(--payback); }

    .hinweise {
      background: var(--hilite); border-left: 3px solid var(--payback);
      padding: 10px 14px; margin-top: 12px; font-size: 11px;
    }
    .hinweise h4 { margin: 0 0 6px; font-size: 11px; color: var(--payback); }
    .hinweise li { margin-bottom: 6px; }

    /* Cross-Doc-Audit (Gemma-4) */
    .cd-audit {
      margin-top: 16px; padding: 12px 14px;
      border: 1px solid var(--rule); border-left: 3px solid #5a8fd0;
      background: #f7faff; border-radius: 4px; font-size: 11px;
    }
    .cd-audit h4 { margin: 0 0 8px; font-size: 12px; color: #2b5a99; }
    .cd-summary { margin: 0 0 10px; font-size: 11px; font-style: italic; color: var(--ink); }
    .cd-warnings { list-style: none; padding: 0; margin: 0 0 8px; }
    .cd-warnings li { padding: 6px 8px; margin-bottom: 4px; border-radius: 3px; }
    .cd-warn-info  { background: #eef4fc; }
    .cd-warn-warn  { background: #fff4d6; }
    .cd-warn-error { background: #fbeded; color: #8c3a3a; }
    .cd-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .cd-section { margin-top: 8px; }
    .cd-section ul { margin: 4px 0 0 18px; padding: 0; }
    .cd-section li { margin-bottom: 2px; }
    .cd-audit code { background: var(--pill); padding: 1px 4px; border-radius: 2px; font-size: 10px; }
    .cd-audit-skip { background: var(--pill); border-left-color: var(--muted); color: var(--muted); padding: 6px 10px; font-size: 10px; }
    .cd-audit-clean { background: #f1f7f0; border-left-color: var(--refund); }
    .cd-audit-clean h4 { color: #3a6b3a; }

    .audit { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--rule); }
    .audit-pills { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
    .audit-pill { padding: 2px 9px; border-radius: 12px; background: var(--pill); color: var(--ink); }
    .audit-pill.s-high       { background: #d5ead9; color: #14773c; }
    .audit-pill.s-medium     { background: #e7e2cf; color: #6a5a30; }
    .audit-pill.s-low        { background: #efe1d0; color: #8a5a1a; }
    .audit-pill.s-suspicious { background: #f3d5cf; color: #a33232; }

    .footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 10px; color: var(--muted); font-family: var(--mono); }

    .empty { padding: 60px 0; text-align: center; color: var(--muted); }

    @media print {
      body { background: white; }
      .toolbar { display: none; }
      .doc { padding: 16mm; max-width: none; }
      h2 { page-break-after: avoid; }
      .ledger tr, .audit { page-break-inside: avoid; }
      .bilanz { page-break-inside: avoid; }
    }
    @page { size: A4; margin: 0; }

    /* ── Steuerassistent (Gemma-4 als Orchestrator) ─────────────────── */
    .assistant {
      position: fixed; bottom: 16px; right: 16px; z-index: 50;
      width: 380px; max-width: calc(100vw - 32px);
      background: white; border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      font-size: 12px; font-family: var(--sans);
      display: flex; flex-direction: column;
      max-height: 60vh;
      transition: transform 200ms ease, opacity 200ms ease;
    }
    .assistant.collapsed { transform: translateY(calc(100% - 44px)); }
    .assistant-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--rule);
    }
    .assistant-head .title { font-weight: 600; font-family: var(--serif); font-size: 13px; }
    .assistant-head .toggle { font-size: 16px; color: var(--muted); }
    .assistant-body { padding: 10px 14px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .assistant-msg { padding: 8px 12px; border-radius: 8px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .assistant-msg.user { background: var(--pill); align-self: flex-end; max-width: 85%; }
    .assistant-msg.bot  { background: #f8f6ef; border: 1px solid var(--rule); align-self: flex-start; max-width: 95%; }
    .assistant-msg.bot.thinking { color: var(--muted); font-style: italic; }
    .assistant-form { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--rule); }
    .assistant-form textarea {
      flex: 1; resize: none; border: 1px solid var(--rule); border-radius: 6px;
      padding: 6px 8px; font: inherit; min-height: 32px; max-height: 80px;
    }
    .assistant-form button {
      padding: 6px 14px; border: 1px solid var(--ink); background: var(--ink); color: white;
      border-radius: 6px; font: inherit; font-weight: 500; cursor: pointer;
    }
    .assistant-form button:disabled { background: var(--muted); border-color: var(--muted); cursor: wait; }
    .assistant-empty { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .assistant-empty .hint { margin-top: 4px; }
    .assistant-empty .hint code { background: var(--pill); padding: 1px 5px; border-radius: 3px; font-size: 10px; }

    @media print { .assistant { display: none; } }
  </style>
</head>
<body>

<nav class="toolbar">
  <a id="back-link" href="/anwendungen.html">← zurück zur Anwendung</a>
  <div>
    <button onclick="window.print()">Drucken / PDF speichern</button>
    <a id="json-link" href="#" target="_blank">JSON-Audit</a>
  </div>
</nav>

<main class="doc" id="doc">
  <div class="empty" id="loading">Lade Steuerfall…</div>
</main>

<aside class="assistant collapsed" id="assistant" aria-label="Steuerassistent">
  <div class="assistant-head" id="assistant-head">
    <span class="title">💬 Steuerassistent</span>
    <span class="toggle" id="assistant-toggle">▴</span>
  </div>
  <div class="assistant-body" id="assistant-body">
    <div class="assistant-empty">
      Frag mich zur Abrechnung dieses Steuerfalls — z.B.
      <div class="hint"><code>Warum ist die Erstattung niedriger als erwartet?</code></div>
      <div class="hint"><code>Welche Anlagen wurden erkannt?</code></div>
      <div class="hint"><code>Was ist mein zvE?</code></div>
    </div>
  </div>
  <form class="assistant-form" id="assistant-form">
    <textarea id="assistant-input" placeholder="Frage stellen…" rows="1"></textarea>
    <button type="submit" id="assistant-send">Senden</button>
  </form>
</aside>

<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const APP = params.get('app') || 'steuerfall-est';
  const CASE = params.get('case');
  if (!CASE) {
    document.getElementById('loading').innerHTML = 'Aufruf mit <code>?app=steuerfall-est&case=…</code> nötig. <a href="/anwendungen.html">Zu den Anwendungen</a>';
    return;
  }
  document.getElementById('back-link').href = `/steuerfall.html?app=${encodeURIComponent(APP)}&case=${encodeURIComponent(CASE)}`;
  document.getElementById('json-link').href = `/api/applications/${encodeURIComponent(APP)}/instances/${encodeURIComponent(CASE)}/master`;

  // ?refresh=1 — persistierte master.json kann nach Upload-Race veraltet
  // sein (writeCaseMaster lief bevor alle Stage-Outputs geflusht waren).
  const r = await fetch(`/api/applications/${encodeURIComponent(APP)}/instances/${encodeURIComponent(CASE)}/master?refresh=1`);
  if (!r.ok) { document.getElementById('loading').textContent = `HTTP ${r.status} beim Laden des Falls`; return; }
  const data = await r.json();
  render(data);
})();

function fmtEur(v, decimals = 2) {
  if (v == null || v === '' || isNaN(Number(v))) return '—';
  return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(Number(v));
}
function fmtDate(s) {
  if (!s) return '—';
  return s;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function germanDecimalToNumber(s) {
  if (s == null) return 0;
  if (typeof s === 'number') return s;
  const t0 = String(s).trim();
  // Bereits dezimal-formatiert (Punkt = Dezimal) → direkt parsen.
  // Beispiel: "30707.00", "4019.16", "0.00", "-1234.5"
  if (/^-?\d+\.\d{1,4}$/.test(t0)) return Number(t0);
  // Reine Ganzzahl → direkt parsen.
  if (/^-?\d+$/.test(t0)) return Number(t0);
  // Sonst: deutsches Format "1.234,56" oder "1234,56".
  const t = t0.replace(/\./g, '').replace(',', '.');
  const n = Number(t);
  return isFinite(n) ? n : 0;
}
function trustClass(t) { return ({high:'s-high', medium:'s-medium', low:'s-low', suspicious:'s-suspicious'})[t] || 'audit-pill'; }

// §EStG-Citation für kontextPath (Mini-Klon der estg-citations.ts-Map)
const KPATH = {
  ArbL: '§19 EStG',
  ArbL_LStB: '§19 / §41b EStG',
  Wege: '§9 Abs. 1 Nr. 4 EStG',
  Werbe: '§9 EStG',
  KapErt: '§20 EStG',
  KapErt_inl_StAbz: '§20 EStG',
  KapErt_inl_oStAbz: '§20 EStG',
  KapErt_Ausl: '§20 EStG',
  Ant: '§32d EStG',
  AVor: '§10a EStG',
  Beitr_g_KV_PV_Inl: '§10 Abs. 1 Nr. 3 EStG',
  Beitr_BasisRente: '§10 Abs. 1 Nr. 2 EStG',
  Beitr_AL_Vers: '§10 Abs. 1 Nr. 3a EStG',
  KiSt: '§10 Abs. 1 Nr. 4 EStG',
  Sonderausg: '§10 EStG',
  SpendeMitglied: '§10b EStG',
  AgB: '§33 EStG',
  HA_35a: '§35a EStG',
  Allg: 'ESt1A',
  Art_Erkl: '§25 EStG',
  Bankverb: '§37 AO',
  Veranl: '§26 EStG',
  Rente_gRV: '§22 Nr. 1 EStG',
  Rente_pPriv: '§22 Nr. 5 EStG',
  Vermiet: '§21 EStG',
  GewerbeBetrieb: '§15 EStG',
  Selbst: '§18 EStG',
  Kind: '§32 EStG',
  Fam_Stift_P15_AStG: '§15 AStG',
};
function citation(kontextPath, anlage) {
  if (kontextPath && KPATH[kontextPath]) return KPATH[kontextPath];
  const byAnlage = { N: '§19 EStG', KAP: '§20 EStG', VOR: '§10 EStG', SA: '§10 EStG', AV: '§10a EStG', R: '§22 EStG', V: '§21 EStG', G: '§15 EStG', S: '§18 EStG', ESt1A: 'ESt1A' };
  return byAnlage[anlage] || (anlage ? `Anlage ${anlage}` : 'BMF');
}

/** §32a EStG Grundtabelle für ein gegebenes zvE + Steuerjahr.
 *  Wird benutzt um den Splittingtarif-Vorteil zu berechnen (Single-ESt
 *  auf das volle zvE, minus Splittingtarif-ESt). */
function calcEst32a(zve, jahr) {
  if (zve <= 0) return 0;
  // §32a Koeffizienten 2023 vs 2024
  const cfg = (jahr === 2023) ? {
    GFB: 10908, Z2_START: 10909, Z3_START: 16000, Z4_START: 62810, Z5_START: 277826,
    Z2_A: 979.18, Z2_B: 1400,
    Z3_A: 192.59, Z3_B: 2397, Z3_C: 966.53,
    Z4_K: 0.42, Z4_C: 9972.98,
    Z5_K: 0.45, Z5_C: 18307.73,
    Z2_BASE: 10908, Z3_BASE: 15999,
  } : {
    GFB: 11784, Z2_START: 11785, Z3_START: 17006, Z4_START: 66761, Z5_START: 277826,
    Z2_A: 922.98, Z2_B: 1400,
    Z3_A: 181.19, Z3_B: 2397, Z3_C: 1015.13,
    Z4_K: 0.42, Z4_C: 10602.13,
    Z5_K: 0.45, Z5_C: 18936.88,
    Z2_BASE: 11784, Z3_BASE: 17005,
  };
  if (zve <= cfg.GFB) return 0;
  if (zve < cfg.Z3_START) {
    const y = (zve - cfg.Z2_BASE) / 10000;
    return Math.floor((cfg.Z2_A * y + cfg.Z2_B) * y);
  }
  if (zve < cfg.Z4_START) {
    const z = (zve - cfg.Z3_BASE) / 10000;
    return Math.floor((cfg.Z3_A * z + cfg.Z3_B) * z + cfg.Z3_C);
  }
  if (zve < cfg.Z5_START) {
    return Math.floor(cfg.Z4_K * zve - cfg.Z4_C);
  }
  return Math.floor(cfg.Z5_K * zve - cfg.Z5_C);
}

/** Vorsorge-Höchstbetragsberechnung als Tabelle (§10 Abs. 3,4 EStG).
 *  Zeigt die intermediären Werte aus der BMF-PostgreSQL-Formel-Engine. */
function renderVorsorgeBreakdown(vb, ev) {
  if (!vb || typeof vb !== 'object' || !('vorsorgeaufwand_total' in vb)) return '';
  const num = (k) => Number(vb[k] || 0);
  return `
    <h3 style="margin-top:14px">Höchstbetrags-Berechnung §10 Abs. 3, 4 EStG</h3>
    <table class="ledger">
      <tr><td class="lbl" colspan="2"><i>Basisversorgung (§10 Abs. 1 Nr. 2 — RV/Altersvorsorge)</i></td></tr>
      <tr><td class="lbl">RV-Beitrag AN ${fmtEur(num('rv_beitraege'))} + AG ${fmtEur(num('rv_beitraege_ag'))}</td><td class="amt">${fmtEur(num('rv_gesamt'))}</td></tr>
      <tr><td class="lbl">Höchstbetrag (${(num('rv_av_abzugsfaehig_prozent')*100).toFixed(0)} % von Höchstbetrag-RV/AV ${fmtEur(num('rv_av_hoechstbetrag'))})</td><td class="amt" style="font-weight:400">≤ ${fmtEur(num('rv_av_hoechstbetrag') * num('rv_av_abzugsfaehig_prozent'))}</td></tr>
      <tr><td class="lbl">− AG-Anteil bereits steuerfrei (§3 Nr. 62 EStG)</td><td class="amt deduct">−${fmtEur(num('rv_beitraege_ag'))}</td></tr>
      <tr class="subtotal"><td class="lbl"><b>rv_abzugsfaehig</b></td><td class="amt"><b>${fmtEur(num('rv_abzugsfaehig'))}</b></td></tr>
      <tr><td class="cite" colspan="2">Formel: min(rv_gesamt × ${(num('rv_av_abzugsfaehig_prozent')*100).toFixed(0)}%, rv_av_hoechstbetrag × ${(num('rv_av_abzugsfaehig_prozent')*100).toFixed(0)}%) − rv_beitraege_ag</td></tr>

      <tr><td class="lbl" colspan="2"><br><i>Basis-KV / PV (§10 Abs. 1 Nr. 3 EStG)</i></td></tr>
      <tr><td class="lbl">KV-Beitrag AN</td><td class="amt">${fmtEur(num('kv_beitraege'))}</td></tr>
      <tr><td class="lbl">− Kürzung Krankengeld-Anteil (${(num('kv_kuerzung_krankengeld')*100).toFixed(1)} %)</td><td class="amt deduct">−${fmtEur(num('kv_kuerzung_betrag'))}</td></tr>
      <tr><td class="lbl"><b>kv_basis_abzugsfaehig</b></td><td class="amt">${fmtEur(num('kv_basis_abzugsfaehig'))}</td></tr>
      <tr><td class="lbl">+ pv_basis_abzugsfaehig (PV-AN ${fmtEur(num('pv_beitraege'))})</td><td class="amt">${fmtEur(num('pv_basis_abzugsfaehig'))}</td></tr>
      <tr class="subtotal"><td class="lbl"><b>basis_kv_pv</b></td><td class="amt"><b>${fmtEur(num('basis_kv_pv'))}</b></td></tr>

      <tr><td class="lbl" colspan="2"><br><i>Sonstige Vorsorge (§10 Abs. 1 Nr. 3a EStG)</i></td></tr>
      <tr><td class="lbl">AV-Beitrag + Wahlleistungen + Haftpflicht etc.</td><td class="amt">${fmtEur(num('sonstige_input'))}</td></tr>
      <tr><td class="lbl">Höchstbetrag Arbeitnehmer ${fmtEur(num('sonstige_hoechstbetrag_an'))}</td><td class="amt" style="font-weight:400">≤ ${fmtEur(num('sonstige_limit'))}</td></tr>
      <tr class="subtotal"><td class="lbl"><b>sonstige_abzugsfaehig</b></td><td class="amt"><b>${fmtEur(num('sonstige_abzugsfaehig'))}</b></td></tr>

      <tr class="total"><td class="lbl">vorsorgeaufwand_total = rv_abzugsfaehig + basis_kv_pv + sonstige_abzugsfaehig</td><td class="amt">${fmtEur(num('vorsorgeaufwand_total'))}</td></tr>
    </table>
  `;
}

function pickEntry(ml, ecode) { return ml[ecode]; }
function v(ml, ecode) { const e = ml[ecode]; return e ? e.value : null; }
function vNum(ml, ecode) {
  const e = ml[ecode];
  if (!e) return 0;
  // 1. Bevorzugt normalizedNumber (vom Backend bereits sauber geparsed).
  if (typeof e.normalizedNumber === 'number' && isFinite(e.normalizedNumber)) {
    return e.normalizedNumber;
  }
  // 2. Sonst normalized als String (kann Integer-EUR oder Decimal-EUR sein).
  //    Nicht mehr blind /100 — das war der 10x/100x-Bug.
  if (e.normalized != null && e.normalized !== '') {
    return germanDecimalToNumber(e.normalized);
  }
  // 3. Fallback: rohes value-Feld (kann "69.291,80 €" oder "69.291,80" sein).
  return germanDecimalToNumber(String(e.value || '').replace(/[€\s]/g, ''));
}

// P6: evidence() returns HTML. If the master entry's first confirmed_by
// source has {page, snippet, filename + sha256} we can resolve, we wrap the
// doc-part in a link to /source-viewer.html so the user can jump to the
// rendered PDF page with the snippet highlighted.
//   "Anlage N · Z.5 · stricker.pdf ↗"  ←  clickable
//   "Anlage N · Z.5 · stricker.pdf"    ←  fallback (no page info)
// Resolves the first source (filename + sha256 + page + snippet) for an entry.
// Returns null when not enough info to build a viewer link.
function resolveSource(entry, masterDocs) {
  if (!entry) return null;
  const sources = entry.confirmed_by || [];
  const first = sources[0];
  if (!first || !first.filename) return null;
  let sha = null;
  if (Array.isArray(masterDocs)) {
    const docMeta = masterDocs.find((d) => d.filename === first.filename);
    if (docMeta && typeof docMeta.sha256 === 'string' && /^[0-9a-f]{64}$/i.test(docMeta.sha256)) {
      sha = docMeta.sha256;
    }
  }
  if (!sha) return null;
  // Page tolerant: wenn keine Seite bekannt → Page 1, sonst 1-based für Viewer-URL.
  const page = (typeof first.page === 'number' && first.page >= 0) ? first.page + 1 : 1;
  return {
    sha256: sha,
    page,
    filename: first.filename,
    snippet: first.snippet || '',
  };
}

// Builds inline HTML attributes carrying source info — to put on ANY element
// (tr, td, span) so the body-level mouseover handler can pick it up.
function sourceDataAttrs(entry, masterDocs) {
  const s = resolveSource(entry, masterDocs);
  if (!s) return '';
  return ` data-sha256="${escapeAttr(s.sha256)}"`
       + ` data-page="${s.page}"`
       + ` data-filename="${escapeAttr(s.filename)}"`
       + (s.snippet ? ` data-snippet="${escapeAttr(s.snippet)}"` : '');
}

function evidence(entry, ml, masterDocs) {
  if (!entry) return '';
  const z = entry.vordruckzeile ? `Z.${entry.vordruckzeile}` : '';
  const a = entry.anlage ? `Anlage ${entry.anlage}` : '';
  const prefix = [a, z].filter(Boolean).join(' · ');

  const sources = entry.confirmed_by || [];
  if (sources.length === 0) return prefix;

  const first = sources[0];
  const filename = first.filename || '';
  if (!filename) return prefix;

  // Resolve sha256 by matching filename against the case documents.
  let sha = null;
  if (Array.isArray(masterDocs)) {
    const docMeta = masterDocs.find((d) => d.filename === filename);
    if (docMeta && typeof docMeta.sha256 === 'string' && /^[0-9a-f]{64}$/i.test(docMeta.sha256)) {
      sha = docMeta.sha256;
    }
  }
  const moreSuffix = sources.length > 1 ? ` +${sources.length - 1}` : '';
  const docPart = `${escapeHtml(filename)}${moreSuffix}`;

  // Build clickable chip when we have sha+page (1-based for the viewer URL).
  if (sha && typeof first.page === 'number' && first.page >= 0) {
    const pageOneBased = first.page + 1;
    const snippet = first.snippet ? first.snippet : '';
    const href =
      `/source-viewer.html?file=${encodeURIComponent(sha)}` +
      `&page=${pageOneBased}` +
      `&filename=${encodeURIComponent(filename)}` +
      `&snippet=${encodeURIComponent(snippet)}`;
    const titleAttr = snippet
      ? ` title="${escapeAttr(snippet)}"`
      : '';
    // data-* Attribute fürs Parent-Frame Hover-Routing (m-case.html
    // listened auf postMessage und aktualisiert den rechten Viewer).
    const dataAttrs =
      ` data-sha256="${escapeAttr(sha)}"` +
      ` data-page="${pageOneBased}"` +
      ` data-filename="${escapeAttr(filename)}"` +
      (snippet ? ` data-snippet="${escapeAttr(snippet)}"` : '');
    const link = `<a class="ev-link" href="${href}" target="_blank" rel="noopener"${titleAttr}${dataAttrs}>${docPart} · Seite&nbsp;${pageOneBased} ↗</a>`;
    return [prefix, link].filter(Boolean).join(' · ');
  }
  // Fallback: no page info — render as plain text.
  return [prefix, docPart].filter(Boolean).join(' · ');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// Cross-Doc-Audit (Gemma-4 reasoning über master.json)
function renderCrossDocAudit(audit) {
  if (!audit || !audit.ran) {
    if (audit && audit.reason) {
      return `<div class="cd-audit cd-audit-skip">
        <small>Cross-Doc-Audit (Gemma-4) nicht ausgeführt: ${escapeHtml(audit.reason)}</small>
      </div>`;
    }
    return '';
  }
  const warnings = Array.isArray(audit.warnings) ? audit.warnings : [];
  const yearOk = Array.isArray(audit.year_carryover_ok) ? audit.year_carryover_ok : [];
  const yearBlocked = Array.isArray(audit.year_carryover_blocked) ? audit.year_carryover_blocked : [];
  const personen = Array.isArray(audit.person_zuordnung) ? audit.person_zuordnung : [];
  const missing = Array.isArray(audit.missing_anlagen) ? audit.missing_anlagen : [];
  const summary = typeof audit.summary === 'string' ? audit.summary : '';
  if (warnings.length === 0 && yearBlocked.length === 0 && missing.length === 0 && !summary) {
    return `<div class="cd-audit cd-audit-clean">
      <h4>✓ Cross-Doc-Audit (Gemma-4)</h4>
      <small>Keine Auffälligkeiten über alle Belege hinweg.</small>
    </div>`;
  }
  const sevClass = (s) => s === 'error' ? 'cd-warn-error' : (s === 'warn' ? 'cd-warn-warn' : 'cd-warn-info');
  const sevIcon = (s) => s === 'error' ? '🛑' : (s === 'warn' ? '⚠️' : 'ℹ️');
  return `<div class="cd-audit">
    <h4>🤖 Cross-Doc-Audit (Gemma-4)</h4>
    ${summary ? `<p class="cd-summary">${escapeHtml(summary)}</p>` : ''}
    ${warnings.length > 0 ? `
      <ul class="cd-warnings">
        ${warnings.map((w) => `<li class="${sevClass(w.severity)}">
          ${sevIcon(w.severity)} <b>${escapeHtml(w.kategorie || '')}:</b> ${escapeHtml(w.message || '')}
          ${(w.betrifft_ecodes || []).length ? `<div class="cd-meta">eCodes: ${w.betrifft_ecodes.map(e => `<code>${escapeHtml(e)}</code>`).join(' ')}</div>` : ''}
          ${(w.betrifft_dokumente || []).length ? `<div class="cd-meta">Belege: ${w.betrifft_dokumente.map(d => `<span class="pill pill-doc">${escapeHtml(d)}</span>`).join(' ')}</div>` : ''}
        </li>`).join('')}
      </ul>` : ''}
    ${missing.length > 0 ? `
      <div class="cd-section">
        <b>Vermutlich fehlende Anlagen:</b>
        <ul>${missing.map((m) => `<li>Anlage <b>${escapeHtml(m.anlage)}</b> — ${escapeHtml(m.reason || '')}</li>`).join('')}</ul>
      </div>` : ''}
    ${yearBlocked.length > 0 ? `
      <div class="cd-section">
        <b>Jahresgebundene Werte aus anderem VZ — nicht anrechenbar:</b>
        <ul>${yearBlocked.map((y) => `<li><code>${escapeHtml(y.ecode)}</code> aus VZ ${y.from_jahr} — ${escapeHtml(y.reason || '')}</li>`).join('')}</ul>
      </div>` : ''}
    ${yearOk.length > 0 ? `
      <div class="cd-section">
        <b>Jahresübergreifend übernommen (Stammdaten / Pauschalen):</b>
        <ul>${yearOk.map((y) => `<li><code>${escapeHtml(y.ecode)}</code> aus VZ ${y.from_jahr} — ${escapeHtml(y.reason || '')}</li>`).join('')}</ul>
      </div>` : ''}
    ${personen.length > 0 ? `
      <div class="cd-section">
        <b>Personen-Zuordnung pro Beleg:</b>
        <ul>${personen.map((p) => `<li><span class="pill pill-doc">${escapeHtml(p.dokument)}</span> → <b>Person ${escapeHtml(p.person)}</b> · ${escapeHtml(p.begruendung || '')}</li>`).join('')}</ul>
      </div>` : ''}
  </div>`;
}
function escapeAttr(s) {

}

// ── Steuerassistent (Gemma-4 als Orchestrator) ─────────────────────
(function setupAssistant() {
  const params = new URLSearchParams(location.search);
  const APP = params.get('app') || 'steuerfall-est';
  const CASE = params.get('case');
  if (!CASE) return; // ohne Case kein Chat

  const root = document.getElementById('assistant');
  const head = document.getElementById('assistant-head');
  const body = document.getElementById('assistant-body');
  const form = document.getElementById('assistant-form');
  const input = document.getElementById('assistant-input');
  const sendBtn = document.getElementById('assistant-send');
  const toggle = document.getElementById('assistant-toggle');

  head.addEventListener('click', () => {
    root.classList.toggle('collapsed');
    toggle.textContent = root.classList.contains('collapsed') ? '▴' : '▾';
    if (!root.classList.contains('collapsed')) setTimeout(() => input.focus(), 220);
  });

  const history = [];

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function clearEmpty() {
    const e = body.querySelector('.assistant-empty');
    if (e) e.remove();
  }

  function appendMsg(role, text) {
    clearEmpty();
    const el = document.createElement('div');
    el.className = 'assistant-msg ' + role;
    el.textContent = text;
    body.appendChild(el);
    body.scrollTop = body.scrollHeight;
    return el;
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(80, input.scrollHeight) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.dispatchEvent(new Event('submit', { cancelable: true }));
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    appendMsg('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    const thinking = appendMsg('bot thinking', 'Steuerassistent denkt nach…');
    try {
      const res = await fetch('/api/orchestrator/chat-sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          appId: APP,
          caseId: CASE,
          messages: history,
        }),
      });
      if (!res.ok) {
        thinking.classList.remove('thinking');
        thinking.textContent = `Fehler: HTTP ${res.status}`;
        return;
      }
      const data = await res.json();
      const reply = (data && typeof data.reply === 'string') ? data.reply : '(keine Antwort)';
      thinking.classList.remove('thinking');
      thinking.textContent = reply;
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      thinking.classList.remove('thinking');
      thinking.textContent = 'Fehler: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
})();

// ── Cross-Frame: Hover über JEDES Element mit data-sha256 → postMessage
// an Parent (m-case.html). Mit 150ms-Debounce damit Spalten-Wischen den
// Viewer nicht hektisch herumspringen lässt. Letzter Hover bleibt kleben
// (kein Auto-Reset auf mouseleave).
(function () {
  const HOVER_DELAY_MS = 150;
  let hoverTimer = null;
  let lastSent = '';
  document.body.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-sha256][data-page]');
    if (!el) return;
    const key = el.getAttribute('data-sha256') + ':' + el.getAttribute('data-page');
    if (key === lastSent) return; // bereits aktiv
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => {
      lastSent = key;
      const msg = {
        type: 'sturm-source-hover',
        sha256: el.getAttribute('data-sha256'),
        page: Number(el.getAttribute('data-page') || '1'),
        filename: el.getAttribute('data-filename') || '',
        snippet: el.getAttribute('data-snippet') || '',
      };
      try { parent.postMessage(msg, '*'); } catch (_) { /* same-origin only */ }
    }, HOVER_DELAY_MS);
  });
  document.body.addEventListener('mouseout', () => {
    // Falls Maus die Region verlässt bevor der Debounce feuert → abbrechen.
    // Aber lastSent NICHT resetten — der bisherige Pin im Viewer bleibt.
    clearTimeout(hoverTimer);
  });
})();
</script>
