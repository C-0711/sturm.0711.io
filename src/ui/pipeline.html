<!DOCTYPE html>
<html lang="de" class="dark" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>STURM · Pipeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('sturm-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- sturm-app.css retained: the compiled pipeline.bundle.js uses 200+ .sturm-*
       layout/component classes defined there. sturm.css is layered on top to
       supply canonical design tokens; an inline --color-* shim below maps the
       legacy token names that the bundle reads to the canonical sturm.css
       palette. -->
  <link rel="stylesheet" href="/design-system/sturm-app.css">
  <link rel="stylesheet" href="/design-system/sturm.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css">
  <link rel="icon" type="image/svg+xml" href="/design-system/assets/logo-mark.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ── legacy --color-* → canonical sturm.css token shim ───────────── */
    :root {
      --font-inter: 'Geist', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-playfair: var(--font-inter);
      --color-bg: var(--bg);
      --color-bg-primary: var(--bg);
      --color-bg-secondary: var(--bg-2);
      --color-bg-tertiary: var(--bg-3);
      --color-bg-card: var(--bg-2);
      --color-bg-hover: var(--bg-3);
      --color-bg-active: var(--bg-3);
      --color-text-primary: var(--ink);
      --color-text-secondary: var(--ink-2);
      --color-text-tertiary: var(--ink-3);
      --color-border: var(--line-2);
      --color-border-light: var(--line-2);
      --color-accent: var(--accent);
      --color-accent-hover: var(--accent-deep);
      --color-accent-light: var(--on-accent);
      --color-success: var(--ok);
      --color-danger: var(--err);
      --color-warning: var(--warn);
      --shadow-focus-accent: 0 0 0 2px color-mix(in oklab, var(--accent) 40%, transparent);
    }

    /* ── outer shell that hosts the canonical nav sidebar next to the
          bundle-rendered pipeline app ───────────────────────────────── */
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--bg); color: var(--ink); }
    .pipeline-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      height: 100vh;
      width: 100vw;
    }
    .pipeline-shell > #root {
      min-width: 0;
      overflow: hidden;
    }

    /* Tune-button on mistral-ocr stage chips */
    .sturm-stagebar-tune {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; margin-left: 6px; border-radius: 4px;
      background: rgba(88, 166, 255, 0.12); color: var(--color-accent, #58a6ff);
      font-size: 11px; font-weight: 600; text-decoration: none;
      border: 1px solid rgba(88, 166, 255, 0.25);
      transition: background 0.15s;
    }
    .sturm-stagebar-tune:hover { background: rgba(88, 166, 255, 0.22); }
    .sturm-stagebar-tune i { width: 12px; height: 12px; }

    /* compare/fanout — branch chips inside stage node */
    .sturm-fanout-node { min-width: 220px; }
    .sturm-fanout-branches {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 8px;
    }
    .sturm-branch-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 10.5px; line-height: 1.4;
      border: 1px solid var(--color-border);
      background: var(--color-bg-tertiary);
      color: var(--color-text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .sturm-branch-chip[data-state="pending"] { opacity: 0.7; }
    .sturm-branch-chip[data-state="running"] {
      background: rgba(240, 196, 25, 0.14);
      border-color: rgba(240, 196, 25, 0.5);
      color: #c79c1f;
    }
    .sturm-branch-chip[data-state="done"] {
      background: rgba(60, 160, 100, 0.14);
      border-color: rgba(60, 160, 100, 0.45);
      color: #3aa066;
    }
    .sturm-branch-chip[data-state="error"] {
      background: rgba(212, 90, 90, 0.16);
      border-color: rgba(212, 90, 90, 0.5);
      color: #c44d4d;
    }
    .sturm-branch-icon { font-weight: 700; }
    .sturm-branch-ms { opacity: 0.75; font-size: 10px; }

    /* KPI panel below the canvas */
    .sturm-kpi-panel {
      border-top: 1px solid var(--color-border);
      background: var(--color-bg-secondary);
      padding: 14px 16px;
      max-height: 46vh;
      overflow-y: auto;
      font-size: 12.5px;
    }
    .sturm-kpi-panel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .sturm-kpi-score { display: inline-flex; align-items: baseline; gap: 8px; }
    .sturm-kpi-score-label {
      text-transform: uppercase; letter-spacing: 0.08em;
      font-size: 10.5px; color: var(--color-text-tertiary);
    }
    .sturm-kpi-score-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sturm-kpi-score-sep { color: var(--color-text-tertiary); }
    .sturm-kpi-verdict {
      padding: 2px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sturm-kpi-verdict.is-pass {
      background: rgba(60, 160, 100, 0.18);
      color: #3aa066;
      border: 1px solid rgba(60, 160, 100, 0.4);
    }
    .sturm-kpi-verdict.is-fail {
      background: rgba(212, 90, 90, 0.18);
      color: #c44d4d;
      border: 1px solid rgba(212, 90, 90, 0.4);
    }
    .sturm-kpi-panel-meta {
      display: inline-flex; gap: 10px;
      color: var(--color-text-tertiary); font-size: 11.5px;
    }
    .sturm-kpi-bars {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 8px 18px; margin-bottom: 14px;
    }
    .sturm-kpi-bar {
      display: grid; grid-template-columns: 160px 1fr 44px;
      align-items: center; gap: 8px;
    }
    .sturm-kpi-bar-label { font-size: 11.5px; color: var(--color-text-secondary); }
    .sturm-kpi-bar-track {
      height: 6px; background: var(--color-bg-tertiary);
      border-radius: 3px; overflow: hidden;
    }
    .sturm-kpi-bar-fill {
      height: 100%; background: var(--color-accent, #58a6ff);
      transition: width 0.3s ease;
    }
    .sturm-kpi-bar-value { font-variant-numeric: tabular-nums; font-size: 11.5px; text-align: right; }

    .sturm-kpi-table {
      width: 100%; border-collapse: collapse;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }
    .sturm-kpi-table th, .sturm-kpi-table td {
      padding: 6px 8px; text-align: left;
      border-bottom: 1px solid var(--color-border-light, var(--color-border));
      font-size: 12px;
    }
    .sturm-kpi-table th {
      font-weight: 500; color: var(--color-text-tertiary);
      text-transform: uppercase; letter-spacing: 0.05em; font-size: 10.5px;
    }
    .sturm-kpi-table tr.is-best {
      background: rgba(60, 160, 100, 0.08);
    }
    .sturm-kpi-table tr.is-best td:first-child { box-shadow: inset 2px 0 0 #3aa066; }
    .sturm-branch-tag {
      display: inline-block;
      padding: 1px 6px; border-radius: 3px;
      background: var(--color-bg-tertiary);
      font-size: 11px; font-weight: 500;
    }
    .sturm-kpi-err { color: #c44d4d; font-size: 10.5px; margin-left: 4px; }

    .sturm-kpi-disputed { border-top: 1px solid var(--color-border-light, var(--color-border)); padding-top: 10px; }
    .sturm-kpi-disputed-head {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; border: none; cursor: pointer;
      color: var(--color-text-primary); font-size: 12px; font-weight: 500;
      padding: 4px 0;
    }
    .sturm-kpi-disputed-chev { color: var(--color-text-tertiary); }
    .sturm-kpi-disputed-count {
      padding: 1px 7px; border-radius: 10px;
      background: rgba(212, 90, 90, 0.14); color: #c44d4d;
      font-size: 11px; font-weight: 600;
    }
    .sturm-kpi-disputed-body { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .sturm-disputed-row {
      display: grid; grid-template-columns: 200px 1fr;
      gap: 12px; padding: 6px 8px;
      background: var(--color-bg-tertiary);
      border-radius: 4px;
    }
    .sturm-disputed-key { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--color-text-secondary); word-break: break-all; }
    .sturm-disputed-values { display: flex; flex-direction: column; gap: 3px; }
    .sturm-disputed-val { display: flex; gap: 8px; align-items: baseline; font-size: 11.5px; }
    .sturm-disputed-v { font-family: ui-monospace, monospace; word-break: break-all; }

    /* ===== Canonical STURM icon-rail (Option A: rail + app-sidebar) ===== */
    .sturm-iconrail {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 56px;
      background: var(--bg-2, var(--color-bg-secondary));
      border-right: 1px solid var(--line-2, var(--color-border));
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 0; gap: 2px;
      z-index: 50;
      font-family: var(--font-inter);
    }
    .sturm-iconrail-brand {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--accent, var(--color-accent));
      color: var(--bg, #fff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px; text-decoration: none;
      margin-bottom: 8px;
    }
    .sturm-iconrail a.rail-item {
      width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-2, var(--color-text-secondary));
      text-decoration: none;
      transition: background 120ms ease, color 120ms ease;
      position: relative;
    }
    .sturm-iconrail a.rail-item:hover {
      background: var(--bg-3, var(--color-bg-tertiary));
      color: var(--ink, var(--color-text-primary));
    }
    .sturm-iconrail a.rail-item.is-active {
      background: var(--bg-3, var(--color-bg-tertiary));
      color: var(--accent, var(--color-accent));
    }
    .sturm-iconrail a.rail-item.is-active::before {
      content: ''; position: absolute; left: -1px; top: 8px; bottom: 8px;
      width: 2px; background: var(--accent, var(--color-accent)); border-radius: 0 2px 2px 0;
    }
    .sturm-iconrail a.rail-item i, .sturm-iconrail a.rail-item svg {
      width: 18px; height: 18px; stroke-width: 1.6;
    }
    /* Tooltip-on-hover (CSS only, no JS) */
    .sturm-iconrail a.rail-item::after {
      content: attr(data-label);
      position: absolute; left: 52px; top: 50%; transform: translateY(-50%);
      background: var(--bg, var(--color-bg)); color: var(--ink, var(--color-text-primary));
      border: 1px solid var(--line-2, var(--color-border));
      padding: 4px 8px; border-radius: 6px;
      font-size: 12px; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 120ms ease;
      z-index: 60;
    }
    .sturm-iconrail a.rail-item:hover::after { opacity: 1; }
    /* Round-4 fix #3: Push the app shell right using MARGIN on .sturm-app, NOT padding on body.
       padding-left on body+height:100% body caused the sidebar to not be height-constrained,
       so its overflow-y:auto never engaged — bottom workflows were unreachable. */
    .sturm-app { margin-left: 56px; }

    /* Round-4 fix #5: Push rail tooltips further right + below the icon so they don't
       overlap the workflow list. (Old: left:52px + translateY(-50%) sat over the sidebar.) */
    .sturm-iconrail a.rail-item::after {
      left: 60px;
      top: auto; bottom: -4px;
      transform: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    /* Round-4 fix #4: responsive collapse — on narrow viewports, hide the icon-rail labels;
       under 720px the rail becomes a thin bar that overlays. Optional auto-collapse the
       workflow sidebar at the same breakpoint. */
    @media (max-width: 900px) {
      .sturm-iconrail { width: 48px; }
      .sturm-app { margin-left: 48px; }
      .sturm-iconrail a.rail-item::after { left: 52px; }
    }
    @media (max-width: 720px) {
      .sturm-iconrail a.rail-item::after { display: none; } /* tooltips off on touch-ish */
      /* Stack: the workflow sidebar overlays the canvas when too narrow */
      .sturm-app .sturm-sidebar { position: fixed; left: 48px; top: 0; bottom: 0; z-index: 50;
                                   box-shadow: 2px 0 8px rgba(0,0,0,0.15); }
      .sturm-app .sturm-canvas-host, .sturm-app > main { width: 100%; }
    }

    /* Option-A polish: hide JSX-sidebar brand since canonical rail owns the brand+home anchor */
    .sturm-app .sturm-sb-brand { display: none; }
    .sturm-app .sturm-sb-head { justify-content: flex-end; padding-bottom: 6px; }

    /* Bug #17 transition + #19 spinner keyframe */
    @keyframes sturm-spin { to { transform: rotate(360deg); } }
    .sturm-canvas { transition: opacity 180ms ease; }
  </style>
</head>
<body>
  <!-- ===== Canonical STURM icon-rail (Option A) ===== -->
  <aside class="sturm-iconrail" aria-label="STURM Hauptnavigation">
    <a href="/" class="sturm-iconrail-brand" aria-label="STURM Home" title="STURM Home">S</a>
    <a href="/app.html" class="rail-item" data-label="Workflows" aria-label="Workflows"><i data-lucide="layout-grid"></i></a>
    <a href="/cases.html" class="rail-item" data-label="Fälle" aria-label="Fälle"><i data-lucide="boxes"></i></a>
    <a href="/pipeline.html" class="rail-item is-active" data-label="Pipeline-Runner" aria-label="Pipeline-Runner"><i data-lucide="play"></i></a>
    <a href="/designer.html" class="rail-item" data-label="Designer" aria-label="Designer"><i data-lucide="pen-tool"></i></a>
    <a href="/studio-ocr.html" class="rail-item" data-label="OCR Studio" aria-label="OCR Studio"><i data-lucide="sliders-horizontal"></i></a>
    <a href="/orchestrator.html" class="rail-item" data-label="Assistant" aria-label="Assistant"><i data-lucide="sparkles"></i></a>
    <a href="/0711-fleet.html" class="rail-item" data-label="Fleet" aria-label="Fleet"><i data-lucide="network"></i></a>
  </aside>
  <div id="root"></div>


  <!-- ============ Auth: bearer-token bootstrap (?token=… → localStorage) ============
       Spiegelt das studio-ocr.js Muster: einmaliges ?token=… aus der URL in
       localStorage übertragen, dann aus der URL entfernen. authHeaders() im
       Bundle liest dann von dort. -->
  <script>
    (function bootstrapToken() {
      try {
        const u = new URL(window.location.href);
        const t = u.searchParams.get('token');
        if (t) {
          localStorage.setItem('sturm-token', t);
          u.searchParams.delete('token');
          window.history.replaceState({}, '', u.toString());
        }
      } catch (e) { console.warn('[pipeline] token bootstrap failed:', e); }
    })();
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/umd/index.js"></script>
  <script src="/pipeline.bundle.js?v=20260515a"></script>
</body>
</html>
