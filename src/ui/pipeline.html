<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="utf-8">
  <title>STURM · Pipeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="/design-system/colors_and_type.css">
  <link rel="stylesheet" href="/design-system/sturm-app.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css">
  <link rel="icon" type="image/svg+xml" href="/design-system/assets/logo-mark.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/umd/index.js"></script>

  <script type="text/babel" data-presets="react">
/* global React, ReactDOM, ReactFlow */
const { useState, useEffect, useCallback, useMemo, useRef } = React;
const RF = window.ReactFlow;

/* ------------------------------------------------------------
   Placeholder workflow definition (wird später aus Engine geladen)
   ------------------------------------------------------------ */
const ELSTER_WORKFLOW = {
  id: 'elster-v1',
  name: 'ELSTER Feldextraktion',
  description: 'Steuer-Dokumente auf ELSTER-Felder mappen, bewerten, kreuzprüfen.',
  stages: [
    { id: 'upload',              name: 'Upload',              sub: 'Datei-Ablage',                  x: 20,    y: 100 },
    { id: 'mistral-raw',         name: 'Mistral OCR',         sub: 'permissiv, Markdown + JSON',    x: 220,   y: 100 },
    { id: 'regel-engine',        name: 'Regel-Engine',        sub: 'deterministisches Label-Match', x: 440,   y: 100 },
    { id: 'schema',              name: 'Schema-Bau',          sub: 'aus Eindeutigkeiten',           x: 660,   y: 100 },
    { id: 'mistral-kuratiert',   name: 'Mistral kuratiert',   sub: 'tight Schema',                  x: 880,   y: 100 },
    { id: 'baseline',            name: 'Baseline-Merge',      sub: 'Mistral + Regel + Kurator',     x: 1100,  y: 100 },
    { id: 'bewertung',           name: 'Bewertung',           sub: 'BMF · Dichte · Kons',           x: 1320,  y: 100 },
    { id: 'cross-check',         name: 'Cross-Check',         sub: 'Anlagen-Abgleich',              x: 1540,  y: 100 },
    { id: 'final',               name: 'Ergebnis',            sub: 'Final-Annotation',              x: 1760,  y: 100 },
    { id: 'anlagen-mistral',     name: 'Mistral OCR · Enum',  sub: 'Anlagen-Erkennung',             x: 220,   y: 260 },
    { id: 'anlagen-filter',      name: 'Katalog-Filter',      sub: '',                              x: 440,   y: 260 },
    { id: 'anlagen-persist',     name: 'Persistenz',          sub: '',                              x: 660,   y: 260 },
    { id: 'anlagen-erkannt',     name: 'Erkannte Anlagen',    sub: '',                              x: 880,   y: 260 },
  ],
  edges: [
    ['upload', 'mistral-raw'],
    ['mistral-raw', 'regel-engine'],
    ['regel-engine', 'schema'],
    ['schema', 'mistral-kuratiert'],
    ['mistral-kuratiert', 'baseline'],
    ['baseline', 'bewertung'],
    ['bewertung', 'cross-check'],
    ['cross-check', 'final'],
    ['upload', 'anlagen-mistral'],
    ['anlagen-mistral', 'anlagen-filter'],
    ['anlagen-filter', 'anlagen-persist'],
    ['anlagen-persist', 'anlagen-erkannt'],
  ]
};

const INITIAL_ISSUES = [
  { id: 1, title: 'Anlage-Aliase als Daten-Datei (VOR, SA)',            tag: 'Daten',        done: false },
  { id: 2, title: '"Kirchstraße" wird als Adresse Person B gemappt',    tag: 'Regel-Engine', done: false },
  { id: 3, title: 'AN-Krankenversicherung matcht nicht auf BMF-Text',   tag: 'Regel-Engine', done: false },
  { id: 4, title: 'Person B · KAP überschreibt Person A',               tag: 'Merge',        done: false },
  { id: 5, title: 'Log-Panel schneidet lange Payloads ab',              tag: 'UI',           done: false },
];

/* ------------------------------------------------------------
   Stage-Node (Neo-styled)
   ------------------------------------------------------------ */
function StageNode({ data, selected }) {
  const stateLabel = {
    idle:    'wartet',
    running: 'läuft',
    ok:      'fertig',
    error:   'fehler',
    skipped: 'übersprungen',
  }[data.state || 'idle'];

  return (
    <div className="sturm-node" data-state={data.state || 'idle'} data-selected={selected}>
      <RF.Handle type="target" position="left" style={{ background: 'var(--color-border)', width: 6, height: 6 }} />
      <div className="sturm-node-state">{stateLabel}</div>
      <div className="sturm-node-title">{data.label}</div>
      {data.sub && <div className="sturm-node-sub">{data.sub}</div>}
      {data.ms != null && <div className="sturm-node-time">{data.ms} ms</div>}
      <RF.Handle type="source" position="right" style={{ background: 'var(--color-border)', width: 6, height: 6 }} />
    </div>
  );
}

const nodeTypes = { stage: StageNode };

/* ------------------------------------------------------------
   Sidebar
   ------------------------------------------------------------ */
function Sidebar({ collapsed, onToggle, onGoHome }) {
  if (collapsed) {
    return (
      <aside className="sturm-sidebar is-collapsed">
        <button className="sturm-sb-toggle" onClick={onToggle} aria-label="Sidebar öffnen">
          <i data-lucide="panel-left"></i>
        </button>
      </aside>
    );
  }
  return (
    <aside className="sturm-sidebar">
      <div className="sturm-sb-head">
        <div className="sturm-sb-brand">
          <span className="sturm-mark">S</span>
          <span className="sturm-brand-word">STURM</span>
        </div>
        <button className="sturm-sb-toggle" onClick={onToggle} aria-label="Sidebar einklappen">
          <i data-lucide="panel-left"></i>
        </button>
      </div>

      <button className="sturm-sb-new" onClick={onGoHome}>
        <i data-lucide="arrow-left"></i><span>Zur Übersicht</span>
      </button>

      <div className="sturm-sb-section"><span>Workflow</span></div>
      <nav className="sturm-sb-nav">
        <button className="sturm-sb-item is-active">
          <i data-lucide="git-branch"></i>
          <span>ELSTER</span>
          <span className="sturm-sb-item-meta">v1</span>
        </button>
      </nav>

      <div className="sturm-sb-section"><span>Letzte Runs</span></div>
      <div className="sturm-sb-nav sturm-sb-nav-scroll">
        <button className="sturm-sb-item">
          <i data-lucide="check-circle-2"></i>
          <span>Stricker 2023</span>
          <span className="sturm-sb-item-meta">jetzt</span>
        </button>
        <button className="sturm-sb-item">
          <i data-lucide="check-circle-2"></i>
          <span>Gymnastik-Beleg</span>
          <span className="sturm-sb-item-meta">-1h</span>
        </button>
        <button className="sturm-sb-item">
          <i data-lucide="circle-slash"></i>
          <span>Tape-Foto</span>
          <span className="sturm-sb-item-meta">-3h</span>
        </button>
      </div>

      <div className="sturm-sb-foot">
        <div className="sturm-avatar">C</div>
        <div>
          <div className="sturm-sb-user-name">Christoph</div>
          <div className="sturm-sb-user-plan">0711 Intelligence</div>
        </div>
      </div>
    </aside>
  );
}

/* ------------------------------------------------------------
   TopBar
   ------------------------------------------------------------ */
function TopBar({ workflow, status, runId, collapsedSidebar, onOpenSidebar, theme, onToggleTheme }) {
  return (
    <header className="sturm-topbar">
      <div className="sturm-topbar-l">
        {collapsedSidebar && (
          <button className="sturm-icon-btn" onClick={onOpenSidebar} aria-label="Sidebar öffnen">
            <i data-lucide="panel-left"></i>
          </button>
        )}
        <span className="sturm-topbar-title">
          <strong>{workflow.name}</strong>
          <span className="sturm-topbar-sep">·</span>
          <button className="sturm-wf-chip">
            <span>{workflow.id}</span>
            <i data-lucide="chevron-down"></i>
          </button>
          {runId && <span className="sturm-run-id">{runId}</span>}
        </span>
      </div>
      <div className="sturm-topbar-r">
        <span className={`sturm-status ${status === 'running' ? 'is-running' : status === 'ok' ? 'is-ok' : status === 'error' ? 'is-error' : ''}`}>
          {status === 'idle' && 'bereit'}
          {status === 'running' && 'läuft'}
          {status === 'ok' && 'fertig'}
          {status === 'error' && 'fehler'}
        </span>
        <button className="sturm-icon-btn" aria-label="Teilen"><i data-lucide="share-2"></i></button>
        <button className="sturm-icon-btn" onClick={onToggleTheme} aria-label="Theme umschalten">
          <i data-lucide={theme === 'dark' ? 'sun' : 'moon'}></i>
        </button>
      </div>
    </header>
  );
}

/* ------------------------------------------------------------
   Composer (File-Drop)
   ------------------------------------------------------------ */
function Composer({ file, onFile, onStart, running, noCache, setNoCache, noKurator, setNoKurator }) {
  const inputRef = useRef(null);
  const [dragover, setDragover] = useState(false);

  function onDrop(e) {
    e.preventDefault();
    setDragover(false);
    const f = e.dataTransfer.files?.[0];
    if (f) onFile(f);
  }

  return (
    <div className="sturm-composer-wrap">
      <div
        className={`sturm-composer ${dragover ? 'is-dragover' : ''}`}
        onDragOver={e => { e.preventDefault(); setDragover(true); }}
        onDragLeave={() => setDragover(false)}
        onDrop={onDrop}
      >
        <div className="sturm-dropzone" onClick={() => inputRef.current?.click()}>
          <i data-lucide={file ? 'file-check-2' : 'upload'}></i>
          <div>{file ? file.name : 'Datei ablegen oder klicken, um auszuwählen'}</div>
          <div className="sturm-dropzone-sub">PDF · JPG · PNG, bis 20 MB</div>
          <input
            ref={inputRef}
            type="file"
            style={{ display: 'none' }}
            accept=".pdf,.jpg,.jpeg,.png"
            onChange={e => { const f = e.target.files?.[0]; if (f) onFile(f); }}
          />
        </div>

        <div className="sturm-composer-row">
          <label className="sturm-toggle-row">
            <span
              className={`sturm-toggle ${noCache ? 'is-on' : ''}`}
              onClick={() => setNoCache(v => !v)}
              role="switch"
              aria-checked={noCache}
            ><span className="sturm-toggle-knob"></span></span>
            <span className="sturm-toggle-lbl">ohne Cache</span>
          </label>
          <label className="sturm-toggle-row">
            <span
              className={`sturm-toggle ${noKurator ? 'is-on' : ''}`}
              onClick={() => setNoKurator(v => !v)}
              role="switch"
              aria-checked={noKurator}
            ><span className="sturm-toggle-knob"></span></span>
            <span className="sturm-toggle-lbl">ohne Kurator</span>
          </label>
          <div className="sturm-composer-row-spacer"></div>
          <button className="sturm-btn sturm-btn-primary" disabled={!file || running} onClick={onStart}>
            <i data-lucide={running ? 'loader' : 'play'}></i>
            <span>{running ? 'läuft …' : 'Workflow starten'}</span>
          </button>
        </div>
      </div>
      <p className="sturm-composer-note">Echte Ergebnisse hängen vom Eingabedokument ab — Pflichtfelder immer gegen BMF-Katalog prüfen.</p>
    </div>
  );
}

/* ------------------------------------------------------------
   Right Drawer (Events / Issues)
   ------------------------------------------------------------ */
function Drawer({ events, issues, setIssues }) {
  const [tab, setTab] = useState('events');
  const [newIssue, setNewIssue] = useState('');

  function addIssue() {
    const t = newIssue.trim();
    if (!t) return;
    setIssues(list => [...list, { id: Date.now(), title: t, tag: 'neu', done: false }]);
    setNewIssue('');
  }

  return (
    <aside className="sturm-drawer">
      <div className="sturm-drawer-head">
        <div className="sturm-drawer-tabs">
          <button className={`sturm-drawer-tab ${tab === 'events' ? 'is-active' : ''}`} onClick={() => setTab('events')}>
            Events <span className="sturm-badge sturm-badge-muted">{events.length}</span>
          </button>
          <button className={`sturm-drawer-tab ${tab === 'issues' ? 'is-active' : ''}`} onClick={() => setTab('issues')}>
            Issues <span className="sturm-badge sturm-badge-muted">{issues.filter(i => !i.done).length}</span>
          </button>
        </div>
      </div>

      {tab === 'events' && (
        <div className="sturm-drawer-body">
          {events.length === 0 && (
            <div style={{ padding: 18, textAlign: 'center', fontSize: 12.5, color: 'var(--color-text-tertiary)' }}>
              Events erscheinen hier, sobald der Lauf startet.
            </div>
          )}
          {events.map((e, i) => (
            <div className="sturm-event" key={i}>
              <div className="sturm-event-time">{e.t}</div>
              <div className="sturm-event-name">{e.name}</div>
              {e.payload && <div className="sturm-event-payload">{e.payload}</div>}
            </div>
          ))}
        </div>
      )}

      {tab === 'issues' && (
        <div className="sturm-drawer-body">
          <div className="sturm-issue-add">
            <input
              placeholder="Neuer Issue …"
              value={newIssue}
              onChange={e => setNewIssue(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addIssue()}
            />
            <button onClick={addIssue} disabled={!newIssue.trim()}>+</button>
          </div>
          {issues.map(iss => (
            <div className={`sturm-issue ${iss.done ? 'is-done' : ''}`} key={iss.id}>
              <button
                className="sturm-issue-check"
                aria-label={iss.done ? 'wieder öffnen' : 'erledigt'}
                onClick={() => setIssues(list => list.map(x => x.id === iss.id ? { ...x, done: !x.done } : x))}
              >
                {iss.done && (
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                )}
              </button>
              <div className="sturm-issue-body">
                <div className="sturm-issue-title">{iss.title}</div>
                <div className="sturm-issue-tag">{iss.tag}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </aside>
  );
}

/* ------------------------------------------------------------
   App
   ------------------------------------------------------------ */
function App() {
  const workflow = ELSTER_WORKFLOW;
  const [theme, setTheme] = useState(() => (document.documentElement.classList.contains('dark') ? 'dark' : 'light'));
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [file, setFile] = useState(null);
  const [running, setRunning] = useState(false);
  const [status, setStatus] = useState('idle');
  const [runId, setRunId] = useState(null);
  const [noCache, setNoCache] = useState(true);
  const [noKurator, setNoKurator] = useState(false);
  const [events, setEvents] = useState([]);
  const [stageStates, setStageStates] = useState({});
  const [issues, setIssues] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('sturm-issues:elster-v1') || 'null');
      return saved || INITIAL_ISSUES;
    } catch { return INITIAL_ISSUES; }
  });

  useEffect(() => {
    localStorage.setItem('sturm-issues:elster-v1', JSON.stringify(issues));
  }, [issues]);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('sturm-theme', theme);
  }, [theme]);

  useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const nodes = useMemo(() => workflow.stages.map(s => ({
    id: s.id,
    type: 'stage',
    position: { x: s.x, y: s.y },
    data: { label: s.name, sub: s.sub, state: stageStates[s.id]?.state, ms: stageStates[s.id]?.ms },
    draggable: false,
  })), [stageStates]);

  const edges = useMemo(() => workflow.edges.map(([a, b]) => ({
    id: `${a}-${b}`,
    source: a, target: b,
    animated: stageStates[a]?.state === 'running' || stageStates[b]?.state === 'running',
    style: { stroke: 'var(--color-border)', strokeWidth: 1.5 },
    markerEnd: { type: 'arrowclosed', color: 'var(--color-border)' }
  })), [stageStates]);

  function simulate() {
    setRunning(true);
    setStatus('running');
    setRunId(`run-${Date.now().toString(36)}`);
    setEvents([]);
    setStageStates({});

    const order = workflow.stages.map(s => s.id);
    let t = 0;
    order.forEach((id, i) => {
      const startMs = t;
      const dur = 400 + Math.random() * 600;
      t += dur;
      setTimeout(() => {
        setStageStates(prev => ({ ...prev, [id]: { state: 'running' } }));
        setEvents(prev => [...prev, { t: new Date().toLocaleTimeString(), name: `${id} · start`, payload: null }]);
      }, startMs);
      setTimeout(() => {
        setStageStates(prev => ({ ...prev, [id]: { state: 'ok', ms: Math.round(dur) } }));
        setEvents(prev => [...prev, {
          t: new Date().toLocaleTimeString(),
          name: `${id} · done`,
          payload: i === 1 ? 'chars=4213  pages=3  annotation_bytes=18402' :
                   i === 6 ? '{ score: 0.82, pflicht_ok: true, dichte: 0.71 }' : null
        }]);
      }, startMs + dur);
    });
    setTimeout(() => {
      setRunning(false);
      setStatus('ok');
      setEvents(prev => [...prev, { t: new Date().toLocaleTimeString(), name: 'workflow · done', payload: null }]);
    }, t + 50);
  }

  return (
    <div className="sturm-app">
      <Sidebar
        collapsed={sidebarCollapsed}
        onToggle={() => setSidebarCollapsed(c => !c)}
        onGoHome={() => location.href = '/'}
      />

      <div className="sturm-main">
        <TopBar
          workflow={workflow}
          status={status}
          runId={runId}
          collapsedSidebar={sidebarCollapsed}
          onOpenSidebar={() => setSidebarCollapsed(false)}
          theme={theme}
          onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
        />

        <div className="sturm-canvas" style={{ flex: 1 }}>
          <RF.ReactFlowProvider>
            <RF.ReactFlow
              nodes={nodes}
              edges={edges}
              nodeTypes={nodeTypes}
              fitView
              fitViewOptions={{ padding: 0.2 }}
              nodesDraggable={false}
              nodesConnectable={false}
              elementsSelectable
              proOptions={{ hideAttribution: false }}
            >
              <RF.Background color="var(--color-border-light)" gap={22} size={1} />
              <RF.Controls />
              <RF.MiniMap
                nodeColor={(n) => {
                  const s = n.data?.state;
                  if (s === 'running') return 'var(--color-accent)';
                  if (s === 'ok')      return 'var(--color-success)';
                  if (s === 'error')   return 'var(--color-danger)';
                  return 'var(--color-bg-tertiary)';
                }}
                maskColor="rgba(26, 24, 22, 0.6)"
                style={{ background: 'var(--color-bg-secondary)' }}
              />
            </RF.ReactFlow>
          </RF.ReactFlowProvider>
        </div>

        <Composer
          file={file}
          onFile={setFile}
          onStart={simulate}
          running={running}
          noCache={noCache} setNoCache={setNoCache}
          noKurator={noKurator} setNoKurator={setNoKurator}
        />
      </div>

      <Drawer events={events} issues={issues} setIssues={setIssues} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
