<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steuerfall · Meine Fälle</title>
  <link rel="stylesheet" href="/design-system/colors_and_type.css" />
  <style>
    body {
      margin: 0;
      font-family: var(--font-inter, -apple-system, sans-serif);
      background: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.5;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 36px 24px 96px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
    .sub { color: var(--color-text-secondary); font-size: 14px; margin: 0 0 36px; }
    .stub {
      padding: 16px;
      border: 1px dashed var(--color-border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--color-text-secondary);
      background: var(--color-bg-tertiary);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Meine Fälle</h1>
    <p class="sub">Übersicht aller Einkommensteuer-Fälle.</p>
    <div class="stub">
      Dashboard wird gerade gebaut. Hier erscheint die Liste deiner Fälle mit Status und Erstattungsbetrag.
    </div>
  </div>
</body>
</html>
