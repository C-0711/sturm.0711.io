<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="utf-8">
  <title>Anwendungen · STURM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="/design-system/colors_and_type.css">
  <link rel="stylesheet" href="/design-system/sturm-app.css">
  <link rel="icon" type="image/svg+xml" href="/design-system/assets/logo-mark.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .app-section { width: 100%; max-width: 960px; padding: 0 24px; }
    .app-section + .app-section { margin-top: 18px; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .app-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin: 0;
    }
    .app-header-sub {
      font-size: 12.5px;
      color: var(--color-text-secondary);
    }
    .app-new-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--color-accent);
      border-radius: 8px;
      background: var(--color-accent);
      color: var(--color-bg-primary, #000);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    .app-new-btn:hover { filter: brightness(1.05); }
    .app-new-btn[aria-disabled="true"] {
      background: var(--color-bg-hover);
      border-color: var(--color-border);
      color: var(--color-text-tertiary);
      cursor: not-allowed;
      filter: none;
    }
    .app-new-btn[aria-disabled="true"]:hover { filter: none; }

    /* ── P9: Tool-Roster Panel ─────────────────────────────────────── */
    .tools-panel {
      margin: 10px 0 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-bg-card, transparent);
      overflow: hidden;
    }
    .tools-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 9px 14px;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .tools-chip:hover { background: var(--color-bg-hover); }
    .tools-chip:focus-visible { outline: 1px solid var(--color-accent); outline-offset: -1px; }
    .tools-chip-label {
      font-size: 12.5px;
      color: var(--color-text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tools-chip-caret {
      display: inline-block;
      width: 9px;
      text-align: center;
      color: var(--color-text-tertiary);
      transition: transform .15s;
    }
    .tools-panel[data-expanded="true"] .tools-chip-caret { transform: rotate(90deg); }
    .tools-chip-counts {
      font-size: 12px;
      font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      color: var(--color-text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .tools-chip-counts .ct { display: inline-flex; align-items: center; gap: 3px; }
    .tools-dot { font-size: 13px; line-height: 1; }
    .tools-dot.green { color: #22c55e; }
    .tools-dot.amber { color: #f59e0b; }
    .tools-dot.red   { color: #ef4444; }
    .tools-dot.grey  { color: #9ca3af; }
    .tools-warn { color: #f59e0b; font-size: 13px; margin-left: 2px; }

    .tools-body {
      display: none;
      border-top: 1px solid var(--color-border);
      padding: 6px 0;
    }
    .tools-panel[data-expanded="true"] .tools-body { display: block; }

    .tools-row {
      display: grid;
      grid-template-columns: 18px 1.2fr 0.9fr 1.1fr 0.7fr 0.7fr;
      align-items: center;
      gap: 10px;
      padding: 5px 14px;
      font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 11.5px;
      color: var(--color-text-secondary);
    }
    .tools-row + .tools-row { border-top: 1px dashed var(--color-border); }
    .tools-row .tname { color: var(--color-text-primary); }
    .tools-row .tkind { color: var(--color-text-tertiary); }
    .tools-row .turl  { color: var(--color-text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tools-row .tlat  { color: var(--color-text-secondary); text-align: right; }
    .tools-row .tcirc { color: var(--color-text-tertiary); text-align: right; }
    .tools-row.required-down .tname { color: #ef4444; }

    .tools-banner {
      padding: 10px 14px;
      font-size: 12px;
      font-style: italic;
      color: var(--color-text-tertiary);
    }

    .case-row {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-bg-card, transparent);
      color: inherit;
      transition: border-color .12s, background .12s;
      position: relative;
    }
    .case-row-head {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      align-items: center;
      gap: 12px;
    }
    .case-row:hover { border-color: var(--color-accent); background: var(--color-bg-hover); }
    .case-row + .case-row { margin-top: 8px; }
    .case-row-link { color: inherit; text-decoration: none; display: contents; }
    .case-row-del {
      background: transparent;
      border: 1px solid transparent;
      width: 26px; height: 26px;
      border-radius: 6px;
      color: var(--color-text-tertiary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .1s, color .1s, border-color .1s;
    }
    .case-row-del:hover { background: rgba(239, 68, 68, 0.12); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
    .case-row-del i { width: 14px; height: 14px; }
    .case-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin: 0;
    }
    .case-sub {
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin: 2px 0 0;
    }
    .case-meta {
      font-size: 11.5px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .case-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    /* ── Per-Dokument Qualitäts-Strip (Trust-Breakdown) ─────────── */
    .case-docs {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .case-doc {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 11.5px;
      color: var(--color-text-secondary);
      padding: 2px 0;
    }
    .case-doc .case-doc-name { flex: 1 1 auto; min-width: 0; }
    .case-doc .case-doc-fields { white-space: nowrap; }
    .case-doc-name {
      color: var(--color-text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .case-doc-trust {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .case-doc-trust .ct { display: inline-flex; align-items: center; gap: 3px; }
    .case-doc-anlagen {
      color: var(--color-text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .case-recompute {
      display: inline-block;
      margin-top: 8px;
      font-size: 11.5px;
      color: var(--color-text-tertiary);
      background: transparent;
      border: 1px dashed var(--color-border);
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .case-recompute:hover { color: var(--color-text-primary); border-color: var(--color-accent); }
    .case-recompute[disabled] { opacity: 0.6; cursor: progress; }

    .case-status.in_bearbeitung { color: var(--color-text-primary); border-color: var(--color-accent); }
    .case-status.review { color: #d97706; border-color: #d97706; }
    .case-status.versiegelt { color: #059669; border-color: #059669; }
    .case-status.eingereicht { color: #2563eb; border-color: #2563eb; }
    .case-status.archiviert { color: var(--color-text-tertiary); border-color: var(--color-border); opacity: 0.7; }

    /* Filter chips */
    .case-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
    }
    .case-filter-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 11.5px;
      cursor: pointer;
    }
    .case-filter-chip:hover { border-color: var(--color-accent); color: var(--color-text-primary); }
    .case-filter-chip.active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-bg-primary, #000);
    }
    .case-filter-chip-count {
      font-size: 10.5px;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--color-bg-hover);
      color: var(--color-text-tertiary);
      min-width: 14px;
      text-align: center;
    }
    .case-filter-chip.active .case-filter-chip-count { background: rgba(0,0,0,.18); color: inherit; }
    .case-filter-search {
      margin-left: auto;
      padding: 4px 9px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: transparent;
      color: var(--color-text-primary);
      font-size: 12px;
      min-width: 180px;
    }
    .case-filter-search:focus { outline: 1px solid var(--color-accent); border-color: var(--color-accent); }

    .empty {
      padding: 32px 24px;
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: 13px;
      border: 1px dashed var(--color-border);
      border-radius: 12px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--color-bg-card, #1a1a1a);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 20px;
    }
    .modal h3 {
      margin: 0 0 14px;
      font-size: 15px;
      color: var(--color-text-primary);
    }
    .modal-field { margin-bottom: 12px; }
    .modal-field label {
      display: block;
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }
    .modal-field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-bg-primary, #000);
      color: var(--color-text-primary);
      font-size: 13px;
    }
    .modal-field input:focus { outline: 1px solid var(--color-accent); border-color: var(--color-accent); }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .modal-btn {
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text-secondary);
    }
    .modal-btn.primary {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-bg-primary, #000);
    }
    .modal-btn:hover { filter: brightness(1.1); }
    .modal-err {
      color: #ef4444;
      font-size: 12px;
      margin-top: 8px;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <div class="sturm-app">
    <aside id="sturm-nav-host"></aside>

    <div class="sturm-main">
      <header class="sturm-topbar">
        <div class="sturm-topbar-l">
          <span class="sturm-topbar-title">Anwendungen</span>
        </div>
        <div class="sturm-topbar-r">
          <button class="sturm-icon-btn" id="theme-btn" aria-label="Theme umschalten">
            <i data-lucide="sun" id="theme-icon"></i>
          </button>
        </div>
      </header>

      <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding-bottom: 32px;">
        <div class="sturm-welcome">
          <div class="sturm-welcome-glyph">
            <i data-lucide="boxes" style="width:22px; height:22px;"></i>
          </div>
          <h1 class="sturm-welcome-title">Anwendungen</h1>
          <p class="sturm-welcome-sub">
            Vollanwendungen mit persistenter Fall-State — Workflows + RAG + MCPs
            orchestriert um langlebige Domänen-Objekte. Wähle eine Anwendung
            oder starte einen neuen Fall.
          </p>
        </div>

        <div id="app-list">
          <!-- pro Anwendung ein Block (.app-section) -->
        </div>
      </div>
    </div>
  </div>

  <!-- Create-Modal -->
  <div class="modal-backdrop" id="create-modal">
    <div class="modal">
      <h3 id="create-modal-title">Neuer Fall</h3>
      <div class="modal-field">
        <label for="m-display">Anzeigename</label>
        <input id="m-display" placeholder="z.B. Mustermann 2024" autocomplete="off">
      </div>
      <div class="modal-field">
        <label for="m-mandant">Mandant-ID</label>
        <input id="m-mandant" placeholder="z.B. mustermann-max" autocomplete="off">
      </div>
      <div class="modal-field">
        <label for="m-jahr">Veranlagungsjahr</label>
        <input id="m-jahr" type="number" placeholder="2024" autocomplete="off">
      </div>
      <div class="modal-err" id="m-err"></div>
      <div class="modal-actions">
        <button class="modal-btn" id="m-cancel">Abbrechen</button>
        <button class="modal-btn primary" id="m-create">Anlegen</button>
      </div>
    </div>
  </div>

  <script>
    function applyTheme(mode) {
      const html = document.documentElement;
      const isDark = mode === 'dark';
      html.classList.toggle('dark', isDark);
      const old = document.getElementById('theme-icon');
      if (old && old.parentNode) {
        const fresh = document.createElement('i');
        fresh.id = 'theme-icon';
        fresh.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        old.parentNode.replaceChild(fresh, old);
        window.lucide && window.lucide.createIcons();
      }
      localStorage.setItem('sturm-theme', mode);
    }
    (function () {
      const saved = localStorage.getItem('sturm-theme');
      if (saved === 'light') document.documentElement.classList.remove('dark');
    })();
    function toggleTheme() {
      const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(next);
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function fmtDate(s) {
      if (!s) return '';
      try { return new Date(s).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }); }
      catch { return s; }
    }
    function fmtCategory(c) {
      return ({ tax: 'Steuer', document: 'Dokument', medical: 'Medizin', other: 'Allgemein' })[c] ?? c;
    }

    let activeApp = null;
    // Cache pro App: Liste aller Fälle. Filtern + Suchen ohne Server-Roundtrip.
    const casesByApp = new Map();
    const filterState = { status: '*', search: '' };

    // ── P9: Tool-Roster — pro App letzter bekannter Health-State
    // toolsByApp.get(appId) = { mode: 'ok'|'boot-skip'|'not-found'|'error',
    //                           tools: ToolHealth[], banner?: string, stale?: boolean }
    const toolsByApp = new Map();
    let toolsPollTimer = null;
    let toolsAbortCtl = null;

    function kindLabelDe(kind) {
      return ({
        llm: 'llm',
        embedder: 'embedder',
        'rag-index': 'rag-index',
        catalog: 'catalog',
        mcp: 'mcp',
        gitchain: 'gitchain',
        kv: 'kv',
      })[kind] || (kind || '');
    }

    function getToolRefMap(app) {
      const map = new Map();
      for (const ref of (app.tools || [])) map.set(ref.name, ref);
      return map;
    }

    function classifyTool(health, ref) {
      const required = !!(ref && ref.required);
      const configured = health && health.configured !== false;
      const alive = !!(health && health.alive);
      const circuit = health && health.circuit;
      if (!configured && !required) return 'grey';
      if (required && !alive) return 'red';
      if (alive && (circuit === 'closed' || circuit === undefined || circuit === null)) return 'green';
      if (alive && circuit === 'half-open') return 'amber';
      if (!alive && !required) return 'amber';
      // Fallback: required but configured & alive without explicit circuit
      return alive ? 'green' : 'red';
    }

    function dotChar(klass) {
      return ({ green: '●', amber: '◐', red: '✕', grey: '○' })[klass] || '·';
    }

    function dotAriaLabel(klass, health) {
      if (klass === 'green') {
        const lat = health && typeof health.latencyMs === 'number' ? ` (${health.latencyMs} ms)` : '';
        return `verfügbar${lat}`;
      }
      if (klass === 'amber') {
        if (health && health.circuit === 'half-open') return 'eingeschränkt — Kreis halb-offen';
        return 'optional — derzeit nicht erreichbar';
      }
      if (klass === 'red') {
        const circ = health && health.circuit === 'open' ? ' — Kreis offen' : '';
        return `ausgefallen${circ}`;
      }
      return 'nicht konfiguriert';
    }

    function expandedKey(appId) { return `0711-anwendungen-tools-expanded.${appId}`; }
    function isExpanded(appId) {
      try { return localStorage.getItem(expandedKey(appId)) === 'true'; }
      catch { return false; }
    }
    function setExpanded(appId, v) {
      try { localStorage.setItem(expandedKey(appId), v ? 'true' : 'false'); }
      catch {}
    }

    function summarizeHealth(app, snap) {
      // Returns { counts: {green, amber, red, grey}, redNames: string[], rows: [...] }
      const refMap = getToolRefMap(app);
      const refs = app.tools || [];
      const healths = (snap && snap.tools) || {};
      const counts = { green: 0, amber: 0, red: 0, grey: 0 };
      const redNames = [];
      const rows = [];
      // Determine the union of declared refs and health entries, prefer ref order
      const seen = new Set();
      const ordered = [];
      for (const r of refs) { ordered.push(r.name); seen.add(r.name); }
      for (const k of Object.keys(healths)) if (!seen.has(k)) ordered.push(k);
      for (const name of ordered) {
        const ref = refMap.get(name) || { name, kind: (healths[name] && healths[name].kind) || '', required: false };
        const h = healths[name] || null;
        const klass = classifyTool(h, ref);
        counts[klass]++;
        if (klass === 'red') redNames.push(name);
        rows.push({ ref, health: h, klass });
      }
      return { counts, redNames, rows };
    }

    function urlForRow(row) {
      const h = row.health || {};
      if (h && h.url) return String(h.url);
      const ref = row.ref || {};
      const cfg = ref.config || {};
      if (cfg.provider) return String(cfg.provider) + (cfg.model ? `:${cfg.model}` : '');
      if (cfg.containerId) return String(cfg.containerId);
      if (cfg.defaultUrl) return String(cfg.defaultUrl);
      return '';
    }

    function renderToolsPanel(app) {
      const snap = toolsByApp.get(app.id);
      const expanded = isExpanded(app.id);
      const total = (app.tools || []).length;
      // Banner-Fälle (kein Container / nicht-gefunden / boot-skip)
      if (snap && (snap.mode === 'boot-skip' || snap.mode === 'not-found')) {
        const msg = snap.banner || '(Tool-Container nicht gestartet)';
        return `
          <div class="tools-panel" data-app-tools="${escapeHtml(app.id)}" data-expanded="false" data-mode="${escapeHtml(snap.mode)}">
            <div class="tools-banner">${escapeHtml(msg)}</div>
          </div>
        `;
      }
      const { counts } = snap ? summarizeHealth(app, snap) : { counts: { green: 0, amber: 0, red: 0, grey: 0 } };
      const stale = snap && snap.stale;
      const countsHtml = `
        <span class="ct" title="verfügbar"><span class="tools-dot green" aria-hidden="true">●</span>${counts.green}</span>
        <span class="ct" title="eingeschränkt"><span class="tools-dot amber" aria-hidden="true">◐</span>${counts.amber}</span>
        <span class="ct" title="ausgefallen"><span class="tools-dot red" aria-hidden="true">✕</span>${counts.red}</span>
        ${counts.grey > 0 ? `<span class="ct" title="nicht konfiguriert"><span class="tools-dot grey" aria-hidden="true">○</span>${counts.grey}</span>` : ''}
        ${stale ? '<span class="tools-warn" title="Letzte Aktualisierung fehlgeschlagen — verwende vorigen Stand" aria-label="Aktualisierung fehlgeschlagen">⚠</span>' : ''}
      `;
      const bodyHtml = snap ? renderToolsBody(app, snap) : '<div class="tools-banner">Lade Werkzeug-Status…</div>';
      return `
        <div class="tools-panel" data-app-tools="${escapeHtml(app.id)}" data-expanded="${expanded ? 'true' : 'false'}">
          <button type="button" class="tools-chip" data-action="toggle-tools" data-app="${escapeHtml(app.id)}"
                  aria-expanded="${expanded ? 'true' : 'false'}"
                  aria-controls="tools-body-${escapeHtml(app.id)}">
            <span class="tools-chip-label">
              <span class="tools-chip-caret" aria-hidden="true">▶</span>
              Werkzeuge (${total})
            </span>
            <span class="tools-chip-counts">${countsHtml}</span>
          </button>
          <div class="tools-body" id="tools-body-${escapeHtml(app.id)}" role="region" aria-label="Werkzeug-Status">${bodyHtml}</div>
        </div>
      `;
    }

    function renderToolsBody(app, snap) {
      const { rows } = summarizeHealth(app, snap);
      if (rows.length === 0) return '<div class="tools-banner">Keine Werkzeuge deklariert.</div>';
      return rows.map((row) => {
        const klass = row.klass;
        const required = !!(row.ref && row.ref.required);
        const requiredDown = required && klass === 'red';
        const h = row.health || {};
        const lat = (typeof h.latencyMs === 'number') ? `${h.latencyMs} ms` : '—';
        const circ = h.circuit ? String(h.circuit) : (klass === 'grey' ? 'not configured' : '—');
        const url = urlForRow(row);
        const kind = kindLabelDe((row.ref && row.ref.kind) || h.kind || '');
        const nameLabel = required ? `${row.ref.name}` : row.ref.name;
        return `
          <div class="tools-row ${requiredDown ? 'required-down' : ''}" role="row">
            <span class="tools-dot ${klass}" role="cell" aria-label="${escapeHtml(dotAriaLabel(klass, h))}">${dotChar(klass)}</span>
            <span class="tname" role="cell" title="${required ? 'erforderlich' : 'optional'}">${escapeHtml(nameLabel)}</span>
            <span class="tkind" role="cell">${escapeHtml(kind)}</span>
            <span class="turl" role="cell" title="${escapeHtml(url)}">${escapeHtml(url)}</span>
            <span class="tlat" role="cell">${escapeHtml(lat)}</span>
            <span class="tcirc" role="cell">${escapeHtml(circ)}</span>
          </div>
        `;
      }).join('');
    }

    function buttonGatingFor(app) {
      const snap = toolsByApp.get(app.id);
      // Boot-skip / not-found: do not gate
      if (!snap || snap.mode === 'boot-skip' || snap.mode === 'not-found') {
        return { disabled: false, redNames: [] };
      }
      const { redNames } = summarizeHealth(app, snap);
      return { disabled: redNames.length > 0, redNames };
    }

    function applyButtonGating(host, apps) {
      for (const app of apps) {
        const btn = host.querySelector(`.app-new-btn[data-app="${cssEscape(app.id)}"]`);
        if (!btn) continue;
        const { disabled, redNames } = buttonGatingFor(app);
        if (disabled) {
          btn.setAttribute('aria-disabled', 'true');
          btn.setAttribute('title', `Werkzeug(e) nicht verfügbar: ${redNames.join(', ')}`);
        } else {
          btn.removeAttribute('aria-disabled');
          btn.removeAttribute('title');
        }
      }
    }

    function cssEscape(s) {
      if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(s);
      return String(s).replace(/[^a-zA-Z0-9_-]/g, (c) => `\\${c}`);
    }

    function updateToolsDom(host, apps) {
      for (const app of apps) {
        const panel = host.querySelector(`.tools-panel[data-app-tools="${cssEscape(app.id)}"]`);
        if (!panel) continue;
        const snap = toolsByApp.get(app.id);
        // If mode changed (e.g. boot-skip → ok), do a full re-render of the panel.
        const currentMode = panel.getAttribute('data-mode');
        const nextMode = snap && (snap.mode === 'boot-skip' || snap.mode === 'not-found') ? snap.mode : null;
        if (currentMode !== nextMode) {
          panel.outerHTML = renderToolsPanel(app);
          attachToolsHandlers(host);
          continue;
        }
        if (nextMode) continue; // banner mode — nothing to update
        const { counts } = snap ? summarizeHealth(app, snap) : { counts: { green: 0, amber: 0, red: 0, grey: 0 } };
        const stale = snap && snap.stale;
        const countsHost = panel.querySelector('.tools-chip-counts');
        if (countsHost) {
          countsHost.innerHTML = `
            <span class="ct" title="verfügbar"><span class="tools-dot green" aria-hidden="true">●</span>${counts.green}</span>
            <span class="ct" title="eingeschränkt"><span class="tools-dot amber" aria-hidden="true">◐</span>${counts.amber}</span>
            <span class="ct" title="ausgefallen"><span class="tools-dot red" aria-hidden="true">✕</span>${counts.red}</span>
            ${counts.grey > 0 ? `<span class="ct" title="nicht konfiguriert"><span class="tools-dot grey" aria-hidden="true">○</span>${counts.grey}</span>` : ''}
            ${stale ? '<span class="tools-warn" title="Letzte Aktualisierung fehlgeschlagen — verwende vorigen Stand" aria-label="Aktualisierung fehlgeschlagen">⚠</span>' : ''}
          `;
        }
        const body = panel.querySelector('.tools-body');
        if (body && snap) body.innerHTML = renderToolsBody(app, snap);
      }
      applyButtonGating(host, apps);
    }

    function attachToolsHandlers(host) {
      host.querySelectorAll('[data-action="toggle-tools"]').forEach((btn) => {
        if (btn.dataset.toolsBound === '1') return;
        btn.dataset.toolsBound = '1';
        btn.addEventListener('click', () => {
          const appId = btn.dataset.app;
          const panel = btn.closest('.tools-panel');
          const next = !(panel && panel.getAttribute('data-expanded') === 'true');
          if (panel) panel.setAttribute('data-expanded', next ? 'true' : 'false');
          btn.setAttribute('aria-expanded', next ? 'true' : 'false');
          setExpanded(appId, next);
        });
      });
    }

    async function fetchHealthFor(appId, signal) {
      try {
        const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/tools/health`, { signal });
        if (res.status === 404) return { mode: 'not-found', tools: {}, banner: '(Tool-Container nicht gestartet)' };
        if (res.status === 503) return { mode: 'boot-skip', tools: {}, banner: '(Tool-Container nicht gestartet)' };
        if (!res.ok) {
          return { mode: 'error', error: `HTTP ${res.status}` };
        }
        const j = await res.json();
        return { mode: 'ok', tools: j.tools || {} };
      } catch (e) {
        if (e && e.name === 'AbortError') throw e;
        return { mode: 'error', error: String((e && e.message) || e) };
      }
    }

    async function pollToolsHealth(apps, host) {
      if (toolsAbortCtl) toolsAbortCtl.abort();
      toolsAbortCtl = new AbortController();
      const signal = toolsAbortCtl.signal;
      try {
        const results = await Promise.all(apps.map((app) => fetchHealthFor(app.id, signal)));
        if (signal.aborted) return;
        results.forEach((r, i) => {
          const app = apps[i];
          if (r.mode === 'error') {
            // Network/server fault: keep last-known snapshot, flag stale.
            const prev = toolsByApp.get(app.id);
            if (prev) {
              toolsByApp.set(app.id, { ...prev, stale: true });
            } else {
              toolsByApp.set(app.id, { mode: 'error', tools: {}, stale: true });
            }
            console.error(`[tools/health] ${app.id}: ${r.error}`);
            return;
          }
          toolsByApp.set(app.id, { ...r, stale: false });
        });
        updateToolsDom(host, apps);
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        console.error('[tools/health] poll failed', e);
      }
    }

    function startToolsPolling(apps, host) {
      stopToolsPolling();
      // First tick is performed by caller (loadApps). Subsequent ticks every 10 s.
      toolsPollTimer = window.setInterval(() => {
        if (document.visibilityState === 'hidden') return;
        pollToolsHealth(apps, host);
      }, 10000);
    }

    function stopToolsPolling() {
      if (toolsPollTimer) {
        clearInterval(toolsPollTimer);
        toolsPollTimer = null;
      }
      if (toolsAbortCtl) {
        toolsAbortCtl.abort();
        toolsAbortCtl = null;
      }
    }

    function statusLabel(s) {
      return ({ in_bearbeitung: 'In Bearbeitung', review: 'Review', versiegelt: 'Versiegelt', eingereicht: 'Eingereicht', archiviert: 'Archiviert' })[s] ?? s;
    }

    function caseMatches(c) {
      if (filterState.status !== '*' && c.status !== filterState.status) return false;
      const q = filterState.search.trim().toLowerCase();
      if (!q) return true;
      return (c.displayName || '').toLowerCase().includes(q)
        || (c.mandantId || '').toLowerCase().includes(q)
        || (c.caseId || '').toLowerCase().includes(q);
    }

    function renderCaseRow(appId, c) {
      const safeId = encodeURIComponent(c.caseId);
      const safeApp = encodeURIComponent(appId);
      const trashIcon = c.status === 'in_bearbeitung' ? 'trash-2' : 'archive';
      const title = c.status === 'in_bearbeitung' ? 'Fall löschen' : 'Fall archivieren';
      return `
        <div class="case-row" data-case="${escapeHtml(c.caseId)}">
          <div class="case-row-head">
            <a class="case-row-link" href="/steuerfall.html?app=${safeApp}&case=${safeId}">
              <div>
                <p class="case-title">${escapeHtml(c.displayName)}</p>
                <p class="case-sub">${escapeHtml(c.caseId)} · Mandant ${escapeHtml(c.mandantId || '—')}</p>
              </div>
              <span class="case-meta">${c.runs?.length ?? 0} Run${(c.runs?.length ?? 0) === 1 ? '' : 's'}</span>
              <span class="case-meta">${fmtDate(c.createdAt)}</span>
              <span class="case-status ${escapeHtml(c.status)}">${escapeHtml(statusLabel(c.status))}</span>
            </a>
            <button class="case-row-del" data-action="del-case"
                    data-app="${escapeHtml(appId)}"
                    data-case="${escapeHtml(c.caseId)}"
                    data-status="${escapeHtml(c.status)}"
                    title="${title}">
              <i data-lucide="${trashIcon}"></i>
            </button>
          </div>
          ${renderCaseDocs(appId, c)}
        </div>
      `;
    }

    // ── Per-Dokument Qualitäts-Strip ────────────────────────────────
    // Rendert pro Dokument im Manifest eine Zeile:
    //   "<filename>  | 105 Felder · ● 36  ◐ 46  ✕ 17  ○ 2 | KAP, N, V"
    // Trust-Mapping: ● green=high, ◐ amber=medium, ✕ red=suspicious,
    //                ○ grey=low — gleich wie Tool-Roster-Legende.
    // Wenn KEIN Dokument einen trustBreakdown hat, blendet die Funktion
    // den ganzen Strip aus (Backfill-Link bleibt sichtbar, damit der
    // Reviewer ihn anstoßen kann).
    function renderCaseDocs(appId, c) {
      const docs = Array.isArray(c.documents) ? c.documents : [];
      if (docs.length === 0) return '';
      const hasAnyBreakdown = docs.some(d => d.trustBreakdown);
      const rows = docs.map(d => {
        const tb = d.trustBreakdown || { high: 0, medium: 0, suspicious: 0, low: 0 };
        const fields = typeof d.fieldsExtracted === 'number' ? d.fieldsExtracted : 0;
        const anlagen = Array.isArray(d.anlagen) && d.anlagen.length
          ? `· ${escapeHtml(d.anlagen.join(', '))}`
          : '';
        const trustChips = d.trustBreakdown
          ? `<span class="case-doc-trust">
               <span class="ct"><span class="tools-dot green">●</span>${tb.high}</span>
               <span class="ct"><span class="tools-dot amber">◐</span>${tb.medium}</span>
               <span class="ct"><span class="tools-dot red">✕</span>${tb.suspicious}</span>
               <span class="ct"><span class="tools-dot grey">○</span>${tb.low}</span>
             </span>`
          : '<span class="case-doc-trust" title="Trust-Verteilung noch nicht berechnet — \'Qualität neu berechnen\' anstoßen">—</span>';
        return `
          <div class="case-doc" title="${escapeHtml(d.filename || '')}">
            <span class="case-doc-name">${escapeHtml(d.filename || d.runId || '?')}</span>
            <span class="case-doc-fields">${fields} Felder</span>
            ${trustChips}
            <span class="case-doc-anlagen">${anlagen}</span>
          </div>
        `;
      }).join('');
      const recomputeLabel = hasAnyBreakdown ? 'Qualität neu berechnen' : 'Qualität berechnen';
      return `
        <div class="case-docs">
          ${rows}
          <div>
            <button class="case-recompute" data-action="recompute-quality"
                    data-app="${escapeHtml(appId)}"
                    data-case="${escapeHtml(c.caseId)}">
              ${recomputeLabel}
            </button>
          </div>
        </div>
      `;
    }

    function renderFilterChips(allCases) {
      const counts = { '*': allCases.length, in_bearbeitung: 0, versiegelt: 0, eingereicht: 0, archiviert: 0 };
      for (const c of allCases) { if (counts[c.status] !== undefined) counts[c.status]++; }
      const labels = [
        { id: '*', label: 'Alle' },
        { id: 'in_bearbeitung', label: 'In Bearbeitung' },
        { id: 'versiegelt', label: 'Versiegelt' },
        { id: 'eingereicht', label: 'Eingereicht' },
        { id: 'archiviert', label: 'Archiviert' },
      ];
      const chips = labels.map(l => `
        <button class="case-filter-chip ${filterState.status === l.id ? 'active' : ''}" data-filter-status="${escapeHtml(l.id)}">
          <span>${escapeHtml(l.label)}</span>
          <span class="case-filter-chip-count">${counts[l.id] || 0}</span>
        </button>
      `).join('');
      return `
        <div class="case-filter">
          ${chips}
          <input class="case-filter-search" type="search" placeholder="Suche (Name, Mandant, ID)…" value="${escapeHtml(filterState.search)}">
        </div>
      `;
    }

    function paintSections(host, apps) {
      const sections = apps.map((app) => {
        const all = casesByApp.get(app.id) || [];
        const filtered = all.filter(caseMatches);
        const rowsHtml = all.length === 0
          ? '<div class="empty">Noch keine Fälle. Lege oben einen neuen Fall an.</div>'
          : filtered.length === 0
            ? '<div class="empty">Keine Fälle mit diesen Filtern.</div>'
            : filtered.map(c => renderCaseRow(app.id, c)).join('');
        return `
          <section class="app-section" data-app="${escapeHtml(app.id)}">
            <div class="app-header">
              <div>
                <h2>${escapeHtml(app.name)} <span class="app-header-sub">· ${fmtCategory(app.category)}</span></h2>
                <p class="app-header-sub" style="margin:4px 0 0;">${escapeHtml(app.description)}</p>
              </div>
              <button class="app-new-btn" data-app="${escapeHtml(app.id)}" data-action="new-case">
                <i data-lucide="plus"></i><span>Neuer Fall</span>
              </button>
            </div>
            ${renderToolsPanel(app)}
            ${renderFilterChips(all)}
            <div style="margin-top: 14px;">${rowsHtml}</div>
          </section>
        `;
      }).join('');
      host.innerHTML = sections;
      window.lucide && window.lucide.createIcons();
      attachToolsHandlers(host);
      applyButtonGating(host, apps);

      host.querySelectorAll('[data-action="new-case"]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.getAttribute('aria-disabled') === 'true') return;
          openCreateModal(btn.dataset.app);
        });
      });
      host.querySelectorAll('[data-action="del-case"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          handleDelete(btn.dataset.app, btn.dataset.case, btn.dataset.status);
        });
      });
      host.querySelectorAll('[data-action="recompute-quality"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          await handleRecomputeQuality(btn);
        });
      });
      host.querySelectorAll('[data-filter-status]').forEach(chip => {
        chip.addEventListener('click', () => {
          filterState.status = chip.dataset.filterStatus;
          paintSections(host, apps);
        });
      });
      host.querySelectorAll('.case-filter-search').forEach(input => {
        input.addEventListener('input', (e) => {
          filterState.search = e.target.value;
          // Nur Body neu zeichnen, Fokus im Eingabefeld behalten
          paintSections(host, apps);
          const fresh = host.querySelector('.case-filter-search');
          if (fresh) { fresh.focus(); fresh.setSelectionRange(filterState.search.length, filterState.search.length); }
        });
      });
    }

    async function handleDelete(appId, caseId, status) {
      const isArchive = status !== 'in_bearbeitung';
      const verb = isArchive ? 'archivieren' : 'löschen';
      if (!confirm(`Fall "${caseId}" wirklich ${verb}?`)) return;
      const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/instances/${encodeURIComponent(caseId)}`, {
        method: 'DELETE',
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        alert(`Fehler: ${j.error || res.status}`);
        return;
      }
      const j = await res.json().catch(() => ({}));
      const arr = casesByApp.get(appId) || [];
      if (j.deleted) {
        casesByApp.set(appId, arr.filter(c => c.caseId !== caseId));
      } else if (j.archived) {
        const idx = arr.findIndex(c => c.caseId === caseId);
        if (idx >= 0) arr[idx] = { ...arr[idx], status: 'archiviert' };
      }
      const apps = window.__loadedApps || [];
      paintSections(document.getElementById('app-list'), apps);
    }

    async function handleRecomputeQuality(btn) {
      const appId = btn.dataset.app;
      const caseId = btn.dataset.case;
      if (!appId || !caseId) return;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Berechne…';
      try {
        const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/instances/${encodeURIComponent(caseId)}/recompute-quality`);
        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          alert(`Fehler: ${j.error || res.status}`);
          btn.disabled = false;
          btn.textContent = original;
          return;
        }
        const j = await res.json();
        // Frischer instance-Snapshot direkt aus der Response nutzen — der
        // Server liefert das vollständige Objekt inkl. updated documents[].
        const arr = casesByApp.get(appId) || [];
        const idx = arr.findIndex(c => c.caseId === caseId);
        if (idx >= 0 && j.instance) arr[idx] = j.instance;
        const apps = window.__loadedApps || [];
        paintSections(document.getElementById('app-list'), apps);
      } catch (e) {
        alert(`Fehler: ${e?.message || e}`);
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    async function loadApps() {
      const apps = await fetch('/api/applications').then(r => r.json());
      window.__loadedApps = apps;
      const host = document.getElementById('app-list');
      if (!Array.isArray(apps) || apps.length === 0) {
        host.innerHTML = '<div class="app-section"><div class="empty">Keine Anwendungen registriert.</div></div>';
        return;
      }
      await Promise.all(apps.map(async (app) => {
        const cases = await fetch(`/api/applications/${encodeURIComponent(app.id)}/instances`)
          .then(r => r.ok ? r.json() : []);
        casesByApp.set(app.id, cases);
      }));
      // P9: Initialer Tool-Health-Fetch parallel zu allen Anwendungen.
      // Ohne await wäre der erste Render ohne Dots — wir warten kurz, damit
      // die Buttons schon im richtigen Gating-Zustand erscheinen.
      const initCtl = new AbortController();
      const initial = await Promise.all(apps.map((app) => fetchHealthFor(app.id, initCtl.signal).catch((e) => ({ mode: 'error', error: String(e) }))));
      initial.forEach((r, i) => {
        if (r && r.mode !== 'error') {
          toolsByApp.set(apps[i].id, { ...r, stale: false });
        } else if (r) {
          toolsByApp.set(apps[i].id, { mode: 'error', tools: {}, stale: true });
          if (r.error) console.error(`[tools/health] ${apps[i].id}: ${r.error}`);
        }
      });
      paintSections(host, apps);
      startToolsPolling(apps, host);
    }

    function openCreateModal(appId) {
      activeApp = appId;
      document.getElementById('m-err').textContent = '';
      document.getElementById('m-display').value = '';
      document.getElementById('m-mandant').value = '';
      document.getElementById('m-jahr').value = new Date().getFullYear() - 1;
      document.getElementById('create-modal-title').textContent = `Neuer Fall · ${appId}`;
      document.getElementById('create-modal').classList.add('open');
      setTimeout(() => document.getElementById('m-display').focus(), 50);
    }
    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('open');
      activeApp = null;
    }
    async function submitCreate() {
      // Snapshot der App-ID, BEVOR closeCreateModal() activeApp = null
      // setzt. Bug aus E2E: ohne Snapshot landete der Redirect mit
      // ?app=null, da activeApp zum Zeitpunkt der location.href-Zuweisung
      // bereits zurückgesetzt war.
      const appId = activeApp;
      if (!appId) return;
      const displayName = document.getElementById('m-display').value.trim();
      const mandant_id = document.getElementById('m-mandant').value.trim();
      const jahrStr = document.getElementById('m-jahr').value.trim();
      const veranlagungsjahr = jahrStr ? Number(jahrStr) : undefined;
      const err = document.getElementById('m-err');
      err.textContent = '';
      if (!displayName) { err.textContent = 'Anzeigename ist Pflicht.'; return; }
      if (!mandant_id) { err.textContent = 'Mandant-ID ist Pflicht.'; return; }
      try {
        const res = await fetch(`/api/applications/${encodeURIComponent(appId)}/instances`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ displayName, mandant_id, veranlagungsjahr }),
        });
        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          err.textContent = j.error || `HTTP ${res.status}`;
          return;
        }
        const inst = await res.json();
        closeCreateModal();
        location.href = `/steuerfall.html?app=${encodeURIComponent(appId)}&case=${encodeURIComponent(inst.caseId)}`;
      } catch (e) {
        err.textContent = String(e?.message || e);
      }
    }

    import('/nav.js').then(({ renderSturmNav, contextRendererAnwendungen }) => {
      renderSturmNav({ activeNav: 'anwendungen', contextHeading: 'Registrierte Anwendungen', contextRenderer: contextRendererAnwendungen });
    });

    window.addEventListener('DOMContentLoaded', () => {
      window.lucide && window.lucide.createIcons();
      loadApps();
      document.getElementById('theme-btn').addEventListener('click', toggleTheme);
      document.getElementById('m-cancel').addEventListener('click', closeCreateModal);
      document.getElementById('m-create').addEventListener('click', submitCreate);
      document.getElementById('create-modal').addEventListener('click', (e) => {
        if (e.target.id === 'create-modal') closeCreateModal();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeCreateModal();
      });
      // P9: Polling-Pause bei Tab-Hidden, Resume bei sichtbar.
      document.addEventListener('visibilitychange', () => {
        const apps = window.__loadedApps || [];
        const host = document.getElementById('app-list');
        if (document.visibilityState === 'hidden') {
          if (toolsAbortCtl) toolsAbortCtl.abort();
        } else if (apps.length && host) {
          // Sofortiger Refresh beim Zurückkommen, dann läuft das Intervall weiter.
          pollToolsHealth(apps, host);
        }
      });
      window.addEventListener('pagehide', stopToolsPolling);
    });
  </script>
</body>
</html>
