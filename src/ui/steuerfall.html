<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="utf-8">
  <title>Steuerfall · STURM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="/design-system/colors_and_type.css">
  <link rel="stylesheet" href="/design-system/sturm-app.css">
  <link rel="icon" type="image/svg+xml" href="/design-system/assets/logo-mark.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .fall-wrap { width: 100%; max-width: 960px; padding: 0 24px 32px; }
    .fall-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin: 16px 0 20px;
    }
    .fall-head h1 {
      margin: 0;
      font-size: 18px;
      color: var(--color-text-primary);
    }
    .fall-head .meta {
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin-top: 4px;
    }
    .fall-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .fall-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 12.5px;
      cursor: pointer;
    }
    .fall-btn:hover { border-color: var(--color-accent); color: var(--color-text-primary); }
    .fall-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .fall-btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-bg-primary, #000); }

    .mcp-dots {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 11px;
      color: var(--color-text-tertiary);
      background: var(--color-bg-card, transparent);
    }
    .mcp-dot {
      display: inline-flex; align-items: center; gap: 4px;
    }
    .mcp-dot-orb {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-text-tertiary);
      flex-shrink: 0;
    }
    .mcp-dot-orb.alive { background: #059669; }
    .mcp-dot-orb.dead { background: #ef4444; }
    .mcp-dot-orb.unconfigured { background: var(--color-text-tertiary); opacity: 0.5; }

    .panel {
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 16px;
      background: var(--color-bg-card, transparent);
      margin-bottom: 16px;
    }
    .panel h3 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary);
      letter-spacing: 0.02em;
    }
    .panel-sub {
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin-bottom: 12px;
    }

    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 2px dashed var(--color-border);
      border-radius: 10px;
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      position: relative;
    }
    .drop:hover, .drop.dragging { border-color: var(--color-accent); background: var(--color-bg-hover); }
    .drop.busy { opacity: 0.7; cursor: progress; border-style: solid; }
    .drop input[type=file] { display: none; }
    .drop-icon {
      display: inline-flex;
      width: 40px; height: 40px;
      align-items: center; justify-content: center;
      border-radius: 10px;
      background: var(--color-bg-hover);
      margin-bottom: 4px;
    }
    .drop-icon i { width: 20px; height: 20px; }
    .drop-hint { font-size: 13.5px; color: var(--color-text-secondary); }
    .drop-hint strong { color: var(--color-text-primary); }
    .drop-sub { font-size: 11.5px; color: var(--color-text-tertiary); }
    .drop-file {
      margin-top: 10px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--color-text-primary);
      padding: 5px 10px;
      border-radius: 5px;
      background: var(--color-bg-hover);
      display: inline-block;
    }
    .drop-progress {
      width: 100%;
      max-width: 360px;
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .drop-progress.indeterminate .drop-progress-fill {
      animation: drop-progress 1.4s ease-in-out infinite;
      width: 30%;
    }
    .drop-progress-fill {
      height: 100%;
      background: var(--color-accent);
      width: 0%;
      transition: width .25s ease;
    }
    @keyframes drop-progress {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(340%); }
    }
    .drop-stage {
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--color-text-secondary);
      font-family: ui-monospace, monospace;
      min-height: 14px;
    }
    .drop-stage strong { color: var(--color-text-primary); font-weight: 500; }
    .drop-result {
      margin-top: 8px;
      font-size: 12px;
      color: #059669;
    }
    .drop-result.err { color: #ef4444; }

    .run-state-badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 1px 7px; border-radius: 999px;
      font-size: 10.5px; font-weight: 500;
    }
    .run-state-badge.ok { background: rgba(5, 150, 105, .15); color: #059669; }
    .run-state-badge.error { background: rgba(239, 68, 68, .15); color: #ef4444; }
    .run-state-badge.partial { background: rgba(217, 119, 6, .15); color: #d97706; }
    .run-state-badge.unknown { background: var(--color-bg-hover); color: var(--color-text-tertiary); }

    /* Run-Detail-Modal */
    .run-detail-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center; justify-content: center;
      z-index: 200;
      padding: 24px;
    }
    .run-detail-backdrop.open { display: flex; }
    .run-detail-modal {
      width: 100%; max-width: 720px;
      max-height: 80vh;
      overflow: auto;
      background: var(--color-bg-card, #1a1a1a);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 20px;
    }
    .run-detail-modal h3 { margin: 0 0 4px; font-size: 15px; }
    .run-detail-meta { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 14px; }
    .run-detail-stages { display: flex; flex-direction: column; gap: 4px; }
    .run-detail-stage {
      display: grid;
      grid-template-columns: 18px 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 12px;
    }
    .run-detail-stage-state {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-text-tertiary);
    }
    .run-detail-stage-state.ok { background: #059669; }
    .run-detail-stage-state.error { background: #ef4444; }
    .run-detail-stage-state.skipped { background: var(--color-text-tertiary); }
    .run-detail-stage-id { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--color-text-primary); }
    .run-detail-stage-ms { color: var(--color-text-tertiary); font-size: 11px; }

    .run-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 12.5px;
    }
    .run-row + .run-row { margin-top: 6px; }
    .run-state {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px; height: 22px;
      border-radius: 5px;
      background: var(--color-bg-hover);
    }
    .run-id { color: var(--color-text-tertiary); font-family: ui-monospace, monospace; font-size: 11px; }
    .run-meta { color: var(--color-text-tertiary); font-size: 11px; }

    .events {
      max-height: 240px;
      overflow-y: auto;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--color-text-secondary);
      background: var(--color-bg-primary, #000);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .layer-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .layer-table th, .layer-table td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--color-border);
    }
    .layer-table th {
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-tertiary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .layer-table tr:hover td { background: var(--color-bg-hover); }
    .origin-pill {
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--color-bg-hover);
      color: var(--color-text-secondary);
      font-family: ui-monospace, monospace;
    }
    .origin-pill.REGEX_100\% { background: rgba(5, 150, 105, .12); color: #059669; }
    .origin-pill.LLM_FSM { background: rgba(37, 99, 235, .12); color: #2563eb; }
    .origin-pill.BMF_RECHNER { background: rgba(217, 119, 6, .12); color: #d97706; }
    .origin-pill.ENSEMBLE_TIE { background: rgba(239, 68, 68, .12); color: #ef4444; }

    .empty { color: var(--color-text-tertiary); font-size: 12.5px; padding: 12px 0; }
    .err { color: #ef4444; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="sturm-app">
    <aside id="sturm-nav-host"></aside>

    <div class="sturm-main">
      <header class="sturm-topbar">
        <div class="sturm-topbar-l">
          <a href="/anwendungen.html" style="color: var(--color-text-tertiary); text-decoration:none; font-size:12px;">← Anwendungen</a>
          <span style="margin: 0 6px; color: var(--color-text-tertiary);">/</span>
          <span class="sturm-topbar-title" id="case-title">Lade…</span>
        </div>
        <div class="sturm-topbar-r">
          <button class="sturm-icon-btn" id="theme-btn"><i data-lucide="sun" id="theme-icon"></i></button>
        </div>
      </header>

      <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center;">
        <div class="fall-wrap">
          <div class="fall-head">
            <div>
              <h1 id="case-display">…</h1>
              <div class="meta" id="case-meta">…</div>
            </div>
            <div class="fall-actions">
              <div class="mcp-dots" id="mcp-dots" title="MCP-Health"></div>
              <a class="fall-btn" id="btn-dl-master" hidden download><i data-lucide="file-down"></i><span>master.json</span></a>
              <a class="fall-btn" id="btn-dl-eric" hidden download><i data-lucide="file-code"></i><span>eric.xml</span></a>
              <button class="fall-btn" id="btn-seal" disabled><i data-lucide="lock"></i><span>Versiegeln</span></button>
              <button class="fall-btn primary" id="btn-export" disabled><i data-lucide="send"></i><span>An ELSTER</span></button>
            </div>
          </div>

          <section class="panel">
            <h3>Dokument hochladen</h3>
            <p class="panel-sub">Beim Upload wird der extraction-Workflow der Anwendung gestartet (z.B. elster-v5_2-rag mit TurboQuant + 4-LLM-Ensemble).</p>
            <label class="drop" id="drop">
              <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg">
              <span class="drop-icon"><i data-lucide="upload"></i></span>
              <div class="drop-hint"><strong>Datei hier ablegen</strong> oder klicken</div>
              <div class="drop-sub">PDF · PNG · JPG (max 25 MB)</div>
              <div class="drop-file" id="drop-file" hidden></div>
              <div class="drop-progress" id="drop-progress" hidden><div class="drop-progress-fill" id="drop-progress-fill"></div></div>
              <div class="drop-stage" id="drop-stage" hidden></div>
              <div class="drop-result" id="drop-result" hidden></div>
            </label>
            <div class="err" id="upload-err"></div>
          </section>

          <section class="panel" id="events-panel" hidden>
            <h3>Live-Events</h3>
            <div class="events" id="events"></div>
          </section>

          <section class="panel" id="seal-panel" hidden>
            <h3>Versiegelung</h3>
            <div id="seal-result"></div>
          </section>

          <section class="panel">
            <h3>Run-Historie</h3>
            <div id="runs"></div>
          </section>

          <div class="run-detail-backdrop" id="run-detail" role="dialog" aria-modal="true">
            <div class="run-detail-modal" id="run-detail-body"></div>
          </div>

          <section class="panel" id="layer-panel" hidden>
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
              <div>
                <h3 style="margin:0 0 4px;">Canonical Layer (letzter Run)</h3>
                <p class="panel-sub" id="layer-sub" style="margin:0;"></p>
              </div>
              <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--color-text-secondary); cursor:pointer;">
                <input type="checkbox" id="layer-show-all" style="cursor:pointer;">
                <span>Format-Varianten zeigen</span>
              </label>
            </div>
            <table class="layer-table" style="margin-top:12px;">
              <thead><tr><th>eCode</th><th>Feld</th><th>Anlage</th><th>Wert</th><th>Origin</th></tr></thead>
              <tbody id="layer-rows"></tbody>
            </table>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script>
    function applyTheme(mode) {
      const html = document.documentElement;
      const isDark = mode === 'dark';
      html.classList.toggle('dark', isDark);
      const old = document.getElementById('theme-icon');
      if (old && old.parentNode) {
        const fresh = document.createElement('i');
        fresh.id = 'theme-icon';
        fresh.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        old.parentNode.replaceChild(fresh, old);
        window.lucide && window.lucide.createIcons();
      }
      localStorage.setItem('sturm-theme', mode);
    }
    (function () {
      const saved = localStorage.getItem('sturm-theme');
      if (saved === 'light') document.documentElement.classList.remove('dark');
    })();
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function fmtDate(s) {
      if (!s) return '';
      try { return new Date(s).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }); } catch { return s; }
    }

    const params = new URLSearchParams(location.search);
    // Akzeptiere nur echte Werte — die String-Literale "null"/"undefined"
    // entstehen, wenn z.B. ein Programm undefined per encodeURIComponent
    // serialisiert oder ein Bookmark mit unresolved Template-Variable
    // geteilt wird. Lieber sauber abfangen als kryptische 404.
    function cleanParam(v) {
      if (typeof v !== 'string') return null;
      const t = v.trim();
      if (!t || t === 'null' || t === 'undefined') return null;
      return t;
    }
    const APP_ID = cleanParam(params.get('app'));
    const CASE_ID = cleanParam(params.get('case'));

    if (!APP_ID || !CASE_ID) {
      // Replace the main content with a helpful redirect — Sidebar bleibt
      // sichtbar, der Topbar-Link funktioniert weiterhin.
      const main = document.querySelector('.sturm-main');
      if (main) {
        main.innerHTML = `
          <header class="sturm-topbar">
            <div class="sturm-topbar-l">
              <a href="/anwendungen.html" style="color: var(--color-text-tertiary); text-decoration:none; font-size:12px;">← Anwendungen</a>
            </div>
          </header>
          <div style="flex:1; display:flex; align-items:center; justify-content:center; padding: 32px;">
            <div style="max-width: 480px; text-align: center;">
              <h2 style="margin: 0 0 12px; color: var(--color-text-primary);">Kein Fall ausgewählt</h2>
              <p style="color: var(--color-text-secondary); margin: 0 0 20px; line-height: 1.55;">
                Diese Seite braucht einen aktiven Fall (URL: <code>?app=…&amp;case=…</code>).
                Wähle einen bestehenden Fall aus oder lege einen neuen an.
              </p>
              <a href="/anwendungen.html" style="display:inline-block; padding: 9px 16px; border-radius: 8px; background: var(--color-accent); color: var(--color-bg-primary, #000); text-decoration: none; font-weight: 500;">Zu den Anwendungen</a>
            </div>
          </div>
        `;
      }
      window.lucide && window.lucide.createIcons();
      throw new Error('missing or invalid app/case params');
    }

    let instance = null;

    async function loadMcpHealth() {
      const host = document.getElementById('mcp-dots');
      if (!host) return;
      try {
        const r = await fetch(`/api/applications/${encodeURIComponent(APP_ID)}/mcps/health`);
        if (!r.ok) { host.innerHTML = ''; return; }
        const data = await r.json();
        if (!Array.isArray(data.mcps) || data.mcps.length === 0) { host.innerHTML = ''; return; }
        host.innerHTML = data.mcps.map(m => {
          const klass = !m.configured ? 'unconfigured' : (m.alive ? 'alive' : 'dead');
          const lat = m.latencyMs != null ? ` · ${m.latencyMs}ms` : '';
          const title = !m.configured
            ? `${m.name}: nicht konfiguriert (env ${m.name === 'bmf-lane1' ? 'BMF_MCP_URL' : 'ELSTER_MCP_URL'} fehlt)`
            : `${m.name}: ${m.alive ? 'online' : 'offline'} · ${m.url}${m.error ? ' · ' + m.error : ''}`;
          return `<span class="mcp-dot" title="${escapeHtml(title)}">
            <span class="mcp-dot-orb ${klass}"></span>
            <span>${escapeHtml(m.name)}${lat}</span>
          </span>`;
        }).join('');
      } catch {
        host.innerHTML = '';
      }
    }

    async function loadInstance() {
      const res = await fetch(`/api/applications/${encodeURIComponent(APP_ID)}/instances/${encodeURIComponent(CASE_ID)}`);
      if (!res.ok) {
        document.getElementById('case-display').textContent = 'Fall nicht gefunden';
        return;
      }
      instance = await res.json();
      document.getElementById('case-title').textContent = instance.displayName;
      document.getElementById('case-display').textContent = instance.displayName;
      document.getElementById('case-meta').textContent =
        `${instance.caseId} · Mandant ${instance.mandantId || '—'} · ${instance.veranlagungsjahr ?? '—'} · ${instance.status}`;
      renderRuns();
      // Buttons-Logik
      const canSeal = instance.runs.length > 0 && instance.status === 'in_bearbeitung';
      const canExport = instance.status === 'versiegelt';
      const isSealed = instance.status === 'versiegelt' || instance.status === 'eingereicht';
      document.getElementById('btn-seal').disabled = !canSeal;
      document.getElementById('btn-export').disabled = !canExport;
      // Download-Links erscheinen erst nach Versiegelung. URLs zeigen direkt
      // auf den token-freien Application-Download-Endpoint.
      const dlMaster = document.getElementById('btn-dl-master');
      const dlEric = document.getElementById('btn-dl-eric');
      const base = `/api/applications/${encodeURIComponent(APP_ID)}/instances/${encodeURIComponent(CASE_ID)}/download`;
      dlMaster.hidden = !isSealed;
      dlEric.hidden = !isSealed;
      dlMaster.href = `${base}/master.json`;
      dlEric.href = `${base}/eric.xml`;
      // Letzter Run → canonical_layer laden, falls vorhanden
      if (instance.runs.length > 0) {
        loadLastLayer();
      }
      // Sidebar-Context aktualisieren mit den Fall-Daten
      if (window.__sturmNavRefresh) window.__sturmNavRefresh(instance);
    }

    // Run-Detail-Cache, damit das Modal flott aufgeht beim zweiten Klick.
    const runSummaryCache = new Map();
    async function loadRunSummary(runId) {
      if (runSummaryCache.has(runId)) return runSummaryCache.get(runId);
      const r = await fetch(`/api/applications/${encodeURIComponent(APP_ID)}/instances/${encodeURIComponent(CASE_ID)}/runs/${encodeURIComponent(runId)}/summary`);
      if (!r.ok) return null;
      const data = await r.json();
      runSummaryCache.set(runId, data);
      return data;
    }

    function fmtMs(ms) {
      if (ms == null) return '—';
      if (ms < 1000) return `${ms} ms`;
      return `${(ms / 1000).toFixed(1)} s`;
    }
    function stateClass(s) {
      return s === 'ok' ? 'ok' : s === 'error' ? 'error' : s === 'partial' ? 'partial' : 'unknown';
    }

    function renderRuns() {
      const host = document.getElementById('runs');
      if (!instance.runs.length) {
        host.innerHTML = '<div class="empty">Noch keine Runs. Lade ein Dokument hoch, um den extraction-Workflow zu starten.</div>';
        return;
      }
      // Erst rohe Run-Zeilen rendern, danach Summaries async laden + nachfüllen.
      host.innerHTML = instance.runs.slice().reverse().map((rid, i) => `
        <div class="run-row" data-run-id="${escapeHtml(rid)}">
          <span class="run-state"><i data-lucide="play"></i></span>
          <div>
            <div>Run ${instance.runs.length - i}</div>
            <div class="run-id">${escapeHtml(rid)}</div>
            <div class="run-meta" data-run-when>…</div>
          </div>
          <span class="run-meta" data-run-fields>…</span>
          <span class="run-state-badge unknown" data-run-state>…</span>
          <button class="run-meta" data-run-detail="${escapeHtml(rid)}"
                  style="background:transparent; border:1px solid var(--color-border); padding:3px 9px; border-radius:5px; cursor:pointer; color: var(--color-text-secondary);">Details</button>
        </div>
      `).join('');
      window.lucide && window.lucide.createIcons();

      // Summaries asynchron nachladen + Zellen befüllen.
      for (const rid of instance.runs) {
        loadRunSummary(rid).then(sum => {
          if (!sum) return;
          const row = host.querySelector(`[data-run-id="${CSS.escape(rid)}"]`);
          if (!row) return;
          row.querySelector('[data-run-when]').textContent =
            (sum.startedAt ? new Date(sum.startedAt).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'medium' }) : '—')
            + (sum.totalMs != null ? ` · ${fmtMs(sum.totalMs)}` : '');
          row.querySelector('[data-run-fields]').textContent = `${sum.fields ?? 0} Felder`;
          const badge = row.querySelector('[data-run-state]');
          badge.className = `run-state-badge ${stateClass(sum.state)}`;
          badge.textContent = sum.state || '—';
        }).catch(() => { /* tolerant */ });
      }

      // Modal-Trigger
      host.querySelectorAll('[data-run-detail]').forEach(btn => {
        btn.addEventListener('click', () => openRunDetail(btn.dataset.runDetail));
      });
    }

    async function openRunDetail(runId) {
      const modal = document.getElementById('run-detail');
      const body = document.getElementById('run-detail-body');
      body.innerHTML = '<p style="color: var(--color-text-tertiary);">Lade…</p>';
      modal.classList.add('open');
      const sum = await loadRunSummary(runId);
      if (!sum) {
        body.innerHTML = '<p style="color: #ef4444;">Run-Zusammenfassung nicht ladbar.</p>';
        return;
      }
      const stagesHtml = (sum.stages || []).map(st => `
        <div class="run-detail-stage">
          <span class="run-detail-stage-state ${escapeHtml(st.state)}"></span>
          <span class="run-detail-stage-id">${escapeHtml(st.id)}</span>
          <span class="run-detail-stage-ms">${fmtMs(st.ms)}</span>
          <span class="run-state-badge ${stateClass(st.state === 'ok' ? 'ok' : st.state === 'error' ? 'error' : 'unknown')}">${escapeHtml(st.state)}</span>
        </div>
        ${st.error ? `<div style="font-size:11.5px; color:#ef4444; padding: 4px 14px;">${escapeHtml(st.error)}</div>` : ''}
      `).join('');
      body.innerHTML = `
        <h3>${escapeHtml(sum.workflowId || '?')}</h3>
        <p class="run-detail-meta">
          ${escapeHtml(runId)} ·
          ${sum.startedAt ? new Date(sum.startedAt).toLocaleString('de-DE') : '—'} ·
          ${fmtMs(sum.totalMs)} ·
          <span class="run-state-badge ${stateClass(sum.state)}">${escapeHtml(sum.state || '—')}</span> ·
          ${sum.fields ?? 0} Felder
        </p>
        <div class="run-detail-stages">${stagesHtml || '<p style="color: var(--color-text-tertiary);">Keine Stage-Informationen.</p>'}</div>
        <div style="margin-top: 14px; text-align: right;">
          <a class="fall-btn" href="/pipeline.html?workflow=${encodeURIComponent(sum.workflowId || '')}&run=${encodeURIComponent(runId)}" target="_blank">In Pipeline öffnen ↗</a>
        </div>
      `;
    }
    function closeRunDetail() {
      document.getElementById('run-detail').classList.remove('open');
    }

    async function loadLastLayer() {
      try {
        const res = await fetch(`/api/applications/${encodeURIComponent(APP_ID)}/instances/${encodeURIComponent(CASE_ID)}/result`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data?.canonical_layer || typeof data.canonical_layer !== 'object') {
          document.getElementById('layer-panel').hidden = true;
          return;
        }
        renderLayer(data.canonical_layer, data.source, data.stats);
      } catch (e) {
        console.warn('result load failed:', e);
      }
    }

    // Letzter Layer wird gecached, damit der "Format-Varianten zeigen"-
    // Toggle nicht jedes Mal /result neu laden muss.
    let lastLayer = null;
    let lastLayerFromStage = null;
    let lastLayerStats = null;

    function buildLayerRows(layer, showAllVariants) {
      if (showAllVariants) {
        // Original-Reihenfolge: alle eCodes einzeln.
        return Object.entries(layer).slice(0, 400).map(([eCode, v]) => ({
          primary: eCode, additional: [],
          label: v?.drucktext || eCode,
          value: v?.normalized != null ? String(v.normalized) : (v?.value ?? ''),
          anlage: v?.anlage ?? '',
          vz: v?.vordruckzeile ?? '',
          origin: v?.origin ?? '',
        }));
      }
      const grouped = new Map();
      for (const [eCode, v] of Object.entries(layer)) {
        const label = v?.drucktext || eCode;
        const value = v?.normalized != null ? String(v.normalized) : (v?.value ?? '');
        const anlage = v?.anlage ?? '';
        const vz = v?.vordruckzeile ?? '';
        const origin = v?.origin ?? '';
        const key = `${anlage}|${vz}|${label}|${value}|${origin}`;
        const ex = grouped.get(key);
        if (!ex) {
          grouped.set(key, { primary: eCode, additional: [], label, value, anlage, vz, origin });
        } else {
          ex.additional.push(eCode);
        }
      }
      return Array.from(grouped.values());
    }

    function paintLayer() {
      if (!lastLayer) return;
      const showAll = document.getElementById('layer-show-all').checked;
      const groups = buildLayerRows(lastLayer, showAll);
      const totalSourceCodes = Object.keys(lastLayer).length;
      const originSummary = lastLayerStats?.byOrigin
        ? Object.entries(lastLayerStats.byOrigin).map(([o, n]) => `${o}=${n}`).join(' · ')
        : '';
      document.getElementById('layer-sub').textContent =
        `aus Stage: ${lastLayerFromStage} · ${totalSourceCodes} eCodes` +
        (showAll ? '' : ` · ${groups.length} sichtbar nach Dedup`) +
        (originSummary ? ` · ${originSummary}` : '');
      const rows = groups.slice(0, 400).map(g => {
        const safeOrigin = String(g.origin).replace(/[^A-Za-z0-9_%]/g, '_');
        const codeBadge = g.additional.length > 0 ? `${g.primary} (+${g.additional.length})` : g.primary;
        const codeTitle = g.additional.length > 0
          ? `eCode-Varianten: ${[g.primary, ...g.additional].join(', ')}`
          : '';
        return `<tr>
          <td style="font-family: ui-monospace, monospace; font-size: 11.5px;" title="${escapeHtml(codeTitle)}">${escapeHtml(codeBadge)}</td>
          <td>${escapeHtml(g.label)}</td>
          <td>${escapeHtml(g.anlage)}${g.vz ? ' Z.' + escapeHtml(g.vz) : ''}</td>
          <td>${escapeHtml(g.value)}</td>
          <td><span class="origin-pill ${safeOrigin}">${escapeHtml(g.origin)}</span></td>
        </tr>`;
      }).join('');
      document.getElementById('layer-rows').innerHTML = rows || '<tr><td colspan="5" style="color: var(--color-text-tertiary);">Layer leer.</td></tr>';
    }

    function renderLayer(layer, fromStage, stats) {
      document.getElementById('layer-panel').hidden = false;
      lastLayer = layer;
      lastLayerFromStage = fromStage;
      lastLayerStats = stats || null;
      paintLayer();
    }

    // ── Upload + SSE ────────────────────────────────────────────────────
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    const dropFile = document.getElementById('drop-file');
    const dropProgress = document.getElementById('drop-progress');
    const dropResult = document.getElementById('drop-result');

    function resetDropZone() {
      drop.classList.remove('busy');
      dropFile.hidden = true; dropFile.textContent = '';
      dropProgress.hidden = true;
      dropProgress.classList.remove('indeterminate');
      document.getElementById('drop-progress-fill').style.width = '0%';
      const stageEl = document.getElementById('drop-stage');
      stageEl.hidden = true; stageEl.innerHTML = '';
      dropResult.hidden = true; dropResult.textContent = '';
      dropResult.classList.remove('err');
      fileInput.value = '';
    }
    function showSelectedFile(file) {
      dropFile.hidden = false;
      dropFile.textContent = `${file.name} · ${(file.size / 1024).toFixed(1)} KB`;
    }

    drop.addEventListener('dragover', e => {
      e.preventDefault();
      if (!drop.classList.contains('busy')) drop.classList.add('dragging');
    });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('dragging');
      if (drop.classList.contains('busy')) return;
      if (e.dataTransfer.files?.[0]) startUpload(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => {
      if (drop.classList.contains('busy')) return;
      if (e.target.files?.[0]) startUpload(e.target.files[0]);
    });

    async function startUpload(file) {
      document.getElementById('upload-err').textContent = '';
      document.getElementById('events').textContent = '';
      document.getElementById('events-panel').hidden = false;

      resetDropZone();
      drop.classList.add('busy');
      showSelectedFile(file);
      dropProgress.hidden = false;
      dropProgress.classList.add('indeterminate');
      const stageEl = document.getElementById('drop-stage');
      const fillEl = document.getElementById('drop-progress-fill');
      stageEl.hidden = false;
      stageEl.innerHTML = '<span>Datei wird hochgeladen…</span>';

      const fd = new FormData();
      fd.append('file', file);
      let res;
      try {
        res = await fetch(`/api/applications/${encodeURIComponent(APP_ID)}/instances/${encodeURIComponent(CASE_ID)}/upload`, {
          method: 'POST',
          body: fd,
        });
      } catch (e) {
        dropProgress.hidden = true;
        drop.classList.remove('busy');
        dropResult.hidden = false; dropResult.classList.add('err');
        dropResult.textContent = `Netzwerk-Fehler: ${e?.message || e}`;
        return;
      }
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        dropProgress.hidden = true;
        drop.classList.remove('busy');
        dropResult.hidden = false; dropResult.classList.add('err');
        dropResult.textContent = j.error || `HTTP ${res.status}`;
        return;
      }
      // Stream SSE
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      const ev = document.getElementById('events');
      let stagesDone = 0;
      let lastStage = '';
      let runState = null;
      let stageCount = 0;       // wird mit run_meta gesetzt
      let activeStage = null;   // aktuell laufende Stage-ID
      let stageStartedAt = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop() ?? '';
        for (const p of parts) {
          const m = /^data:\s*(.+)$/m.exec(p);
          if (!m) continue;
          try {
            const obj = JSON.parse(m[1]);
            ev.textContent += `[${obj.stageId ?? '·'}] ${obj.name}\n`;
            ev.scrollTop = ev.scrollHeight;
            // Live-Stage-Indikator
            if (obj.name === 'run_meta') {
              stageCount = (obj.payload?.stages || []).length || 0;
              dropProgress.classList.remove('indeterminate');
              fillEl.style.width = '0%';
              stageEl.innerHTML = `<span>Workflow gestartet · ${stageCount} Stages</span>`;
            }
            if (obj.name === 'stage_start') {
              activeStage = obj.stageId;
              stageStartedAt = Date.now();
              const idx = stagesDone + 1;
              const pct = stageCount ? Math.min(100, Math.round((stagesDone / stageCount) * 100)) : 30;
              fillEl.style.width = pct + '%';
              stageEl.innerHTML = `<span>Phase <strong>${idx}${stageCount ? '/' + stageCount : ''}</strong> · <strong>${escapeHtml(activeStage || '')}</strong> läuft…</span>`;
            }
            if (obj.name === 'stage_done') {
              stagesDone++;
              const pct = stageCount ? Math.min(100, Math.round((stagesDone / stageCount) * 100)) : 50;
              fillEl.style.width = pct + '%';
              lastStage = obj.stageId || lastStage;
              const ms = Date.now() - stageStartedAt;
              stageEl.innerHTML = `<span>Phase <strong>${stagesDone}${stageCount ? '/' + stageCount : ''}</strong> · ${escapeHtml(obj.stageId || '')} fertig <span style="color: var(--color-text-tertiary);">(${ms} ms)</span></span>`;
            }
            if (obj.name === 'stage_error') {
              fillEl.style.background = '#ef4444';
              stageEl.innerHTML = `<span style="color: #ef4444;">Stage <strong>${escapeHtml(obj.stageId || '')}</strong>: Fehler — ${escapeHtml(JSON.stringify(obj.payload?.error || obj.payload || {}).slice(0, 120))}</span>`;
            }
            if (obj.name === 'run_done') {
              runState = 'ok';
              fillEl.style.width = '100%';
            }
            if (obj.name === 'run_error') {
              runState = 'error';
              fillEl.style.background = '#ef4444';
            }
          } catch { /* ignore */ }
        }
      }
      // Result-Summary in der Drop-Zone
      dropProgress.hidden = true;
      drop.classList.remove('busy');
      dropResult.hidden = false;
      if (runState === 'ok') {
        dropResult.classList.remove('err');
        dropResult.textContent = `✓ Extraktion abgeschlossen · ${stagesDone} Stages`;
      } else {
        dropResult.classList.add('err');
        dropResult.textContent = runState === 'error' ? '✕ Extraktion fehlgeschlagen (siehe Events)' : '⚠ Stream unerwartet beendet';
      }
      // Re-load instance & layer after run finishes
      await loadInstance();
    }

    // ── Seal / Export ───────────────────────────────────────────────────
    function showSealResult(html, kind /* 'ok' | 'err' | 'warn' */) {
      const panel = document.getElementById('seal-panel');
      const out = document.getElementById('seal-result');
      out.innerHTML = html;
      out.dataset.kind = kind;
      panel.hidden = false;
    }

    document.getElementById('btn-seal').addEventListener('click', async () => {
      showSealResult('<div style="color: var(--color-text-tertiary);">Versiegelung läuft…</div>', 'warn');
      const res = await fetch(`/api/applications/${encodeURIComponent(APP_ID)}/instances/${encodeURIComponent(CASE_ID)}/seal`, { method: 'POST' });
      const ct = res.headers.get('content-type') || '';

      // Sync-JSON-Antwort (Pre-Seal-Validierung schlug fehl oder anderer Sync-Fehler)
      if (ct.includes('application/json')) {
        const j = await res.json().catch(() => ({}));
        if (res.status === 409 && j.error === 'missing-pflicht-fields' && Array.isArray(j.missing)) {
          const rows = j.missing.slice(0, 50).map(m => `
            <tr>
              <td style="font-family: ui-monospace, monospace; font-size: 11.5px;">${escapeHtml(m.eCode)}</td>
              <td>${escapeHtml(m.drucktext || '')}</td>
              <td>${escapeHtml(m.anlage || '')}${m.vordruckzeile ? ' Z.' + escapeHtml(m.vordruckzeile) : ''}</td>
            </tr>
          `).join('');
          showSealResult(`
            <div style="color: #ef4444; font-weight: 500; margin-bottom: 8px;">${escapeHtml(j.message || 'Pflicht-Felder fehlen')}</div>
            <table class="layer-table">
              <thead><tr><th>eCode</th><th>Drucktext</th><th>Anlage</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <p class="panel-sub" style="margin-top: 10px;">Erkannte Anlagen: ${(j.anlagen || []).join(', ') || '—'}. Wert eintragen (z.B. neues Dokument hochladen) und erneut versiegeln.</p>
          `, 'err');
          return;
        }
        if (res.status === 501) {
          showSealResult(`<div style="color: #ef4444;">Versiegelung nicht verfügbar: ${escapeHtml(j.message || j.error || '')}</div>`, 'err');
          return;
        }
        if (!res.ok) {
          showSealResult(`<div style="color: #ef4444;">Fehler ${res.status}: ${escapeHtml(j.error || '')}${j.message ? ' — ' + escapeHtml(j.message) : ''}</div>`, 'err');
          return;
        }
        showSealResult('<div style="color: #059669;">✓ Versiegelt.</div>', 'ok');
        await loadInstance();
        return;
      }

      // SSE-Stream (Validation OK, seal-Workflow läuft)
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let merkleRoot = null;
      let stagesDone = 0;
      let lastStageError = null;
      let runState = null;
      const events = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop() ?? '';
        for (const p of parts) {
          const m = /^data:\s*(.+)$/m.exec(p);
          if (!m) continue;
          try {
            const obj = JSON.parse(m[1]);
            events.push(`[${obj.stageId ?? '·'}] ${obj.name}`);
            if (obj.name === 'merkle_computed') merkleRoot = obj.payload?.root;
            if (obj.name === 'stage_done') stagesDone++;
            if (obj.name === 'stage_error') lastStageError = { stage: obj.stageId, payload: obj.payload };
            if (obj.name === 'run_done') runState = 'ok';
            if (obj.name === 'run_error') runState = 'error';
          } catch { /* ignore */ }
        }
      }
      if (runState === 'ok') {
        showSealResult(`
          <div style="color: #059669; font-weight: 500; margin-bottom: 4px;">✓ Fall versiegelt · ${stagesDone} Stages</div>
          ${merkleRoot ? `<div style="font-size: 11.5px; color: var(--color-text-tertiary); font-family: ui-monospace, monospace;">Merkle-Root: ${escapeHtml(merkleRoot)}</div>` : ''}
        `, 'ok');
        await loadInstance();
      } else {
        showSealResult(`
          <div style="color: #ef4444; font-weight: 500; margin-bottom: 4px;">✕ Versiegelung fehlgeschlagen</div>
          ${lastStageError ? `<div style="font-size: 12px;">Stage <code>${escapeHtml(lastStageError.stage)}</code>: ${escapeHtml(JSON.stringify(lastStageError.payload).slice(0, 240))}</div>` : ''}
          <details style="margin-top: 8px;"><summary style="cursor: pointer; font-size: 12px; color: var(--color-text-secondary);">Event-Log</summary>
            <pre style="font-size: 11px; color: var(--color-text-tertiary); margin: 6px 0 0; max-height: 200px; overflow: auto;">${escapeHtml(events.join('\n'))}</pre>
          </details>
        `, 'err');
      }
    });

    document.getElementById('btn-export').addEventListener('click', async () => {
      const res = await fetch(`/api/applications/${encodeURIComponent(APP_ID)}/instances/${encodeURIComponent(CASE_ID)}/export`, { method: 'POST' });
      const j = await res.json().catch(() => ({}));
      if (j.erfolg === false) {
        alert(`Export nicht möglich: ${j.message || j.reason}`);
      } else if (res.ok) {
        alert(`An ELSTER gesendet: Einreichungs-ID ${j.einreichungs_id}`);
        await loadInstance();
      } else {
        alert(`Fehler: ${j.error || res.status}`);
      }
    });

    // Sidebar einmal rendern, Context-Refresh wenn die Instance da ist.
    import('/nav.js').then(({ renderSturmNav, contextRendererSteuerfall }) => {
      let lastInstance = null;
      window.__sturmNavRefresh = (inst) => {
        lastInstance = inst;
        const ctxHost = document.getElementById('sturm-nav-context');
        if (ctxHost) {
          contextRendererSteuerfall(ctxHost, { appId: APP_ID, caseId: CASE_ID, instance: inst });
          window.lucide && window.lucide.createIcons();
        }
      };
      renderSturmNav({
        activeNav: 'anwendungen',
        contextHeading: 'Steuerfall',
        contextRenderer: (host) => contextRendererSteuerfall(host, { appId: APP_ID, caseId: CASE_ID, instance: lastInstance }),
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      window.lucide && window.lucide.createIcons();
      loadInstance();
      loadMcpHealth();
      document.getElementById('theme-btn').addEventListener('click', () => {
        const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        applyTheme(next);
      });
      // Run-Detail-Modal schließen: Klick außerhalb der Box oder Esc.
      document.getElementById('run-detail').addEventListener('click', (e) => {
        if (e.target.id === 'run-detail') closeRunDetail();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeRunDetail();
      });
      // Dedup-Toggle
      document.getElementById('layer-show-all').addEventListener('change', paintLayer);
    });
  </script>
</body>
</html>
