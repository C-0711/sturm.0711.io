<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STURM</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('sturm-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/design-system/sturm.css" />
  <link rel="stylesheet" href="/neo-tokens.css?v=20260525" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ----- app-specific ----- */
    .wf-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 32px;
    }
    @media (max-width: 1080px) { .wf-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 720px) { .wf-grid { grid-template-columns: 1fr; } }

    .app-card {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .app-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }
    .app-card-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.015em;
      margin: 0;
    }
    .app-card-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
    .app-card-desc {
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.55;
      margin: 0;
      max-width: 72ch;
    }
    .app-card-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 0;
    }
    .accordion {
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 150ms ease;
    }
    .accordion:hover { border-color: var(--line); }
    .accordion-l { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
    .accordion-l .caret { color: var(--ink-3); }
    .accordion-r { display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .stat-dot {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ink-3);
    }
    .stat-dot .dot {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .stat-dot.ok .dot { background: var(--ok); }
    .stat-dot.warn .dot { background: var(--warn); }
    .stat-dot.err .dot { background: var(--err); }

    .search-input {
      width: 240px;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      color: var(--ink);
      font-size: 13px;
    }
    .search-input::placeholder { color: var(--ink-3); }
    .search-input:focus { outline: 0; border-color: var(--line); }

    .empty-state {
      padding: 56px 24px;
      border: 1px dashed var(--line-2);
      border-radius: var(--radius-lg);
      text-align: center;
      color: var(--ink-3);
      font-size: 13px;
    }

    .runner-list { display: flex; flex-direction: column; gap: 8px; margin-top: 32px; }
    .run-row {
      display: grid;
      grid-template-columns: 14px 200px 1fr auto auto;
      align-items: center;
      gap: 20px;
      padding: 14px 18px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      transition: border-color 150ms ease, background 150ms ease;
      cursor: pointer;
    }
    .run-row:hover { border-color: var(--line); background: oklch(0.245 0.005 80); }
    .run-dot { width: 8px; height: 8px; border-radius: 50%; }
    .run-name { font-size: 14px; color: var(--ink); font-weight: 500; }
    .run-pipeline { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
    .run-stages { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
    .run-arr { padding: 0 6px; color: var(--ink-4); }
    .run-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); text-align: right; min-width: 80px; }
    .run-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); }

    .case-card {
      padding: 20px 24px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
    }
    .case-card:hover { border-color: var(--line); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Production React UMD (no babel runtime, no dev build) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="/app.bundle.js?v=20260525c"></script>
</body>
</html>
